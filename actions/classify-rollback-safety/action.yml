name: Classify Rollback Safety
description: >-
  Advisory EXPAND/CONTRACT classification of the migrations added between the
  release currently in production and the promoted candidate — plain .sql files
  and Rails .rb migrations. Determines whether the previous image can still run
  against the new schema. ADVISORY ONLY — this action never fails; it always
  reports safe | unsafe | unclassified.
inputs:
  github-token:
    description: Token with read access to the app repo (compare + contents APIs).
    required: true
  repository:
    description: owner/repo of the app whose migrations to classify.
    required: true
  base-sha:
    description: >-
      Git sha of the release currently in production (the rollback target).
      Empty ⇒ verdict unclassified (no production baseline; e.g. first promote).
    required: false
  head-sha:
    description: >-
      Git sha of the promoted candidate (head of the migration diff).
      Empty ⇒ verdict unclassified.
    required: false
  migrations-path:
    description: >-
      Repo-relative directory of the app's migration files — plain .sql (e.g.
      drizzle) or Rails .rb (e.g. db/migrate) — from the app's
      CruApplicationInfo MigrationsPath. Empty ⇒ unclassified, unless
      `migrations` declares none.
    required: false
  migrations:
    description: >-
      The app's CruApplicationInfo Migrations declaration. "none" means the app
      HAS no database migrations ⇒ verdict safe, decided without any compare
      (an absent migrations-path cannot say this: it also covers "has migrations
      we cannot see"). A non-empty migrations-path takes precedence.
    required: false
outputs:
  verdict:
    description: safe | unsafe | unclassified.
  reasons:
    description: JSON array (string) of human-readable classification reasons.

runs:
  using: 'node24'
  main: '../../dist/classify-rollback-safety.js'
