name: Rollback

# Roll production back to a previously promoted release. The release tag is
# resolved to its digest in the shared registry and redeployed to production.
#
# Multi-provider router (D9 pattern at job level): a `lookup` job runs the authz
# gate, the app-info fetch, and release-tag normalization, and outputs the
# provider + type + prod project-id + normalized release tag.
#
# Authz checks the account that started the current run attempt, and it runs
# twice. `lookup` runs it so a refused run stops early. Each provider job runs
# it again as its first step, because "Re-run failed jobs" re-runs only the
# failed jobs and reuses a `lookup` that passed in an earlier attempt. Without
# the second check, that kind of re-run would change production with no check
# of who started it.
#
# Stale-rollback guard: a caller that knows which release production was
# running when it asked for the rollback passes it as expected-current-release.
# Each provider job checks it first, inside the production lock, and refuses
# the rollback if production has since moved to a different release. A caller
# can also pass expected-previous-release, the release it expects production
# ran just before the current one. It must name the same release as `release`,
# and the same check refuses the rollback unless the ledger agrees.
#
# NOTE: automatic "previous release" selection (roll back to release-<n-1>
# without naming it) lands in a later v2 pass; for now the target release is an
# explicit input.

on:
  workflow_call:
    inputs:
      workflow-ref:
        type: string
        required: false
        default: main
        description: Branch, tag or commit of CruGlobal/.github to check the actions out at.
      project-name:
        type: string
        required: true
        description: Project name (shared-registry repo/image).
      release:
        type: string
        required: true
        description: Release to roll back to, e.g. release-10012 or bare 10012.
      trusted-automation-actor-ids:
        type: string
        required: false
        default: ''
        description: >-
          Comma-separated numeric GitHub user ids of automation accounts allowed
          to roll back without per-repo push access. Empty allows none.
      expected-current-release:
        type: string
        required: false
        default: ''
        description: >-
          When set, the rollback is refused unless production is still running
          this release (release-[<yyyy-mm-dd>-]<n>, the release- prefix is
          optional). Automation sets it to the release it saw live, so a
          rollback that waited behind a newer deploy does not undo it. Empty
          skips the check.
      expected-previous-release:
        type: string
        required: false
        default: ''
        description: >-
          When set, the rollback is refused unless this names the same release
          as `release` and production ran it just before the current release
          (same format as expected-current-release). An automation that
          dispatches a rollback sets it to the release it expects to be rolling
          back to. It does not need expected-current-release. Empty skips the
          check.
    secrets:
      datadog-api-key:
        required: true
        description: DataDog API key.
      authz-token:
        required: true
        description: GitHub token used to verify the triggering actor has push access to the app repo.
      slack-bot-token:
        required: false
        description: Slack bot token for pipeline notifications; unset disables posting.
      flightdeck-token:
        required: false
        description: Flightdeck PAT of the CruDeploy service user, for release-timeline events; unset disables posting.

jobs:
  lookup:
    name: Authorize & look up app info
    runs-on: ubuntu-latest
    # OIDC: the job assumes GitHubDeployECS to read app-info from DynamoDB.
    # contents: read lets it check this repo out for the authz action, which
    # reads permissions with the authz-token PAT.
    permissions:
      id-token: write
      contents: read
    outputs:
      provider: ${{ steps.app-info.outputs.provider }}
      type: ${{ steps.app-info.outputs.type }}
      project-id: ${{ steps.app-info.outputs.project-id }}
      release-tag: ${{ steps.release.outputs.tag }}
      slack-channel: ${{ steps.app-info.outputs.slack-channel }}
      flightdeck-project: ${{ steps.app-info.outputs.flightdeck-project }}
      app-url: ${{ steps.app-info.outputs.app-url }}
      repository: ${{ steps.app-info.outputs.repository }}
    steps:
      # app-info comes straight from the CruApplicationInfo DynamoDB table rather
      # than the cru-app-info HTTP API -- the pipeline deploys that API itself, so
      # a rollback (the thing you reach for when production is broken) must not
      # depend on it being up. GitHubDeployECS regardless of the app's provider:
      # this runs before the provider/type fan-out, and the role's trust is
      # cru-deploy-repo-scoped, not runtime-scoped (same reasoning as the ledger
      # writes below).
      - name: Configure AWS credentials for app-info
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::056154071827:role/GitHubDeployECS

      # The table is keyed by legacy env names, so translate first.
      - name: Look up app info (production)
        id: app-info
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          V2_ENV: production
        run: |
          case "$V2_ENV" in
            release-candidate) legacy_env=staging ;;
            production) legacy_env=production ;;
            preview) legacy_env=lab ;;
            *) echo "::error::unknown v2 environment $V2_ENV"; exit 1 ;;
          esac
          info=$(aws dynamodb get-item --region us-east-1 --output json \
            --table-name CruApplicationInfo \
            --key "$(jq -n --arg project "$PROJECT_NAME" --arg environment "$legacy_env" \
              '{Project: {S: $project}, Environment: {S: $environment}}')")
          item=$(echo "$info" | jq -c '.Item // empty')
          if [ -z "$item" ]; then
            echo "::error::no CruApplicationInfo row for project '$PROJECT_NAME' environment '$legacy_env' (v2 env $V2_ENV); add the row before rolling back"
            exit 1
          fi
          provider=$(echo "$item" | jq -r '.Provider.S // empty')
          type=$(echo "$item" | jq -r '.Type.S // empty')
          project_id=$(echo "$item" | jq -r '.ProjectId.S // empty')
          slack_channel=$(echo "$item" | jq -r '.SlackChannel.S // empty')
          app_url=$(echo "$item" | jq -r '.AppUrl.S // empty')
          flightdeck_project=$(echo "$item" | jq -r '.FlightdeckProject.S // empty')
          # Repository is written only when the app repo is not named after the project.
          repository=$(echo "$item" | jq -r --arg default "CruGlobal/$PROJECT_NAME" '.Repository.S // $default')
          case "$provider" in
            gcp|aws) ;;
            *) echo "::error::unsupported provider '$provider' for $PROJECT_NAME (expected gcp or aws)"; exit 1 ;;
          esac
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "project-id=$project_id" >> "$GITHUB_OUTPUT"
          echo "slack-channel=$slack_channel" >> "$GITHUB_OUTPUT"
          echo "app-url=$app_url" >> "$GITHUB_OUTPUT"
          echo "flightdeck-project=$flightdeck_project" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "::notice::app-info $PROJECT_NAME/$V2_ENV -> provider=$provider type=$type project=$project_id"

      # The checkout only fetches this repo so the authz action below can run.
      # It holds no production credentials.
      - name: Checkout Cru Actions & Workflows
        uses: actions/checkout@v7
        with:
          repository: CruGlobal/.github
          ref: ${{ inputs.workflow-ref }}
          path: cru-github-actions

      # Authorization, the early copy. It follows the app-info lookups only
      # because the repo is read from the production item (the fleet default
      # CruGlobal/<project-name> otherwise). Each provider job runs the same
      # check again; see the note at the top of this file. A run is allowed in
      # one of two ways:
      #
      #   1. Allowlisted automation actor. The run was dispatched by an account
      #      whose numeric user id (github.actor_id) is in
      #      trusted-automation-actor-ids, AND this attempt was started by that
      #      same account: the same login, and that login still looks up to
      #      the same user id. Automation accounts such as a GitHub App's bot
      #      user are not collaborators on app repos, so the push-access check
      #      below cannot vouch for them. Matched by id, not login alone,
      #      because the id never changes.
      #   2. Push access. Otherwise the account that started THIS attempt
      #      (github.triggering_actor) must have push-level access (admin, write
      #      or maintain) to the app repo. Not github.actor: on a re-run,
      #      github.actor stays the original dispatcher while triggering_actor is
      #      whoever clicked re-run, and the re-runner is the one whose access
      #      matters. That is also why a re-run of an allowlisted actor's run by
      #      anyone else falls through to this check.
      #
      # TODO: replace PAT with a dedicated GitHub App.
      - name: Authorize actor
        uses: ./cru-github-actions/actions/authorize-actor
        with:
          github-token: ${{ secrets.authz-token }}
          repository: ${{ steps.app-info.outputs.repository }}
          operation: roll back
          trusted-automation-actor-ids: ${{ inputs.trusted-automation-actor-ids }}

      # Accept "release-2026-07-23-10056", the same without the "release-"
      # prefix, or just the build number: resolve-image finds a dated release by
      # its bare number (suffix match), and legacy pre-D10 tags resolve directly.
      - name: Normalize release tag
        id: release
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          suffix="${RELEASE#release-}"
          if ! echo "$suffix" | grep -qE '^([0-9]{4}-[0-9]{2}-[0-9]{2}-)?[0-9]+$'; then
            echo "::error::invalid release '$RELEASE'; expected 'release-[<yyyy-mm-dd>-]<n>' (the release- prefix is optional)"
            exit 1
          fi
          echo "tag=release-$suffix" >> "$GITHUB_OUTPUT"

  rollback-gcp:
    name: Roll production back (Cloud Run)
    needs: lookup
    if: needs.lookup.outputs.provider == 'gcp'
    runs-on: ubuntu-latest
    # A backstop for anything the deploy path does not model: without it a job
    # inherits GitHub's six-hour default, and a Cloud Run call that hangs holds
    # a runner for the rest of the morning. Well clear of a real deploy.
    timeout-minutes: 60
    # Shared production lock with promote: only one production mutation per app
    # at a time, and never cancelled mid-flight.
    concurrency:
      group: production-${{ inputs.project-name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_NAME: ${{ inputs.project-name }}
      ENVIRONMENT: production
      DD_API_KEY: ${{ secrets.datadog-api-key }}
    steps:
      - name: Checkout Cru Actions & Workflows
        uses: actions/checkout@v7
        with:
          repository: CruGlobal/.github
          ref: ${{ inputs.workflow-ref }}
          path: cru-github-actions

      # --- Authz for this attempt (inside the production lock) --------------
      # FIRST real step on purpose, before the stale-rollback guard and before
      # any credential is set up. The check in `lookup` does not cover every
      # re-run: "Re-run failed jobs" re-runs only this job and reuses the
      # earlier attempt's `lookup`, so this step is what checks the account
      # that started the re-run. Same rule, same allowlist and same action as
      # `lookup`. The checkout above only fetches this repo and holds no
      # production credentials.
      - name: Authorize the account that started this attempt
        uses: ./cru-github-actions/actions/authorize-actor
        with:
          github-token: ${{ secrets.authz-token }}
          repository: ${{ needs.lookup.outputs.repository }}
          operation: roll back
          trusted-automation-actor-ids: ${{ inputs.trusted-automation-actor-ids }}

      # --- Stale-rollback guard (inside the production lock) ---------------
      # Runs right after the authz check and before anything is resolved or
      # deployed, on purpose. This job's concurrency group is the production
      # lock it shares with promote, so every step here runs while the job
      # holds it, and no other promote or rollback of this app can start until
      # the job ends. A rollback that queued behind a promote sees that
      # promote's result here, before any image is resolved or deployed. That
      # is also why the check lives in the provider jobs and not in `lookup`,
      # which runs outside the lock.
      #
      # Both inputs unset => no check (the usual case for a person rolling back
      # by hand). expected-current-release set => the newest production row in
      # the deployment ledger must name that release. expected-previous-release
      # set => it must name the release this rollback goes to, and the release
      # production ran just before the current one must be that release, so a
      # caller can say which release it expects to be rolling back to. Either
      # can be set without the other, and a failed check refuses the rollback.
      # It fails CLOSED: a ledger that can't be read, or doesn't say what
      # production runs, is a refusal, not a pass.
      #
      # Known, accepted gap: the ledger writes in promote (and in this workflow)
      # are best-effort (continue-on-error), so a newer deploy whose ledger
      # write failed is invisible here and the rollback would go ahead. For the
      # same reason, a release with no ledger row is skipped over when finding
      # the release that ran before the current one.
      - name: Refuse a stale rollback
        env:
          EXPECTED_CURRENT_RELEASE: ${{ inputs.expected-current-release }}
          EXPECTED_PREVIOUS_RELEASE: ${{ inputs.expected-previous-release }}
          TARGET_RELEASE: ${{ needs.lookup.outputs.release-tag }}
        run: |
          if [ -z "$EXPECTED_CURRENT_RELEASE" ] && [ -z "$EXPECTED_PREVIOUS_RELEASE" ]; then
            echo "::notice::expected-current-release is not set, so this rollback does not check what production is running first"
            exit 0
          fi

          # Same rules as "Normalize release tag" (the release- prefix is optional on
          # both sides), and surrounding whitespace is trimmed as well. Prints the
          # tag without its prefix, or fails if it is not a release tag.
          normalize() {
            local value="$1"
            if [[ "$value" =~ ^[[:space:]]*([^[:space:]].*[^[:space:]]|[^[:space:]])[[:space:]]*$ ]]; then
              value="${BASH_REMATCH[1]}"
            fi
            value="${value#release-}"
            [[ "$value" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2}-)?[0-9]+$ ]] && printf '%s' "$value"
          }
          if [ -n "$EXPECTED_CURRENT_RELEASE" ] && ! expected=$(normalize "$EXPECTED_CURRENT_RELEASE"); then
            echo "::error::invalid expected-current-release '$EXPECTED_CURRENT_RELEASE'; expected 'release-[<yyyy-mm-dd>-]<n>' (the release- prefix is optional)"
            exit 1
          fi
          if [ -n "$EXPECTED_PREVIOUS_RELEASE" ]; then
            if ! expected_previous=$(normalize "$EXPECTED_PREVIOUS_RELEASE"); then
              echo "::error::invalid expected-previous-release '$EXPECTED_PREVIOUS_RELEASE'; expected 'release-[<yyyy-mm-dd>-]<n>' (the release- prefix is optional)"
              exit 1
            fi
            # The check only means something when it names the release this
            # rollback goes to. TARGET_RELEASE is already normalized.
            target="${TARGET_RELEASE#release-}"
            if [ "$expected_previous" != "$target" ]; then
              if [[ "$target" == *"-$expected_previous" || "$expected_previous" == *"-$target" ]]; then
                echo "::error::expected-previous-release '$EXPECTED_PREVIOUS_RELEASE' and the release input ($TARGET_RELEASE) have the same build number, but only one is a dated tag; pass the same full tag in both. Refusing to roll back"
              else
                echo "::error::expected-previous-release '$EXPECTED_PREVIOUS_RELEASE' is not the release this rollback goes to ($TARGET_RELEASE); it must name the same release as the release input. Refusing to roll back"
              fi
              exit 1
            fi
          fi

          # Fail closed from here on: without a trustworthy answer to "what is
          # production running", refuse rather than guess.
          if [ -n "$EXPECTED_CURRENT_RELEASE" ]; then
            unconfirmed="cannot confirm production is still running release-$expected; refusing to roll back"
          else
            unconfirmed="cannot confirm which release production ran before the current one; refusing to roll back"
          fi
          # One read serves both checks. It asks for 10 rows, not 2, because a
          # re-run or a re-promote writes the same Revision more than once.
          if ! body=$(curl -fsS --max-time 20 --retry 2 --retry-delay 3 \
              "https://deploys.cru.org/deployments?project=$PROJECT_NAME&environment=production&limit=10"); then
            echo "::error::could not read the deployment ledger for $PROJECT_NAME, so $unconfirmed"
            exit 1
          fi
          if ! count=$(printf '%s' "$body" | jq -er '.Items | if type == "array" then length else error("no Items array") end' 2>/dev/null); then
            echo "::error::the deployment ledger for $PROJECT_NAME returned an unexpected response (not JSON with an Items array), so $unconfirmed"
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::the deployment ledger has no production rows for $PROJECT_NAME, so $unconfirmed"
            exit 1
          fi
          current=$(printf '%s' "$body" | jq -r '.Items[0].Revision | if type == "string" then . else "" end' 2>/dev/null) || current=""
          if [ -z "$current" ]; then
            echo "::error::the newest production row in the deployment ledger for $PROJECT_NAME has no Revision, so $unconfirmed"
            exit 1
          fi

          if [ -n "$EXPECTED_CURRENT_RELEASE" ] && [ "${current#release-}" != "$expected" ]; then
            if [[ "$expected" =~ ^[0-9]+$ ]] && [[ "$current" == *"-$expected" ]]; then
              echo "::error::expected-current-release '$EXPECTED_CURRENT_RELEASE' is a bare build number, but production's release tag is dated ($current); pass the full tag. Refusing to roll back"
            else
              echo "::error::production is now running $current, not release-$expected; refusing a rollback that would undo a newer deploy"
            fi
            exit 1
          fi

          # The release production ran before the current one is the first row
          # after the newest whose Revision is different. Promote and rollback
          # both write a production row, so the rows, newest first, are the
          # order releases ran in. A re-run or a re-promote writes the same
          # Revision again, so the very next row can still be the current one.
          if [ -n "$EXPECTED_PREVIOUS_RELEASE" ]; then
            unknown_previous="cannot confirm which release production ran before $current; refusing to roll back"
            if ! previous=$(printf '%s' "$body" | jq -er --arg current "${current#release-}" '
                [.Items[1:][] | (.Revision? // "") | if type == "string" then . else "" end]
                | map(select(ltrimstr("release-") != $current)) | .[0] // error("none")' 2>/dev/null); then
              echo "::error::the deployment ledger for $PROJECT_NAME has no production row for any release other than $current (rows read: $count), so $unknown_previous"
              exit 1
            fi
            if [ -z "$previous" ]; then
              echo "::error::the production row that comes before $current in the deployment ledger for $PROJECT_NAME has no Revision, so $unknown_previous"
              exit 1
            fi
            if [ "${previous#release-}" != "$expected_previous" ]; then
              if [[ "$expected_previous" =~ ^[0-9]+$ ]] && [[ "$previous" == *"-$expected_previous" ]]; then
                echo "::error::expected-previous-release '$EXPECTED_PREVIOUS_RELEASE' is a bare build number, but the release production ran before $current is dated ($previous); pass the full tag. Refusing to roll back"
              else
                echo "::error::production ran $previous just before $current, not release-$expected_previous; refusing a rollback that would not go back exactly one release"
              fi
              exit 1
            fi
          fi

          if [ -z "$EXPECTED_PREVIOUS_RELEASE" ]; then
            echo "::notice::production is still running $current, as expected; going ahead with the rollback"
          elif [ -z "$EXPECTED_CURRENT_RELEASE" ]; then
            echo "::notice::production ran $previous just before $current, as expected; going ahead with the rollback"
          else
            echo "::notice::production is still running $current and ran $previous just before it, as expected; going ahead with the rollback"
          fi

      - name: Configure GCP credentials (production SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: cru-deploy@${{ needs.lookup.outputs.project-id }}.iam.gserviceaccount.com

      - name: Resolve release image
        uses: ./cru-github-actions/actions/resolve-image
        id: resolve
        with:
          type: cloudrun
          project-name: ${{ inputs.project-name }}
          mode: tag
          tag: ${{ needs.lookup.outputs.release-tag }}

      # A bare-number input can resolve to a dated release tag (release-<date>-<n>),
      # so DD_VERSION must reflect the ACTUAL release-* tag on the resolved digest,
      # not the normalized input. Grep the resolved tags for release-*, falling
      # back to the normalized input when (unexpectedly) none is present.
      - name: Determine deployed release tag
        id: actual-release
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          FALLBACK: ${{ needs.lookup.outputs.release-tag }}
        run: |
          release=$(echo "$TAGS" | tr ',' '\n' | grep -E '^release-' | head -n1 || true)
          echo "tag=${release:-$FALLBACK}" >> "$GITHUB_OUTPUT"

      # --- Rollback-safety advisory (read-back; never blocks) --------------
      # The release we are rolling back FROM may have shipped destructive
      # migrations; an image swap does NOT revert the schema. Read the most
      # recent production ledger row carrying a rollback-safety verdict and warn
      # loudly if it was classified unsafe. Public GET; never fails the rollback.
      # The same fetch also yields what production runs RIGHT NOW (the newest
      # event) for the Slack changelog link -- one ledger round trip, two uses.
      - name: Rollback-safety advisory
        id: rollback-safety
        continue-on-error: true
        run: |
          items=$(curl -fsS "https://deploys.cru.org/deployments?project=$PROJECT_NAME&environment=production&limit=10" | jq -c '.Items // []') || items='[]'
          # The release this rollback takes production OFF -- the `to` end of the
          # changelog link (revision name preferred, Sha for rows that predate
          # named revisions). Empty -> the Slack message keeps the run URL.
          echo "previous-revision=$(echo "$items" | jq -r '.[0].Revision // .[0].Sha // empty')" >> "$GITHUB_OUTPUT"
          entry=$(echo "$items" | jq -c 'map(select(.RollbackSafe != null)) | .[0] // empty')
          safe=$(echo "$entry" | jq -r '.RollbackSafe // empty' 2>/dev/null || echo "")
          reasons_json=$(echo "$entry" | jq -r '.RollbackSafeReasons // ""' 2>/dev/null || echo "")
          reasons=""
          if [ -n "$reasons_json" ]; then
            reasons=$(echo "$reasons_json" | jq -r '.[0:2] | join("; ")' 2>/dev/null || echo "")
          fi
          if [ "$safe" = "false" ]; then
            echo "::warning title=Rollback safety::the release being rolled back FROM shipped destructive migrations ($reasons) -- the image swap will NOT revert the schema; verify the target image tolerates the current schema"
            echo "slack=:warning: rolling back FROM a release with destructive migrations ($reasons); this rollback does NOT revert the schema" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Rollback safety::no destructive-migration warning on the release being rolled back from"
            echo "slack=" >> "$GITHUB_OUTPUT"
          fi

      - name: Record deploy start
        run: echo "DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Deploy to production
        uses: ./cru-github-actions/actions/deploy
        with:
          type: cloudrun
          project-name: ${{ inputs.project-name }}
          environment: production
          runtime-project: ${{ needs.lookup.outputs.project-id }}
          image: ${{ steps.resolve.outputs.image }}
          app-url: ${{ needs.lookup.outputs.app-url }}

      - name: Record deployment event in Datadog
        continue-on-error: true
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          ACTOR: ${{ github.actor }}
        run: |
          # sha-<gitsha> tag on the resolved digest -> sha:<gitsha> event tag, so
          # events are joinable to commits (deployments-ledger precursor). Omitted
          # cleanly when the digest carries no sha- tag.
          gitsha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          jq -n \
            --arg title "Rolled back: $PROJECT_NAME to ${{ needs.lookup.outputs.release-tag }}" \
            --arg text "Pipeline v2 production rollback by ${{ github.actor }} (started $DEPLOY_STARTED_AT)" \
            --arg service "$PROJECT_NAME" \
            --arg actor "$ACTOR" \
            --arg gitsha "$gitsha" \
            '{title: $title, text: $text, alert_type: "info",
              aggregation_key: ("deploy:" + $service + ":production"),
              tags: (["source:cru-pipeline-v2", ("service:" + $service),
                     "environment:production", "action:rollback",
                     "revision:${{ needs.lookup.outputs.release-tag }}", "rollback:true",
                     ("actor:" + $actor)]
                     + (if $gitsha != "" then ["sha:" + $gitsha] else [] end))}' \
          | curl -fsS --retry 3 -X POST "https://api.datadoghq.com/api/v1/events" \
              -H "Content-Type: application/json" -H "DD-API-KEY: $DD_API_KEY" -d @- \
            || echo "::warning title=Datadog telemetry failed::rollback event for $PROJECT_NAME ${{ needs.lookup.outputs.release-tag }} not recorded (non-blocking)"

      # The deployments-ledger write grant lives on the existing deploy roles
      # (ratified: no dedicated ledger role). GCP jobs carry no AWS creds, so
      # assume a deploy role here solely to append the ledger event -- ECS is
      # chosen arbitrarily; the trust is cru-deploy-repo-scoped, not runtime-
      # scoped. Placed AFTER all GCP deploy/tag-image steps so its AWS
      # credential env vars can't interfere; configure-aws-credentials next to
      # an earlier google-github-actions/auth is fine (different env vars).
      - name: Configure AWS credentials for ledger
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::056154071827:role/GitHubDeployECS

      # Append the event to the CruDeploymentLedger DynamoDB table (app-info's
      # deployments ledger -- the fleet dashboard / DORA data spine). Same
      # policy as all telemetry: NEVER fails the deploy.
      - name: Record deployment in ledger
        continue-on-error: true
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          ACTOR: ${{ github.actor }}
          REVISION: ${{ steps.actual-release.outputs.tag }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          gitsha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          aws dynamodb put-item --region us-east-1 \
            --table-name CruDeploymentLedger \
            --item "$(jq -n \
              --arg project "$PROJECT_NAME" \
              --arg eventat "${now}#${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --arg eventdate "${now%%T*}" \
              --arg environment production \
              --arg action rollback \
              --arg source cru-pipeline-v2 \
              --arg revision "$REVISION" \
              --arg digest "$DIGEST" \
              --arg sha "$gitsha" \
              --arg actor "$ACTOR" \
              --arg runid "$GITHUB_RUN_ID" \
              --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg provider gcp \
              --arg type cloudrun \
              '{Project: {S: $project}, EventAt: {S: $eventat}, EventDate: {S: $eventdate},
                Environment: {S: $environment}, Action: {S: $action}, Source: {S: $source},
                Revision: {S: $revision}, Digest: {S: $digest}, Actor: {S: $actor},
                RunId: {S: $runid}, RunUrl: {S: $runurl}, Provider: {S: $provider},
                Type: {S: $type}}
                + (if $sha != "" then {Sha: {S: $sha}} else {} end)')" \
            || echo "::warning title=Ledger write failed::rollback event for $PROJECT_NAME $REVISION not recorded in ledger (non-blocking)"

      # Record the release on the app's Flightdeck project timeline (GateOps
      # Phase 0). Project = app-info FlightdeckProject; credential = the CruDeploy
      # service user's PAT held by cru-deploy. Either unset => silent skip. Same
      # telemetry policy as the ledger: the action never fails, continue-on-error
      # is the belt on top.
      - name: Record release event in Flightdeck
        continue-on-error: true
        uses: ./cru-github-actions/actions/flightdeck-release-event
        with:
          token: ${{ secrets.flightdeck-token }}
          project: ${{ needs.lookup.outputs.flightdeck-project }}
          app: ${{ inputs.project-name }}
          environment: production
          kind: rollback
          release-tag: ${{ steps.actual-release.outputs.tag }}

      - run: echo "::notice title=Rolled Back::$PROJECT_NAME rolled back to ${{ needs.lookup.outputs.release-tag }} in production"

      # Notify Slack (success only; NEVER fails the deploy -- telemetry policy).
      # Destination = the app's production SlackChannel from app-info (channel
      # #name/C… or user U…); no-ops silently when the channel OR the bot token
      # is unset. The word "production" links to the app's production AppUrl
      # (also from app-info) when it has one, and is plain text when it doesn't.
      # The closing line is a changelog link (deploys.cru.org, ledger-backed) with
      # from/to INVERTED relative to deploy-candidate / promote: `from` = the
      # release we are rolling back TO, `to` = what production was running, so the
      # page shows what production is LOSING. Falls back to the workflow-run URL
      # when the ledger yields no prior production event (or names this same
      # release), so the line is never a dead or empty link.
      - name: Notify Slack
        continue-on-error: true
        env:
          SLACK_CHANNEL: ${{ needs.lookup.outputs.slack-channel }}
          SLACK_BOT_TOKEN: ${{ secrets.slack-bot-token }}
          APP_URL: ${{ needs.lookup.outputs.app-url }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE: ${{ steps.actual-release.outputs.tag || needs.lookup.outputs.release-tag }}
          PREVIOUS: ${{ steps.rollback-safety.outputs.previous-revision }}
          SAFETY_LINE: ${{ steps.rollback-safety.outputs.slack }}
        run: |
          if [ -z "$SLACK_CHANNEL" ] || [ -z "$SLACK_BOT_TOKEN" ]; then
            exit 0
          fi
          payload=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg project "$PROJECT_NAME" \
            --arg release "$RELEASE" \
            --arg actor "$ACTOR" \
            --arg triggering "$TRIGGERING_ACTOR" \
            --arg appurl "$APP_URL" \
            --arg previous "$PREVIOUS" \
            --arg safety "$SAFETY_LINE" \
            '{channel: $channel,
              text: (":rewind: *\($project) rolled back to `\($release)` in \(if $appurl != "" then "<" + $appurl + "|production>" else "production" end)* by \($actor)" + (if $triggering != "" and $triggering != $actor then " (re-run by \($triggering))" else "" end)
                     + (if $safety != "" then "\n\($safety)" else "" end)
                     + (if $previous != "" and $previous != $release
                        then "\n<https://deploys.cru.org/changelog?project=" + $project
                             + "&from=" + $release + "&to=" + $previous
                             + "|what this rollback reverts>"
                        else "" end))}')
          response=$(curl -fsS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload") || { echo "::warning title=Slack notify failed::post failed (non-blocking)"; exit 0; }
          echo "$response" | jq -e '.ok' >/dev/null || { echo "::warning title=Slack notify failed::$(echo "$response" | jq -r '.error // "post failed"') (non-blocking)"; }

      # Notify Slack (failure) -- the mirror of the success notify above: same
      # production SlackChannel destination, same "channel OR token unset ⇒
      # silent no-op", same continue-on-error (a notification must NEVER change
      # a run's outcome, in either direction). Deliberately plain: no AppUrl link
      # (a failed rollback means production is still on the bad release) and no
      # changelog link -- the run URL is the reader's next step, so it is the
      # whole second line. References no earlier step's output at all, so it
      # renders whichever step failed.
      - name: Notify Slack (failure)
        if: failure()
        continue-on-error: true
        env:
          SLACK_CHANNEL: ${{ needs.lookup.outputs.slack-channel }}
          SLACK_BOT_TOKEN: ${{ secrets.slack-bot-token }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ -z "$SLACK_CHANNEL" ] || [ -z "$SLACK_BOT_TOKEN" ]; then
            exit 0
          fi
          payload=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg project "$PROJECT_NAME" \
            --arg actor "$ACTOR" \
            --arg triggering "$TRIGGERING_ACTOR" \
            --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{channel: $channel,
              text: (":x: *\($project) rollback in production FAILED* by \($actor)" + (if $triggering != "" and $triggering != $actor then " (re-run by \($triggering))" else "" end)
                     + "\n\($runurl)")}')
          response=$(curl -fsS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload") || { echo "::warning title=Slack notify failed::post failed (non-blocking)"; exit 0; }
          echo "$response" | jq -e '.ok' >/dev/null || { echo "::warning title=Slack notify failed::$(echo "$response" | jq -r '.error // "post failed"') (non-blocking)"; }

  rollback-aws:
    name: Roll production back (AWS)
    needs: lookup
    if: needs.lookup.outputs.provider == 'aws'
    runs-on: ubuntu-latest
    # A backstop for anything the deploy path does not model: without it a job
    # inherits GitHub's six-hour default, and a Cloud Run call that hangs holds
    # a runner for the rest of the morning. Well clear of a real deploy.
    timeout-minutes: 60
    # Shared production lock with promote (same group as rollback-gcp).
    concurrency:
      group: production-${{ inputs.project-name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_NAME: ${{ inputs.project-name }}
      ENVIRONMENT: production
      DD_API_KEY: ${{ secrets.datadog-api-key }}
    steps:
      - name: Checkout Cru Actions & Workflows
        uses: actions/checkout@v7
        with:
          repository: CruGlobal/.github
          ref: ${{ inputs.workflow-ref }}
          path: cru-github-actions

      # --- Authz for this attempt (inside the production lock) --------------
      # FIRST real step on purpose; same reasoning as in rollback-gcp.
      - name: Authorize the account that started this attempt
        uses: ./cru-github-actions/actions/authorize-actor
        with:
          github-token: ${{ secrets.authz-token }}
          repository: ${{ needs.lookup.outputs.repository }}
          operation: roll back
          trusted-automation-actor-ids: ${{ inputs.trusted-automation-actor-ids }}

      # --- Stale-rollback guard (inside the production lock) ---------------
      # Runs right after the authz check and before anything is resolved or
      # deployed, on purpose. This job's concurrency group is the production
      # lock it shares with promote, so every step here runs while the job
      # holds it, and no other promote or rollback of this app can start until
      # the job ends. A rollback that queued behind a promote sees that
      # promote's result here, before any image is resolved or deployed. That
      # is also why the check lives in the provider jobs and not in `lookup`,
      # which runs outside the lock.
      #
      # Both inputs unset => no check (the usual case for a person rolling back
      # by hand). expected-current-release set => the newest production row in
      # the deployment ledger must name that release. expected-previous-release
      # set => it must name the release this rollback goes to, and the release
      # production ran just before the current one must be that release, so a
      # caller can say which release it expects to be rolling back to. Either
      # can be set without the other, and a failed check refuses the rollback.
      # It fails CLOSED: a ledger that can't be read, or doesn't say what
      # production runs, is a refusal, not a pass.
      #
      # Known, accepted gap: the ledger writes in promote (and in this workflow)
      # are best-effort (continue-on-error), so a newer deploy whose ledger
      # write failed is invisible here and the rollback would go ahead. For the
      # same reason, a release with no ledger row is skipped over when finding
      # the release that ran before the current one.
      - name: Refuse a stale rollback
        env:
          EXPECTED_CURRENT_RELEASE: ${{ inputs.expected-current-release }}
          EXPECTED_PREVIOUS_RELEASE: ${{ inputs.expected-previous-release }}
          TARGET_RELEASE: ${{ needs.lookup.outputs.release-tag }}
        run: |
          if [ -z "$EXPECTED_CURRENT_RELEASE" ] && [ -z "$EXPECTED_PREVIOUS_RELEASE" ]; then
            echo "::notice::expected-current-release is not set, so this rollback does not check what production is running first"
            exit 0
          fi

          # Same rules as "Normalize release tag" (the release- prefix is optional on
          # both sides), and surrounding whitespace is trimmed as well. Prints the
          # tag without its prefix, or fails if it is not a release tag.
          normalize() {
            local value="$1"
            if [[ "$value" =~ ^[[:space:]]*([^[:space:]].*[^[:space:]]|[^[:space:]])[[:space:]]*$ ]]; then
              value="${BASH_REMATCH[1]}"
            fi
            value="${value#release-}"
            [[ "$value" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2}-)?[0-9]+$ ]] && printf '%s' "$value"
          }
          if [ -n "$EXPECTED_CURRENT_RELEASE" ] && ! expected=$(normalize "$EXPECTED_CURRENT_RELEASE"); then
            echo "::error::invalid expected-current-release '$EXPECTED_CURRENT_RELEASE'; expected 'release-[<yyyy-mm-dd>-]<n>' (the release- prefix is optional)"
            exit 1
          fi
          if [ -n "$EXPECTED_PREVIOUS_RELEASE" ]; then
            if ! expected_previous=$(normalize "$EXPECTED_PREVIOUS_RELEASE"); then
              echo "::error::invalid expected-previous-release '$EXPECTED_PREVIOUS_RELEASE'; expected 'release-[<yyyy-mm-dd>-]<n>' (the release- prefix is optional)"
              exit 1
            fi
            # The check only means something when it names the release this
            # rollback goes to. TARGET_RELEASE is already normalized.
            target="${TARGET_RELEASE#release-}"
            if [ "$expected_previous" != "$target" ]; then
              if [[ "$target" == *"-$expected_previous" || "$expected_previous" == *"-$target" ]]; then
                echo "::error::expected-previous-release '$EXPECTED_PREVIOUS_RELEASE' and the release input ($TARGET_RELEASE) have the same build number, but only one is a dated tag; pass the same full tag in both. Refusing to roll back"
              else
                echo "::error::expected-previous-release '$EXPECTED_PREVIOUS_RELEASE' is not the release this rollback goes to ($TARGET_RELEASE); it must name the same release as the release input. Refusing to roll back"
              fi
              exit 1
            fi
          fi

          # Fail closed from here on: without a trustworthy answer to "what is
          # production running", refuse rather than guess.
          if [ -n "$EXPECTED_CURRENT_RELEASE" ]; then
            unconfirmed="cannot confirm production is still running release-$expected; refusing to roll back"
          else
            unconfirmed="cannot confirm which release production ran before the current one; refusing to roll back"
          fi
          # One read serves both checks. It asks for 10 rows, not 2, because a
          # re-run or a re-promote writes the same Revision more than once.
          if ! body=$(curl -fsS --max-time 20 --retry 2 --retry-delay 3 \
              "https://deploys.cru.org/deployments?project=$PROJECT_NAME&environment=production&limit=10"); then
            echo "::error::could not read the deployment ledger for $PROJECT_NAME, so $unconfirmed"
            exit 1
          fi
          if ! count=$(printf '%s' "$body" | jq -er '.Items | if type == "array" then length else error("no Items array") end' 2>/dev/null); then
            echo "::error::the deployment ledger for $PROJECT_NAME returned an unexpected response (not JSON with an Items array), so $unconfirmed"
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::the deployment ledger has no production rows for $PROJECT_NAME, so $unconfirmed"
            exit 1
          fi
          current=$(printf '%s' "$body" | jq -r '.Items[0].Revision | if type == "string" then . else "" end' 2>/dev/null) || current=""
          if [ -z "$current" ]; then
            echo "::error::the newest production row in the deployment ledger for $PROJECT_NAME has no Revision, so $unconfirmed"
            exit 1
          fi

          if [ -n "$EXPECTED_CURRENT_RELEASE" ] && [ "${current#release-}" != "$expected" ]; then
            if [[ "$expected" =~ ^[0-9]+$ ]] && [[ "$current" == *"-$expected" ]]; then
              echo "::error::expected-current-release '$EXPECTED_CURRENT_RELEASE' is a bare build number, but production's release tag is dated ($current); pass the full tag. Refusing to roll back"
            else
              echo "::error::production is now running $current, not release-$expected; refusing a rollback that would undo a newer deploy"
            fi
            exit 1
          fi

          # The release production ran before the current one is the first row
          # after the newest whose Revision is different. Promote and rollback
          # both write a production row, so the rows, newest first, are the
          # order releases ran in. A re-run or a re-promote writes the same
          # Revision again, so the very next row can still be the current one.
          if [ -n "$EXPECTED_PREVIOUS_RELEASE" ]; then
            unknown_previous="cannot confirm which release production ran before $current; refusing to roll back"
            if ! previous=$(printf '%s' "$body" | jq -er --arg current "${current#release-}" '
                [.Items[1:][] | (.Revision? // "") | if type == "string" then . else "" end]
                | map(select(ltrimstr("release-") != $current)) | .[0] // error("none")' 2>/dev/null); then
              echo "::error::the deployment ledger for $PROJECT_NAME has no production row for any release other than $current (rows read: $count), so $unknown_previous"
              exit 1
            fi
            if [ -z "$previous" ]; then
              echo "::error::the production row that comes before $current in the deployment ledger for $PROJECT_NAME has no Revision, so $unknown_previous"
              exit 1
            fi
            if [ "${previous#release-}" != "$expected_previous" ]; then
              if [[ "$expected_previous" =~ ^[0-9]+$ ]] && [[ "$previous" == *"-$expected_previous" ]]; then
                echo "::error::expected-previous-release '$EXPECTED_PREVIOUS_RELEASE' is a bare build number, but the release production ran before $current is dated ($previous); pass the full tag. Refusing to roll back"
              else
                echo "::error::production ran $previous just before $current, not release-$expected_previous; refusing a rollback that would not go back exactly one release"
              fi
              exit 1
            fi
          fi

          if [ -z "$EXPECTED_PREVIOUS_RELEASE" ]; then
            echo "::notice::production is still running $current, as expected; going ahead with the rollback"
          elif [ -z "$EXPECTED_CURRENT_RELEASE" ]; then
            echo "::notice::production ran $previous just before $current, as expected; going ahead with the rollback"
          else
            echo "::notice::production is still running $current and ran $previous just before it, as expected; going ahead with the rollback"
          fi

      - name: Guard supported AWS type
        env:
          TYPE: ${{ needs.lookup.outputs.type }}
        run: |
          case "$TYPE" in
            ecs|lambda) ;;
            *) echo "::error::v2 AWS deploys support types 'ecs' and 'lambda' (got '$TYPE'); serverless lands in a later pass."; exit 1 ;;
          esac

      # One deploy role per type (GitHubDeployECS / GitHubDeployLambda), both
      # cru-deploy-scoped and covering the cruds account (056154071827).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::056154071827:role/${{ needs.lookup.outputs.type == 'lambda' && 'GitHubDeployLambda' || 'GitHubDeployECS' }}

      - name: Resolve release image
        uses: ./cru-github-actions/actions/resolve-image
        id: resolve
        with:
          type: ${{ needs.lookup.outputs.type }}
          project-name: ${{ inputs.project-name }}
          mode: tag
          tag: ${{ needs.lookup.outputs.release-tag }}

      # A bare-number input can resolve to a dated release tag (release-<date>-<n>),
      # so DD_VERSION must reflect the ACTUAL release-* tag on the resolved digest,
      # not the normalized input. Grep the resolved tags for release-*, falling
      # back to the normalized input when (unexpectedly) none is present.
      - name: Determine deployed release tag
        id: actual-release
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          FALLBACK: ${{ needs.lookup.outputs.release-tag }}
        run: |
          release=$(echo "$TAGS" | tr ',' '\n' | grep -E '^release-' | head -n1 || true)
          echo "tag=${release:-$FALLBACK}" >> "$GITHUB_OUTPUT"

      # --- Rollback-safety advisory (read-back; never blocks) --------------
      # The release we are rolling back FROM may have shipped destructive
      # migrations; an image swap does NOT revert the schema. Read the most
      # recent production ledger row carrying a rollback-safety verdict and warn
      # loudly if it was classified unsafe. Public GET; never fails the rollback.
      # The same fetch also yields what production runs RIGHT NOW (the newest
      # event) for the Slack changelog link -- one ledger round trip, two uses.
      - name: Rollback-safety advisory
        id: rollback-safety
        continue-on-error: true
        run: |
          items=$(curl -fsS "https://deploys.cru.org/deployments?project=$PROJECT_NAME&environment=production&limit=10" | jq -c '.Items // []') || items='[]'
          # The release this rollback takes production OFF -- the `to` end of the
          # changelog link (revision name preferred, Sha for rows that predate
          # named revisions). Empty -> the Slack message keeps the run URL.
          echo "previous-revision=$(echo "$items" | jq -r '.[0].Revision // .[0].Sha // empty')" >> "$GITHUB_OUTPUT"
          entry=$(echo "$items" | jq -c 'map(select(.RollbackSafe != null)) | .[0] // empty')
          safe=$(echo "$entry" | jq -r '.RollbackSafe // empty' 2>/dev/null || echo "")
          reasons_json=$(echo "$entry" | jq -r '.RollbackSafeReasons // ""' 2>/dev/null || echo "")
          reasons=""
          if [ -n "$reasons_json" ]; then
            reasons=$(echo "$reasons_json" | jq -r '.[0:2] | join("; ")' 2>/dev/null || echo "")
          fi
          if [ "$safe" = "false" ]; then
            echo "::warning title=Rollback safety::the release being rolled back FROM shipped destructive migrations ($reasons) -- the image swap will NOT revert the schema; verify the target image tolerates the current schema"
            echo "slack=:warning: rolling back FROM a release with destructive migrations ($reasons); this rollback does NOT revert the schema" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Rollback safety::no destructive-migration warning on the release being rolled back from"
            echo "slack=" >> "$GITHUB_OUTPUT"
          fi

      - name: Record deploy start
        run: echo "DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Deploy to production
        uses: ./cru-github-actions/actions/deploy
        with:
          type: ${{ needs.lookup.outputs.type }}
          project-name: ${{ inputs.project-name }}
          environment: production
          image: ${{ steps.resolve.outputs.image }}
          app-url: ${{ needs.lookup.outputs.app-url }}

      - name: Record deployment event in Datadog
        continue-on-error: true
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          ACTOR: ${{ github.actor }}
        run: |
          # sha-<gitsha> tag on the resolved digest -> sha:<gitsha> event tag, so
          # events are joinable to commits (deployments-ledger precursor). Omitted
          # cleanly when the digest carries no sha- tag.
          gitsha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          jq -n \
            --arg title "Rolled back: $PROJECT_NAME to ${{ needs.lookup.outputs.release-tag }}" \
            --arg text "Pipeline v2 production rollback by ${{ github.actor }} (started $DEPLOY_STARTED_AT)" \
            --arg service "$PROJECT_NAME" \
            --arg actor "$ACTOR" \
            --arg gitsha "$gitsha" \
            '{title: $title, text: $text, alert_type: "info",
              aggregation_key: ("deploy:" + $service + ":production"),
              tags: (["source:cru-pipeline-v2", ("service:" + $service),
                     "environment:production", "action:rollback",
                     "revision:${{ needs.lookup.outputs.release-tag }}", "rollback:true",
                     ("actor:" + $actor)]
                     + (if $gitsha != "" then ["sha:" + $gitsha] else [] end))}' \
          | curl -fsS --retry 3 -X POST "https://api.datadoghq.com/api/v1/events" \
              -H "Content-Type: application/json" -H "DD-API-KEY: $DD_API_KEY" -d @- \
            || echo "::warning title=Datadog telemetry failed::rollback event for $PROJECT_NAME ${{ needs.lookup.outputs.release-tag }} not recorded (non-blocking)"

      # Append the event to the CruDeploymentLedger DynamoDB table (app-info's
      # deployments ledger -- the fleet dashboard / DORA data spine). Same
      # policy as all telemetry: NEVER fails the deploy.
      - name: Record deployment in ledger
        continue-on-error: true
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          ACTOR: ${{ github.actor }}
          REVISION: ${{ steps.actual-release.outputs.tag }}
          TYPE: ${{ needs.lookup.outputs.type }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          gitsha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          aws dynamodb put-item --region us-east-1 \
            --table-name CruDeploymentLedger \
            --item "$(jq -n \
              --arg project "$PROJECT_NAME" \
              --arg eventat "${now}#${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --arg eventdate "${now%%T*}" \
              --arg environment production \
              --arg action rollback \
              --arg source cru-pipeline-v2 \
              --arg revision "$REVISION" \
              --arg digest "$DIGEST" \
              --arg sha "$gitsha" \
              --arg actor "$ACTOR" \
              --arg runid "$GITHUB_RUN_ID" \
              --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg provider aws \
              --arg type "$TYPE" \
              '{Project: {S: $project}, EventAt: {S: $eventat}, EventDate: {S: $eventdate},
                Environment: {S: $environment}, Action: {S: $action}, Source: {S: $source},
                Revision: {S: $revision}, Digest: {S: $digest}, Actor: {S: $actor},
                RunId: {S: $runid}, RunUrl: {S: $runurl}, Provider: {S: $provider},
                Type: {S: $type}}
                + (if $sha != "" then {Sha: {S: $sha}} else {} end)')" \
            || echo "::warning title=Ledger write failed::rollback event for $PROJECT_NAME $REVISION not recorded in ledger (non-blocking)"

      # Record the release on the app's Flightdeck project timeline (GateOps
      # Phase 0). Project = app-info FlightdeckProject; credential = the CruDeploy
      # service user's PAT held by cru-deploy. Either unset => silent skip. Same
      # telemetry policy as the ledger: the action never fails, continue-on-error
      # is the belt on top.
      - name: Record release event in Flightdeck
        continue-on-error: true
        uses: ./cru-github-actions/actions/flightdeck-release-event
        with:
          token: ${{ secrets.flightdeck-token }}
          project: ${{ needs.lookup.outputs.flightdeck-project }}
          app: ${{ inputs.project-name }}
          environment: production
          kind: rollback
          release-tag: ${{ steps.actual-release.outputs.tag }}

      - run: echo "::notice title=Rolled Back::$PROJECT_NAME rolled back to ${{ needs.lookup.outputs.release-tag }} in production"

      # Notify Slack (success only; NEVER fails the deploy -- telemetry policy).
      # Destination = the app's production SlackChannel from app-info (channel
      # #name/C… or user U…); no-ops silently when the channel OR the bot token
      # is unset. The word "production" links to the app's production AppUrl
      # (also from app-info) when it has one, and is plain text when it doesn't.
      # The closing line is a changelog link (deploys.cru.org, ledger-backed) with
      # from/to INVERTED relative to deploy-candidate / promote: `from` = the
      # release we are rolling back TO, `to` = what production was running, so the
      # page shows what production is LOSING. Falls back to the workflow-run URL
      # when the ledger yields no prior production event (or names this same
      # release), so the line is never a dead or empty link.
      - name: Notify Slack
        continue-on-error: true
        env:
          SLACK_CHANNEL: ${{ needs.lookup.outputs.slack-channel }}
          SLACK_BOT_TOKEN: ${{ secrets.slack-bot-token }}
          APP_URL: ${{ needs.lookup.outputs.app-url }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE: ${{ steps.actual-release.outputs.tag || needs.lookup.outputs.release-tag }}
          PREVIOUS: ${{ steps.rollback-safety.outputs.previous-revision }}
          SAFETY_LINE: ${{ steps.rollback-safety.outputs.slack }}
        run: |
          if [ -z "$SLACK_CHANNEL" ] || [ -z "$SLACK_BOT_TOKEN" ]; then
            exit 0
          fi
          payload=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg project "$PROJECT_NAME" \
            --arg release "$RELEASE" \
            --arg actor "$ACTOR" \
            --arg triggering "$TRIGGERING_ACTOR" \
            --arg appurl "$APP_URL" \
            --arg previous "$PREVIOUS" \
            --arg safety "$SAFETY_LINE" \
            '{channel: $channel,
              text: (":rewind: *\($project) rolled back to `\($release)` in \(if $appurl != "" then "<" + $appurl + "|production>" else "production" end)* by \($actor)" + (if $triggering != "" and $triggering != $actor then " (re-run by \($triggering))" else "" end)
                     + (if $safety != "" then "\n\($safety)" else "" end)
                     + (if $previous != "" and $previous != $release
                        then "\n<https://deploys.cru.org/changelog?project=" + $project
                             + "&from=" + $release + "&to=" + $previous
                             + "|what this rollback reverts>"
                        else "" end))}')
          response=$(curl -fsS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload") || { echo "::warning title=Slack notify failed::post failed (non-blocking)"; exit 0; }
          echo "$response" | jq -e '.ok' >/dev/null || { echo "::warning title=Slack notify failed::$(echo "$response" | jq -r '.error // "post failed"') (non-blocking)"; }

      # Notify Slack (failure) -- the mirror of the success notify above: same
      # production SlackChannel destination, same "channel OR token unset ⇒
      # silent no-op", same continue-on-error (a notification must NEVER change
      # a run's outcome, in either direction). Deliberately plain: no AppUrl link
      # (a failed rollback means production is still on the bad release) and no
      # changelog link -- the run URL is the reader's next step, so it is the
      # whole second line. References no earlier step's output at all, so it
      # renders whichever step failed.
      - name: Notify Slack (failure)
        if: failure()
        continue-on-error: true
        env:
          SLACK_CHANNEL: ${{ needs.lookup.outputs.slack-channel }}
          SLACK_BOT_TOKEN: ${{ secrets.slack-bot-token }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ -z "$SLACK_CHANNEL" ] || [ -z "$SLACK_BOT_TOKEN" ]; then
            exit 0
          fi
          payload=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg project "$PROJECT_NAME" \
            --arg actor "$ACTOR" \
            --arg triggering "$TRIGGERING_ACTOR" \
            --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{channel: $channel,
              text: (":x: *\($project) rollback in production FAILED* by \($actor)" + (if $triggering != "" and $triggering != $actor then " (re-run by \($triggering))" else "" end)
                     + "\n\($runurl)")}')
          response=$(curl -fsS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload") || { echo "::warning title=Slack notify failed::post failed (non-blocking)"; exit 0; }
          echo "$response" | jq -e '.ok' >/dev/null || { echo "::warning title=Slack notify failed::$(echo "$response" | jq -r '.error // "post failed"') (non-blocking)"; }
