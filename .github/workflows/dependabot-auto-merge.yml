name: dependabot-auto-merge

# Auto-approves and enables auto-merge on Dependabot PRs that meet any
# of these criteria:
#
#   1. Security advisories (alert-state set by fetch-metadata) —
#      always auto-merge, regardless of version-update type.
#   2. Regular patch or minor version bumps — auto-merge too. Required
#      status checks on the protected branch gate actual merging on
#      green CI (lint + build + test), so low-risk updates flow through
#      without a human in the loop.
#
# Major version bumps are explicitly left for human review — the
# workflow never approves or enables auto-merge on them.
#
# "Auto-merge" is GitHub's built-in feature that waits for required
# branch-protection / ruleset checks before merging. Without required
# checks, GitHub falls back to an immediate merge once auto-merge is
# enabled — so this workflow's safety relies on the repo's ruleset
# requiring the CI workflow to pass.
#
# Auto-merge is enabled with CRU_DEVOPS_GITHUB_TOKEN, the same PAT the
# repo's own maintenance workflows use, and NOT the default
# GITHUB_TOKEN: the eventual merge commit is pushed on behalf of
# whoever enabled auto-merge, and a push made on behalf of
# GITHUB_TOKEN starts no workflow run. Enabling it as GITHUB_TOKEN
# therefore merged the PR but silently skipped every push-triggered
# workflow — the dist/ rebuild and the release train never ran for the
# merge, leaving dist/ stale and the commit unreleased until an
# unrelated merge happened to catch it up.
#
# The PAT must be present in this repo's DEPENDABOT secrets, not only
# its Actions secrets: runs Dependabot triggers read the Dependabot
# secrets context. If it is absent the token expression falls back to
# GITHUB_TOKEN — auto-merge still works, but the release train will not
# fire — so the check step below says so in the run log rather than
# letting the regression return silently.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only run on Dependabot-opened PRs; skip everything else to avoid
    # churn and keep the job fast.
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Decide whether this PR qualifies for auto-merge. A single output
      # keeps the subsequent conditions readable instead of duplicating
      # the compound expression. For grouped Dependabot PRs,
      # `update-type` reflects the highest semver bump in the group —
      # so any group containing a major bump won't match.
      - name: Evaluate eligibility
        id: gate
        env:
          ALERT_STATE: ${{ steps.meta.outputs.alert-state }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          if [ -n "$ALERT_STATE" ] \
             || [ "$UPDATE_TYPE" = "version-update:semver-patch" ] \
             || [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi
          echo "alert-state=$ALERT_STATE"
          echo "update-type=$UPDATE_TYPE"

      # Report which identity will enable auto-merge, because that
      # decides whether the merge commit triggers the dist/ rebuild and
      # the release train at all (see the header). The fallback keeps
      # merging PRs, so without this the gap is invisible.
      - name: Check the auto-merge token
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        env:
          MERGE_TOKEN: ${{ secrets.CRU_DEVOPS_GITHUB_TOKEN }}
        run: |
          if [ -z "$MERGE_TOKEN" ]; then
            echo "::warning title=Release train will not run for this merge::CRU_DEVOPS_GITHUB_TOKEN is not readable by this run; auto-merge falls back to GITHUB_TOKEN, whose merge commit triggers no push workflows (dist/ rebuild, release train). Add the PAT to this repository's Dependabot secrets."
          else
            echo "auto-merge will be enabled with CRU_DEVOPS_GITHUB_TOKEN"
          fi

      - name: Approve PR
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.CRU_DEVOPS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        # gh pr review runs as the PAT's user (or github-actions[bot] on
        # the fallback) — either way a different identity from
        # dependabot[bot], so the approval satisfies any
        # "no self-approval" ruleset requirement.
        run: gh pr review --approve "$PR_URL"

      - name: Enable squash auto-merge
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.CRU_DEVOPS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto "$PR_URL"
