name: Build & Push to Artifact Registry

on:
  workflow_call:
    inputs:
      workflow-ref:
        type: string
        required: false
        default: v1
        description: Branch, tag or commit of CruGlobal/.github to load this workflow's actions from. Defaults to the v1 tag. If you call this workflow at another ref, pass that same ref here.
    outputs:
      project-name:
        description: Project Name, defaults to GitHub repo name.
        value: ${{ jobs.build.outputs.project-name }}
      project:
        description: GCP Project ID
        value: ${{ jobs.build.outputs.project }}
      environment:
        description: Environment (staging/production/lab).
        value: ${{ jobs.build.outputs.environment }}
      build-number:
        description: Build Number/Tag
        value: ${{ jobs.build.outputs.build-number }}

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Checkout Cru Actions & Workflows
        uses: actions/checkout@v7
        with:
          repository: CruGlobal/.github
          ref: ${{ inputs.workflow-ref }}
          path: cru-github-actions

      - name: Setup Build environment
        uses: ./cru-github-actions/actions/setup-env
        id: env

  build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - setup
    outputs:
      project-name: ${{ steps.env.outputs.project-name }}
      project: ${{ steps.auth.outputs.project_id }}
      environment: ${{ steps.env.outputs.environment }}
      build-number: ${{ steps.build-number.outputs.build-number }}
    permissions:
      id-token: write
      contents: read
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout Cru Actions & Workflows
        uses: actions/checkout@v7
        with:
          repository: CruGlobal/.github
          ref: ${{ inputs.workflow-ref }}
          path: cru-github-actions

      - name: Setup Build environment
        uses: ./cru-github-actions/actions/setup-env
        id: env
        with:
          role-suffix: GitHubRole

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ steps.env.outputs.role-arn }}

      - name: Configure GCP credentials
        uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Increment Build Number
        uses: ./cru-github-actions/actions/build-number
        id: build-number

      - name: Start Docker Network
        uses: ./cru-github-actions/actions/docker-network
        with:
          name: ${{ steps.env.outputs.project-name }}

      # Many base images come from public.ecr.aws, which meters anonymous pulls
      # per source IP. GitHub-hosted runners share their IPs with other GitHub
      # customers, so that allowance can be used up by strangers and the build
      # fails on "429 Too Many Requests ... Data limit exceeded". A re-run only
      # helps if it lands on a luckier IP. A logged-in pull is metered against
      # our own AWS account instead.
      # vars.ECR_PUBLIC_PULL_ROLE_ARN (an org variable) names a role every org
      # repo may assume that can only get an ECR Public login token. The login
      # is saved in the runner's Docker config, which buildx, docker build and
      # docker pull all read.
      #
      # output-env-credentials: false keeps that role's keys out of the job env.
      # They reach the login step as step outputs, so the build role configured
      # above stays the job's AWS identity for every later step. Best effort:
      # with the variable unset, or the assume or login failing, the step warns
      # and pulls stay anonymous, as before. The token lasts 12 hours, and an
      # expired one fails pulls instead of falling back, but the job's 30-minute
      # timeout ends long before that.
      - name: Assume the ECR Public pull role
        if: vars.ECR_PUBLIC_PULL_ROLE_ARN != ''
        id: ecr-public-role
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.ECR_PUBLIC_PULL_ROLE_ARN }}
          output-credentials: true
          output-env-credentials: false
          # The default is 12 attempts with backoff, which a denied assume
          # would sit through for a minute or more.
          retry-max-attempts: 2

      - name: Log in to ECR Public
        continue-on-error: true
        env:
          ROLE_ARN: ${{ vars.ECR_PUBLIC_PULL_ROLE_ARN }}
          ASSUME_OUTCOME: ${{ steps.ecr-public-role.outcome }}
          PULL_ACCESS_KEY_ID: ${{ steps.ecr-public-role.outputs.aws-access-key-id }}
          PULL_SECRET_ACCESS_KEY: ${{ steps.ecr-public-role.outputs.aws-secret-access-key }}
          PULL_SESSION_TOKEN: ${{ steps.ecr-public-role.outputs.aws-session-token }}
        run: |
          set -o pipefail
          anonymous="base-image pulls from public.ecr.aws stay anonymous and can hit its per-IP data limit"
          if [ -z "$ROLE_ARN" ]; then
            echo "::warning title=ECR Public login skipped::ECR_PUBLIC_PULL_ROLE_ARN is not set, so $anonymous."
            exit 0
          fi
          if [ "$ASSUME_OUTCOME" != success ] || [ -z "$PULL_ACCESS_KEY_ID" ]; then
            echo "::warning title=ECR Public login skipped::could not assume the ECR Public pull role, so $anonymous."
            exit 0
          fi
          # The pull role's keys go to this one aws call only. The job's AWS_*
          # (the build role) are left alone.
          if AWS_ACCESS_KEY_ID="$PULL_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$PULL_SECRET_ACCESS_KEY" AWS_SESSION_TOKEN="$PULL_SESSION_TOKEN" \
            aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws; then
            echo "Logged in to public.ecr.aws; base-image pulls are metered against our AWS account."
          else
            echo "::warning title=ECR Public login failed::the login did not succeed, so $anonymous."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          driver-opts: network=${{ steps.env.outputs.project-name }}

      - name: Login to GCR
        uses: docker/login-action@v4
        id: gcr
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Cache Docker Layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: "${{ runner.os }}-buildx-${{ github.sha }}"
          restore-keys: |
            ${{ runner.os }}-buildx

      - name: Import Build Secrets
        uses: ./cru-github-actions/actions/gcp-secrets
        with:
          project: ${{ steps.auth.outputs.project_id }}
          type: BUILD

      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          path: project

      - name: Run build.sh
        working-directory: project
        run: ./build.sh
        env:
          DOCKER_NETWORK: ${{ steps.env.outputs.project-name }}
          # --provenance=false: BuildKit's default attestation adds an extra
          # manifest that registries scan and bill as a second image; nothing
          # in the pipeline consumes it.
          DOCKER_ARGS: |
            --builder ${{ steps.buildx.outputs.name }}
            --provenance=false
            --cache-from type=local,src=/tmp/.buildx-cache
            --cache-to type=local,dest=/tmp/.buildx-cache-new
            --tag us-central1-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/container/${{ steps.env.outputs.project-name }}:${{ steps.env.outputs.environment }}-${{ steps.build-number.outputs.build-number }}
            --push

      # Temp fix
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
        continue-on-error: true

      - name: Notify Success
        run: echo "::notice title=Build Success::Successfully built - $ENVIRONMENT-$BUILD_NUMBER"
