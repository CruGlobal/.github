name: Deploy
description: >-
  Deploy a pre-built, digest-pinned image to a target environment
  (pipeline v2 build-once/promote-the-artifact). On ecs, each companion
  image the app image names in an org.cru.companion.<name> label is
  registered into the <project>-<nick>-<name> task definition family once
  the services land. On static, the files under /site in the image are
  copied to the S3 bucket and CloudFront distribution the app's app-info row
  names. A production deploy is refused unless the authorize-actor check
  passed earlier in the same job for this run attempt.
inputs:
  type:
    description: Runtime to deploy to. One of ecs | lambda | cloudrun | static.
    required: true
  project-name:
    description: Project name.
    required: true
  environment:
    description: Long environment name (production | release-candidate | preview) to deploy to.
    required: true
  image:
    description: >-
      FULL DIGEST reference to deploy (name@sha256:...). The action fails if
      given a tag reference — v2 deploys digests, never tags.
    required: true
  runtime-project:
    description: GCP project ID of the target environment project. Required for cloudrun.
    required: false
  app-url:
    description: >-
      Public base URL of the app in this environment (app-info AppUrl). Used to
      turn a source map staged inside the image into the public URL of the
      minified file it belongs to. Unset means browser source maps are not
      uploaded.
    required: false
  revision:
    description: >-
      The release name this deploy records (the candidate tag on a stage
      deploy, the release tag on a promote or rollback). Only static uses it:
      it is written on index.html with the digest, so the bucket says which
      release it serves. Unset, the name is taken from the image's own
      release or candidate tag.
    required: false
    default: ''
  stop-rollout-on-failure:
    description: >-
      What to do when a rollout fails after a service or function was
      updated, including one that has not landed by the end of the deploy's
      rollout budget. "true" (the default) sends every service or function the
      deploy moved back to what served before it, so the app stays on the
      release the records name. On static, the files of the release that was
      live are put back. "false" leaves them as they are, for a
      rollback, where going back would mean the release being rolled back
      from. The step fails either way.
    required: false
    default: 'true'
outputs:
  deployed-image:
    description: The digest reference that was deployed.
  services:
    description: Comma-separated names of the services that were updated.
  sourcemaps-status:
    description: >-
      Browser source-map upload outcome: skipped | uploaded | partial | failed.
      The upload never fails the deploy, so this is how the outcome is reported.
  sourcemaps-uploaded:
    description: Number of source maps uploaded.
  sourcemaps-failed:
    description: Number of source maps that failed to upload.

runs:
  using: 'node24'
  main: '../../dist/deploy.js'
