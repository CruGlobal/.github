name: Record Deploy

# Record a deploy an app made itself, outside pipeline v2, on the app's
# Flightdeck project timeline, and announce it in the app's Slack channel.
#
# Why this runs here and not in the app repo: Flightdeck trusts a release event
# only from the deploy identity, whose token cru-deploy holds, and the
# GitHubDeployECS role that reads app-info trusts cru-deploy, not the app repo.
# So the app's deploy workflow dispatches cru-deploy's thin `Record Deploy (v2)`
# wrapper with the org CRU_DEPLOY_GITHUB_TOKEN, and the wrapper calls this
# workflow. It is the same arrangement as notify-build-failure.
#
# The dispatch token's account can reach every repository, so who dispatched
# proves nothing. The gate is the run that asked (actions/verify-deploy-run):
# it must be a run in the app's own repository, started by a push or a manual
# dispatch and never by a pull request, whose head commit is `sha`, and for
# production `sha` must be on the default branch. Anything else is refused.
#
# Telemetry, not a deploy: nothing here changes the app, and nothing here can
# fail the app's workflow, which only dispatched it. Every refusal, and every
# failure to record, is a warning in this run.
#
# What it needs from app-info: the app's row for the environment, without
# PipelineVersion "2" (a v2 app's own workflows record its deploys), and with a
# FlightdeckProject. The utility/app-info Terraform module writes such a row.
# With no row, a v2 row, or no FlightdeckProject, it records nothing and says
# why.
#
# Dispatch it from the app's deploy workflow, after the deploy succeeds:
#
#   - name: Record the deploy
#     continue-on-error: true
#     uses: CruGlobal/.github/actions/dispatch@v2
#     with:
#       github-token: ${{ secrets.CRU_DEPLOY_GITHUB_TOKEN }}
#       workflow: record-deploy.yml
#       inputs-json: >-
#         {"project-name": "example-app", "environment": "production",
#          "sha": "${{ github.sha }}", "run-id": "${{ github.run_id }}"}

on:
  workflow_call:
    inputs:
      workflow-ref:
        type: string
        required: false
        default: main
        description: Branch, tag or commit of CruGlobal/.github to check the actions out at.
      project-name:
        type: string
        required: true
        description: Project name, as app-info knows the app.
      environment:
        type: string
        required: true
        description: Environment the app deployed to, staging or production.
      sha:
        type: string
        required: true
        description: Full sha of the commit the app deployed.
      run-id:
        type: string
        required: true
        description: Id of the app repository's Actions run that made the deploy.
      # The changelog link's Flightdeck workspace is the caller's
      # FLIGHTDECK_WORKSPACE configuration variable, as in promote.
      flightdeck-url:
        type: string
        required: false
        default: 'https://flightdeck.cru.org'
        description: >-
          Flightdeck base URL. The release event is posted there, and the
          changelog link points there when the FLIGHTDECK_WORKSPACE variable
          is set.
    secrets:
      github-token:
        required: true
        description: GitHub token that can read the app repository's Actions runs, settings and commits.
      slack-bot-token:
        required: false
        description: Slack bot token for pipeline notifications; unset disables posting.
      flightdeck-token:
        required: false
        description: Flightdeck PAT of the CruDeploy service user, for release-timeline events; unset disables posting.

jobs:
  # app-info straight from the CruApplicationInfo table, the same lookup the
  # other v2 workflows make, keyed by the legacy environment name. staging and
  # production are already the legacy names, so there is nothing to translate.
  lookup:
    name: Look up app info
    runs-on: ubuntu-latest
    # OIDC only: the job assumes GitHubDeployECS to read the table and checks
    # nothing out.
    permissions:
      id-token: write
    outputs:
      record: ${{ steps.app-info.outputs.record }}
      slack-channel: ${{ steps.app-info.outputs.slack-channel }}
      app-url: ${{ steps.app-info.outputs.app-url }}
      flightdeck-project: ${{ steps.app-info.outputs.flightdeck-project }}
      repository: ${{ steps.app-info.outputs.repository }}
    steps:
      - name: Configure AWS credentials for app-info
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::056154071827:role/GitHubDeployECS

      - name: Look up app info
        id: app-info
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Every way out below records nothing and says why, as a warning on
          # one line: an input can hold a line break, and what follows one must
          # not read as a workflow command of its own.
          skip() {
            local message="${1//[$'\r\n']/ }"
            echo "::warning title=Deploy not recorded::$message"
            exit 0
          }
          case "$ENVIRONMENT" in
            staging|production) ;;
            *) skip "environment '$ENVIRONMENT' is not staging or production" ;;
          esac
          if [[ ! "$PROJECT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            skip "project name '$PROJECT_NAME' is not one app-info can hold"
          fi
          if ! info=$(aws dynamodb get-item --region us-east-1 --output json \
              --table-name CruApplicationInfo \
              --key "$(jq -n --arg project "$PROJECT_NAME" --arg environment "$ENVIRONMENT" \
                '{Project: {S: $project}, Environment: {S: $environment}}')"); then
            skip "could not read the CruApplicationInfo row for '$PROJECT_NAME' ($ENVIRONMENT)"
          fi
          item=$(echo "$info" | jq -c '.Item // empty' 2>/dev/null || true)
          if [ -z "$item" ]; then
            skip "no CruApplicationInfo row for project '$PROJECT_NAME' environment '$ENVIRONMENT', so there is no Flightdeck project to record it on. The utility/app-info Terraform module writes one."
          fi
          # A v2 app's deploys are recorded by promote, rollback and
          # deploy-candidate. A second record of one would put a tag on its
          # production timeline that is not a release, and the timeline is what
          # automatic rollback reads.
          if [ "$(echo "$item" | jq -r '.PipelineVersion.S // empty')" = "2" ]; then
            skip "$PROJECT_NAME is on pipeline v2, whose own workflows record its deploys"
          fi
          flightdeck_project=$(echo "$item" | jq -r '.FlightdeckProject.S // empty')
          if [ -z "$flightdeck_project" ]; then
            skip "$PROJECT_NAME's CruApplicationInfo row for '$ENVIRONMENT' has no FlightdeckProject, so there is no Flightdeck project to record it on"
          fi
          slack_channel=$(echo "$item" | jq -r '.SlackChannel.S // empty')
          app_url=$(echo "$item" | jq -r '.AppUrl.S // empty')
          # Repository is written only when the app repo is not named after the project.
          repository=$(echo "$item" | jq -r --arg default "CruGlobal/$PROJECT_NAME" '.Repository.S // $default')
          {
            echo "record=true"
            echo "flightdeck-project=$flightdeck_project"
            echo "slack-channel=$slack_channel"
            echo "app-url=$app_url"
            echo "repository=$repository"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::app-info $PROJECT_NAME/$ENVIRONMENT -> flightdeck=$flightdeck_project repository=$repository"

  record:
    name: Record the deploy
    needs: lookup
    if: needs.lookup.outputs.record == 'true'
    runs-on: ubuntu-latest
    # A backstop: every call below has its own timeout, so a real run takes a
    # minute or two.
    timeout-minutes: 15
    # OIDC for the build number; contents: read to check this repo out for its
    # actions. Nothing is checked out from the app repo, and it is only read,
    # through the API, with github-token.
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_NAME: ${{ inputs.project-name }}
    steps:
      - name: Checkout Cru Actions & Workflows
        uses: actions/checkout@v7
        with:
          repository: CruGlobal/.github
          ref: ${{ inputs.workflow-ref }}
          path: cru-github-actions

      # The gate. A refusal is a warning and `verified` is "false", so every
      # step after this one is skipped. A pass also marks this job, for this
      # attempt, environment and sha, which is what lets the production release
      # event below through flightdeck-release-event's attempt check. Nothing
      # else in this job reads that mark.
      - name: Verify the run that asked
        id: verify
        uses: ./cru-github-actions/actions/verify-deploy-run
        with:
          github-token: ${{ secrets.github-token }}
          repository: ${{ needs.lookup.outputs.repository }}
          run-id: ${{ inputs.run-id }}
          sha: ${{ inputs.sha }}
          environment: ${{ inputs.environment }}

      - name: Configure AWS credentials for the build number
        if: steps.verify.outputs.verified == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::056154071827:role/GitHubDeployECS

      # The same counter the app's candidates would use (ECSBuildNumbers, one
      # row per project), so a deploy tag's number never repeats. It needs
      # dynamodb:UpdateItem on that table for GitHubDeployECS; without it this
      # step fails and the next one says so, and nothing is recorded.
      - name: Get a build number
        id: build-number
        if: steps.verify.outputs.verified == 'true'
        continue-on-error: true
        uses: ./cru-github-actions/actions/build-number
        with:
          project-name: ${{ inputs.project-name }}

      # deploy-<yyyy-mm-dd>-<n>, dated by when the app's run finished, or today
      # while it is still running.
      - name: Name the release
        id: release
        if: steps.verify.outputs.verified == 'true'
        env:
          BUILD_NUMBER: ${{ steps.build-number.outputs.build-number }}
          DEPLOYED_AT: ${{ steps.verify.outputs.deployed-at }}
        run: |
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::warning title=Deploy not recorded::could not get a build number for $PROJECT_NAME from ECSBuildNumbers (see the step above; GitHubDeployECS needs dynamodb:UpdateItem on that table), so the deploy has no release tag"
            exit 0
          fi
          day=$(date -u +%Y-%m-%d)
          if [[ "$DEPLOYED_AT" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})T ]]; then
            day="${BASH_REMATCH[1]}"
          fi
          echo "tag=deploy-$day-$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      # The app's own run is the deploy, so it supplies the actor (who started
      # its latest attempt), the run URL and the time. No rollback-safety
      # verdict is sent: nothing classified this release, and with no opinion
      # recorded anything reading the timeline escalates instead of acting.
      # The sha and environment are the ones verify-deploy-run checked, which
      # is what its mark is for.
      #
      # previous-environment reads production's newest earlier release before
      # posting, for the changelog link below. For a staging deploy that shows
      # what is new since production.
      - name: Record release event in Flightdeck
        id: release-event
        if: steps.release.outputs.tag != ''
        continue-on-error: true
        uses: ./cru-github-actions/actions/flightdeck-release-event
        with:
          token: ${{ secrets.flightdeck-token }}
          endpoint: ${{ inputs.flightdeck-url }}
          project: ${{ needs.lookup.outputs.flightdeck-project }}
          app: ${{ inputs.project-name }}
          environment: ${{ steps.verify.outputs.environment }}
          kind: deploy
          release-tag: ${{ steps.release.outputs.tag }}
          build-number: ${{ steps.release.outputs.build-number }}
          sha: ${{ steps.verify.outputs.sha }}
          deployed-at: ${{ steps.verify.outputs.deployed-at }}
          actor: ${{ steps.verify.outputs.actor }}
          run-url: ${{ steps.verify.outputs.run-url }}
          previous-environment: production

      # Shaped like promote's and deploy-candidate's notices. Destination = the
      # app's SlackChannel; a silent no-op when the channel OR the bot token is
      # unset. The environment's name links to AppUrl when there is one. The
      # closing changelog link runs from production's previous release to this
      # commit, built by the same function the other workflows use, and is left
      # out when there is no previous release or it is this same commit.
      - name: Notify Slack
        if: steps.release.outputs.tag != ''
        continue-on-error: true
        env:
          SLACK_CHANNEL: ${{ needs.lookup.outputs.slack-channel }}
          SLACK_BOT_TOKEN: ${{ secrets.slack-bot-token }}
          APP_URL: ${{ needs.lookup.outputs.app-url }}
          ENVIRONMENT: ${{ steps.verify.outputs.environment }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.verify.outputs.sha }}
          ACTOR: ${{ steps.verify.outputs.actor }}
          RUN_URL: ${{ steps.verify.outputs.run-url }}
          PREV_SHA: ${{ steps.release-event.outputs.previous-sha }}
          FLIGHTDECK_URL: ${{ inputs.flightdeck-url }}
          FLIGHTDECK_WORKSPACE: ${{ vars.FLIGHTDECK_WORKSPACE }}
          FLIGHTDECK_PROJECT: ${{ needs.lookup.outputs.flightdeck-project }}
          APP_REPO: ${{ needs.lookup.outputs.repository }}
        run: |
          if [ -z "$SLACK_CHANNEL" ] || [ -z "$SLACK_BOT_TOKEN" ]; then
            exit 0
          fi
          payload=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg project "$PROJECT_NAME" \
            --arg environment "$ENVIRONMENT" \
            --arg tag "$TAG" \
            --arg sha "$SHA" \
            --arg actor "$ACTOR" \
            --arg runurl "$RUN_URL" \
            --arg appurl "$APP_URL" \
            --arg prevsha "$PREV_SHA" \
            --arg fdurl "$FLIGHTDECK_URL" \
            --arg workspace "$FLIGHTDECK_WORKSPACE" \
            --arg fdproject "$FLIGHTDECK_PROJECT" \
            --arg repository "$APP_REPO" \
            'def changelog($from; $to):
               ($fdurl | sub("/+\\z"; "")) as $base
               | if ($fdproject | test("\\A[A-Z][A-Z0-9]{0,9}\\z"))
                    and ($workspace | test("\\A[a-z0-9][a-z0-9-]*\\z"))
                    and ($base | test("\\Ahttps://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~-]+)*\\z"))
                    and ($repository == "" or ($repository | ascii_downcase) == (("CruGlobal/" + $project) | ascii_downcase))
                 then $base + "/" + ($workspace | @uri) + "/projects/" + ($fdproject | @uri)
                      + "/changelog?from=" + ($from | @uri) + "&to=" + ($to | @uri) + "&app=" + ($project | @uri)
                 else "https://deploys.cru.org/changelog?project=" + $project + "&from=" + $from + "&to=" + $to
                 end;
             (if $environment == "production" then "production" else "stage" end) as $envname
             | {channel: $channel,
                text: ((if $environment == "production" then ":white_check_mark:" else ":package:" end)
                       + " *\($project) deployed `\($tag)` to \(if $appurl != "" then "<" + $appurl + "|" + $envname + ">" else $envname end)*"
                       + (if $actor != "" then " by \($actor)" else "" end)
                       + (if $runurl != "" then "\nDeployed by the app'\''s own workflow: <" + $runurl + "|run>" else "" end)
                       + (if $prevsha != "" and $prevsha != $sha
                          then "\n<" + changelog($prevsha; $sha) + "|what'\''s in this release>"
                          else "" end))}')
          response=$(curl -fsS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload") || { echo "::warning title=Slack notify failed::post failed (non-blocking)"; exit 0; }
          echo "$response" | jq -e '.ok' >/dev/null || { echo "::warning title=Slack notify failed::$(echo "$response" | jq -r '.error // "post failed"') (non-blocking)"; }
