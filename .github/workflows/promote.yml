name: Promote

# Promote the artifact currently running in release-candidate to production.
# "Build once, promote the artifact": the exact digest running in release-
# candidate is deployed to production and tagged release-<yyyy-mm-dd>-<n> — the
# candidate tag's full suffix, build date + build number (no separate release
# counter — releases are traceable to their candidate for free; pre-D10
# candidates without a date yield release-<n>).
#
# Multi-provider router (D9 pattern at job level): a `lookup` job runs the authz
# gate + both app-info fetches (release-candidate and production) and outputs the
# provider + type + per-env project-ids. Provider jobs are gated on
# `needs.lookup.outputs.provider`.
#
# Authz checks the account that started the current run attempt, and it runs
# twice. `lookup` runs it so a refused run stops early. Each provider job runs
# it again as its first step, because "Re-run failed jobs" re-runs only the
# failed jobs and reuses a `lookup` that passed in an earlier attempt. Without
# the second check, that kind of re-run would change production with no check
# of who started it. An account in trusted-automation-actor-ids passes without
# push access on the app repo, but only when it started both the run and this
# attempt, the same rule rollback uses.
#
# Automation promotes one exact candidate. A caller that decides on its own
# when to promote (a scheduler, not a person) names what it saw and what it
# requires, and the provider job refuses the promote unless all of it still
# holds:
#
#   - expected-current-release: production's newest ledger row still names
#     this release.
#   - expected-candidate: the candidate this promote would ship is exactly this
#     candidate tag.
#   - require-rollback-safe: the rollback-safety verdict for this promote is
#     `safe`. `unclassified` is not safe.
#
# The checks run inside the production lock and before anything in production
# changes, including a migration that runs before the new release starts. Each
# refusal is an error whose title is a fixed reason word the caller can read
# from the run's annotations: actor_not_allowed, production_moved,
# candidate_moved or not_rollback_safe. The word names the check that refused;
# the message says why, including when the check could not get an answer
# (that is a refusal too). Every input defaults to off, so a person's promote
# runs exactly as before. An allowlisted automation account must set
# expected-candidate and require-rollback-safe, or `lookup` refuses it.
#
# The check also marks the attempt as checked for the rest of its job. The
# deploy, tag-image (release tags) and flightdeck-release-event actions refuse
# production work without that mark. That covers runs made before this check
# existed: "Re-run failed jobs" and "Re-run job" reuse such a run's old
# workflow file, which never calls the check, but it still loads these
# actions from the current release.
#
# Stage-less apps (`RcMode` "verify" in app-info) reach production by the same
# route with ONE substitution: there is no running release-candidate service to
# read the promotable digest off, so the candidate comes from the DEPLOYMENT
# LEDGER's release-candidate head -- the row deploy-candidate's verification run
# writes (CruGlobal/.github#441). Everything after the resolve step is shared:
# same release-name derivation, same rollback-safety advisory, same production
# deploy, same release tag, same ledger write. Promoting a stage-less app needs
# CruGlobal/.github#441 and CruGlobal/cru-terraform-modules#753 applied first --
# without them nothing writes the ledger row this reads and no app-info item
# carries `RcMode` at all.
#
# Pre-release apps (`Lifecycle` "pre-release" on the staging item, or simply no
# production app-info row) are REFUSED in `lookup`, as early as the data allows:
# they are stage-only on purpose and have no production environment to promote
# into. Both readings are handled in the two app-info steps below.

on:
  workflow_call:
    inputs:
      workflow-ref:
        type: string
        required: false
        default: main
        description: Branch, tag or commit of CruGlobal/.github to check the actions out at.
      project-name:
        type: string
        required: true
        description: Project name (shared-registry repo/image).
      trusted-automation-actor-ids:
        type: string
        required: false
        default: ''
        description: >-
          Comma-separated numeric GitHub user ids of automation accounts allowed
          to promote without per-repo push access. One passes only when it
          started the run and also started this attempt. Empty allows none.
      expected-candidate:
        type: string
        required: false
        default: ''
        description: >-
          When set, the promote is refused unless the candidate it would ship
          is exactly this candidate tag (candidate-[<yyyy-mm-dd>-]<n>, the
          candidate- prefix is optional). Automation sets it to the candidate
          it approved. Empty skips the check.
      expected-current-release:
        type: string
        required: false
        default: ''
        description: >-
          When set, the promote is refused unless production is still running
          this release (release-[<yyyy-mm-dd>-]<n>, the release- prefix is
          optional), checked inside the production lock. Automation sets it to
          the release it saw live. Empty skips the check.
      require-rollback-safe:
        type: boolean
        required: false
        default: false
        description: >-
          When true, the promote is refused, before anything in production
          changes, unless its rollback-safety verdict is safe. An unclassified
          verdict is not safe. False leaves the verdict advisory.
      # The changelog links' Flightdeck workspace is not an input. It is the
      # caller's FLIGHTDECK_WORKSPACE configuration variable (in a called
      # workflow, vars resolve in the caller's repository and organization),
      # because a caller that passes an input the called release does not
      # declare fails to start, and a new required-by-the-caller input would
      # stop it from moving back to an older release. flightdeck-url has a
      # default, so a caller that leaves it out works with any release.
      flightdeck-url:
        type: string
        required: false
        default: 'https://flightdeck.cru.org'
        description: >-
          Flightdeck base URL. Release events are posted there, and changelog
          links point there when the FLIGHTDECK_WORKSPACE variable is set.
          Leave it unset unless you need another Flightdeck: passing it ties
          the caller to releases that declare it.
    secrets:
      datadog-api-key:
        required: true
        description: DataDog API key.
      authz-token:
        required: true
        description: GitHub token used to verify the actor has push access to the app repo.
      slack-bot-token:
        required: false
        description: Slack bot token for pipeline notifications; unset disables posting.
      flightdeck-token:
        required: false
        description: Flightdeck PAT of the CruDeploy service user, for release-timeline events; unset disables posting.

jobs:
  lookup:
    name: Authorize & look up app info
    runs-on: ubuntu-latest
    # OIDC: the job assumes GitHubDeployECS to read app-info from DynamoDB.
    # contents: read lets it check this repo out for the authz action, which
    # reads permissions with the authz-token PAT.
    permissions:
      id-token: write
      contents: read
    outputs:
      provider: ${{ steps.app-info-rc.outputs.provider }}
      type: ${{ steps.app-info-rc.outputs.type }}
      rc-project-id: ${{ steps.app-info-rc.outputs.project-id }}
      prod-project-id: ${{ steps.app-info-prod.outputs.project-id }}
      # How this app's release candidate was gated: "deploy" (a real stage
      # deploy -- the default, and every app that has a stage environment) or
      # "verify" (stage-less; the candidate exists only in the ledger).
      rc-mode: ${{ steps.app-info-rc.outputs.rc-mode }}
      slack-channel: ${{ steps.app-info-prod.outputs.slack-channel }}
      flightdeck-project: ${{ steps.app-info-prod.outputs.flightdeck-project }}
      migrations-path: ${{ steps.app-info-prod.outputs.migrations-path }}
      migrations: ${{ steps.app-info-prod.outputs.migrations }}
      app-url: ${{ steps.app-info-prod.outputs.app-url }}
      repository: ${{ steps.app-info-prod.outputs.repository }}
    steps:
      # app-info comes straight from the CruApplicationInfo DynamoDB table rather
      # than the cru-app-info HTTP API -- the pipeline deploys that API itself, so
      # a promote must not depend on it being up. GitHubDeployECS regardless of the
      # app's provider: this runs before the provider/type fan-out, and the role's
      # trust is cru-deploy-repo-scoped, not runtime-scoped (same reasoning as the
      # ledger writes below).
      - name: Configure AWS credentials for app-info
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::056154071827:role/GitHubDeployECS

      # app-info for BOTH environments: release-candidate (to read the running
      # candidate) and production (to deploy into). The table is keyed by legacy
      # env names, so translate first. Provider must be gcp or aws.
      - name: Look up app info (release-candidate)
        id: app-info-rc
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          V2_ENV: release-candidate
        run: |
          case "$V2_ENV" in
            release-candidate) legacy_env=staging ;;
            production) legacy_env=production ;;
            preview) legacy_env=lab ;;
            *) echo "::error::unknown v2 environment $V2_ENV"; exit 1 ;;
          esac
          info=$(aws dynamodb get-item --region us-east-1 --output json \
            --table-name CruApplicationInfo \
            --key "$(jq -n --arg project "$PROJECT_NAME" --arg environment "$legacy_env" \
              '{Project: {S: $project}, Environment: {S: $environment}}')")
          item=$(echo "$info" | jq -c '.Item // empty')
          if [ -z "$item" ]; then
            echo "::error::no CruApplicationInfo row for project '$PROJECT_NAME' environment '$legacy_env' (v2 env $V2_ENV); add the row before promoting"
            exit 1
          fi
          provider=$(echo "$item" | jq -r '.Provider.S // empty')
          type=$(echo "$item" | jq -r '.Type.S // empty')
          project_id=$(echo "$item" | jq -r '.ProjectId.S // empty')
          # RcMode absent = "deploy". Terraform omits the attribute on the
          # default, so every pre-existing app item reads as a stage deploy
          # without being rewritten. Read from the release-candidate (legacy
          # `staging`) item, which is where the app's module writes it — for a
          # stage-less app that item exists ONLY to carry this gate's
          # configuration (cru-terraform-modules#753); nothing runs there.
          rc_mode=$(echo "$item" | jq -r '.RcMode.S // "deploy"')
          # PRE-RELEASE apps: stage-only, by design and for now. A release
          # candidate exists and is gated normally; production does not exist
          # yet, so there is nothing to promote INTO. `Lifecycle` is written on
          # the staging item by the app module's `pre_release` knob and is absent
          # on every launched app, so existing items read as launched without
          # being rewritten (the same omitted-on-default idiom as RcMode).
          #
          # Refused HERE, in the first step that reads app-info: before the
          # production lookup, before any credential is assumed, and long before
          # a provider job. Without this the run died at the production app-info
          # read with "add the row before promoting" -- true but misleading
          # advice for an app that is not supposed to have one yet.
          lifecycle=$(echo "$item" | jq -r '.Lifecycle.S // empty')
          if [ "$lifecycle" = "pre-release" ]; then
            echo "::error title=Pre-release app::$PROJECT_NAME is pre-release: no production environment exists; promote is unavailable until the app launches. Its candidates still build and gate on release-candidate. Launching means standing up the app's production Terraform directory and clearing pre_release on the stage module -- ask #dps-devops."
            exit 1
          fi
          case "$provider" in
            gcp|aws) ;;
            *) echo "::error::unsupported provider '$provider' for $PROJECT_NAME (expected gcp or aws)"; exit 1 ;;
          esac
          # Validate the gate here, in the one job that reads app-info and the
          # one that always runs, so a misconfigured app fails before anything
          # touches production — same placement and reasoning as
          # deploy-candidate's lookup.
          case "$rc_mode" in
            deploy) ;;
            verify)
              if [ "$provider" != "aws" ]; then
                echo "::error::RcMode 'verify' is aws-only today (got provider '$provider' for $PROJECT_NAME); stage-less candidate resolution is implemented for the ECR path only."
                exit 1
              fi
              ;;
            *) echo "::error::unsupported RcMode '$rc_mode' for $PROJECT_NAME (expected deploy or verify)"; exit 1 ;;
          esac
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "project-id=$project_id" >> "$GITHUB_OUTPUT"
          echo "rc-mode=$rc_mode" >> "$GITHUB_OUTPUT"
          echo "::notice::app-info $PROJECT_NAME/$V2_ENV -> provider=$provider type=$type project=$project_id"

      - name: Look up app info (production)
        id: app-info-prod
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          V2_ENV: production
        run: |
          case "$V2_ENV" in
            release-candidate) legacy_env=staging ;;
            production) legacy_env=production ;;
            preview) legacy_env=lab ;;
            *) echo "::error::unknown v2 environment $V2_ENV"; exit 1 ;;
          esac
          info=$(aws dynamodb get-item --region us-east-1 --output json \
            --table-name CruApplicationInfo \
            --key "$(jq -n --arg project "$PROJECT_NAME" --arg environment "$legacy_env" \
              '{Project: {S: $project}, Environment: {S: $environment}}')")
          item=$(echo "$info" | jq -c '.Item // empty')
          # No production row = no production environment. The pre-release check
          # in the release-candidate step above catches this for an app whose
          # module DECLARES the state; this is the same refusal for one that has
          # not been re-applied yet (or was never marked), so the two readings
          # get one message rather than the old "add the row before promoting",
          # which reads as a misconfiguration and is wrong for a pre-release app.
          if [ -z "$item" ]; then
            echo "::error title=No production environment::$PROJECT_NAME has no CruApplicationInfo row for '$legacy_env', so there is no production environment to promote into. If the app is pre-release (stage-only) this is expected -- promote becomes available when it launches: stand up its production Terraform directory and clear pre_release on the stage module. If it is meant to have production already, that directory has not been applied. Ask #dps-devops."
            exit 1
          fi
          project_id=$(echo "$item" | jq -r '.ProjectId.S // empty')
          slack_channel=$(echo "$item" | jq -r '.SlackChannel.S // empty')
          migrations_path=$(echo "$item" | jq -r '.MigrationsPath.S // empty')
          # Migrations = "none" is the module DECLARING the app has no database
          # migrations, which an absent MigrationsPath cannot express (that also
          # covers "has migrations the classifier can't see"). Empty for apps on
          # module versions that predate the declaration.
          migrations=$(echo "$item" | jq -r '.Migrations.S // empty')
          app_url=$(echo "$item" | jq -r '.AppUrl.S // empty')
          flightdeck_project=$(echo "$item" | jq -r '.FlightdeckProject.S // empty')
          # Repository is written only when the app repo is not named after the project.
          repository=$(echo "$item" | jq -r --arg default "CruGlobal/$PROJECT_NAME" '.Repository.S // $default')
          echo "project-id=$project_id" >> "$GITHUB_OUTPUT"
          echo "slack-channel=$slack_channel" >> "$GITHUB_OUTPUT"
          echo "migrations-path=$migrations_path" >> "$GITHUB_OUTPUT"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "app-url=$app_url" >> "$GITHUB_OUTPUT"
          echo "flightdeck-project=$flightdeck_project" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "::notice::app-info $PROJECT_NAME/$V2_ENV -> project=$project_id"

      # The checkout only fetches this repo so the authz action below can run.
      # It holds no production credentials.
      - name: Checkout Cru Actions & Workflows
        uses: actions/checkout@v7
        with:
          repository: CruGlobal/.github
          ref: ${{ inputs.workflow-ref }}
          path: cru-github-actions

      # Authorization, the early copy. It follows the app-info lookups only
      # because the repo is read from the production item (the fleet default
      # CruGlobal/<project-name> otherwise). Each provider job runs the same
      # check again; see the note at the top of this file. A run is allowed in
      # one of two ways:
      #
      #   1. Allowlisted automation actor. The run was dispatched by an account
      #      whose numeric user id (github.actor_id) is in
      #      trusted-automation-actor-ids, AND this attempt was started by that
      #      same account: the same login, and that login still looks up to
      #      the same user id. Automation accounts such as a GitHub App's bot
      #      user are not collaborators on app repos, so the push-access check
      #      below cannot vouch for them.
      #   2. Push access. Otherwise the account that started THIS attempt
      #      (github.triggering_actor, not github.actor) must have push-level
      #      access to the app repo. On a re-run github.actor stays the account
      #      that started the first attempt, and the re-runner is the one whose
      #      access matters. That is also why a re-run of an allowlisted
      #      actor's run by anyone else falls through to this check.
      #
      # A refusal's error is titled actor_not_allowed.
      # TODO: replace PAT with a dedicated GitHub App.
      - name: Authorize actor
        id: authz
        uses: ./cru-github-actions/actions/authorize-actor
        with:
          github-token: ${{ secrets.authz-token }}
          repository: ${{ steps.app-info-prod.outputs.repository }}
          operation: promote
          trusted-automation-actor-ids: ${{ inputs.trusted-automation-actor-ids }}
          refusal-title: actor_not_allowed

      # An automation account may promote one exact candidate, not whatever
      # release-candidate runs. When the check above let this run through as
      # an allowlisted automation account, the run must name its candidate
      # (expected-candidate) and require a safe verdict
      # (require-rollback-safe), or it is refused as actor_not_allowed. So a
      # scheduler that loses those inputs by mistake cannot ship more than a
      # person could check. expected-current-release stays optional, because an
      # app's first promote has no release in production to name. A person's
      # promote skips this step.
      #
      # This job is the only place it is checked, and that is enough. The
      # inputs are the same on every attempt, and an automation account only
      # passes as one on a run it started itself, where this job ran for it.
      # An empty passed-as (an action bundle older than this workflow) skips
      # the check rather than refusing every promote.
      - name: Refuse an automation promote that does not name its candidate
        env:
          PASSED_AS: ${{ steps.authz.outputs.passed-as }}
          EXPECTED_CANDIDATE: ${{ inputs.expected-candidate }}
          REQUIRE_ROLLBACK_SAFE: ${{ inputs.require-rollback-safe }}
        run: |
          if [ "$PASSED_AS" != "automation" ]; then
            exit 0
          fi
          missing=""
          if [[ ! "$EXPECTED_CANDIDATE" =~ [^[:space:]] ]]; then
            missing="expected-candidate"
          fi
          if [ "$REQUIRE_ROLLBACK_SAFE" != "true" ]; then
            missing="${missing:+$missing and }require-rollback-safe: true"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=actor_not_allowed::an automation account may only promote a candidate it names, with a safe rollback-safety verdict required, and this run does not set $missing; refusing to promote. Nothing in production was changed"
            exit 1
          fi
          echo "an automation account started this promote, and it names its candidate and requires a safe verdict"

  promote-gcp:
    name: Promote release-candidate to production (Cloud Run)
    needs: lookup
    if: needs.lookup.outputs.provider == 'gcp'
    runs-on: ubuntu-latest
    # A backstop for anything the deploy path does not model: without it a job
    # inherits GitHub's six-hour default, and a Cloud Run call that hangs holds
    # a runner for the rest of the morning. Well clear of a real deploy.
    timeout-minutes: 60
    # Shared production lock with rollback: only one production mutation per app
    # at a time, and never cancelled mid-flight.
    concurrency:
      group: production-${{ inputs.project-name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_NAME: ${{ inputs.project-name }}
      DD_API_KEY: ${{ secrets.datadog-api-key }}
    steps:
      - name: Checkout Cru Actions & Workflows
        uses: actions/checkout@v7
        with:
          repository: CruGlobal/.github
          ref: ${{ inputs.workflow-ref }}
          path: cru-github-actions

      # --- Authz for this attempt (inside the production lock) --------------
      # FIRST real step on purpose, before the stale-promote guard and before
      # any credential is set up. The check in `lookup` does not cover every
      # re-run: "Re-run failed jobs" re-runs only this job and reuses the
      # earlier attempt's `lookup`, so this step is what checks the account
      # that started the re-run. Same rule, same allowlist and same action as
      # `lookup`. The checkout above only fetches this repo and holds no
      # production credentials.
      - name: Authorize the account that started this attempt
        uses: ./cru-github-actions/actions/authorize-actor
        with:
          github-token: ${{ secrets.authz-token }}
          repository: ${{ needs.lookup.outputs.repository }}
          operation: promote
          trusted-automation-actor-ids: ${{ inputs.trusted-automation-actor-ids }}
          refusal-title: actor_not_allowed

      # --- Stale-promote guard (inside the production lock) -----------------
      # Runs right after the authz check and before any credential is set up,
      # on purpose. This job's concurrency group is the production lock it
      # shares with rollback, so every step here runs while the job holds it,
      # and no other promote or rollback of this app can start until the job
      # ends. A promote that waited for the lock behind another promote or a
      # rollback sees that run's result here, before anything is resolved or
      # deployed. That is also why the check lives in the provider jobs and
      # not in `lookup`, which runs outside the lock. (GitHub keeps only one
      # job waiting for the lock: a newer one cancels it, and a cancelled
      # promote never runs this step or anything after it.)
      #
      # Unset => no check (a person promoting by hand). Set => the newest
      # production row in the deployment ledger must name that release, or the
      # promote is refused as production_moved. It fails CLOSED: a ledger that
      # can't be read, or doesn't say what production runs, is a refusal, not
      # a pass. An app's first promote has no production row to match, so a
      # caller leaves this unset for one.
      #
      # A refusal also sets PROMOTE_REFUSED for the rest of the job, so the
      # failure notice in Slack says the promote was refused and production
      # did not change, rather than that it failed.
      #
      # Known, accepted gap, the same as rollback's guard: ledger writes are
      # best-effort (continue-on-error), so a production change whose ledger
      # write failed is invisible here.
      - name: Refuse a stale promote
        env:
          EXPECTED_CURRENT_RELEASE: ${{ inputs.expected-current-release }}
        run: |
          if [ -z "$EXPECTED_CURRENT_RELEASE" ]; then
            echo "expected-current-release is not set, so this promote does not check what production is running first"
            exit 0
          fi
          # One line, always: an input can hold a line break, and what follows
          # one must not read as a workflow command of its own.
          refuse() {
            local message="${1//[$'\r\n']/ }"
            echo "PROMOTE_REFUSED=production_moved" >> "$GITHUB_ENV"
            echo "::error title=production_moved::$message"
            exit 1
          }

          # Same rules as rollback's guard: the release- prefix is optional and
          # surrounding whitespace is trimmed. Prints the tag without its
          # prefix, or fails if it is not a release tag.
          normalize() {
            local value="$1"
            if [[ "$value" =~ ^[[:space:]]*([^[:space:]].*[^[:space:]]|[^[:space:]])[[:space:]]*$ ]]; then
              value="${BASH_REMATCH[1]}"
            fi
            value="${value#release-}"
            [[ "$value" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2}-)?[0-9]+$ ]] && printf '%s' "$value"
          }
          if ! expected=$(normalize "$EXPECTED_CURRENT_RELEASE"); then
            refuse "invalid expected-current-release '$EXPECTED_CURRENT_RELEASE'; expected 'release-[<yyyy-mm-dd>-]<n>' (the release- prefix is optional). Refusing to promote"
          fi

          # Fail closed from here on: without a trustworthy answer to "what is
          # production running", refuse rather than guess.
          unconfirmed="cannot confirm production is still running release-$expected; refusing to promote. Nothing in production was changed"
          if ! body=$(curl -fsS --max-time 20 --retry 2 --retry-delay 3 \
              "https://deploys.cru.org/deployments?project=$PROJECT_NAME&environment=production&limit=1"); then
            refuse "could not read the deployment ledger for $PROJECT_NAME, so $unconfirmed"
          fi
          if ! count=$(printf '%s' "$body" | jq -er '.Items | if type == "array" then length else error("no Items array") end' 2>/dev/null); then
            refuse "the deployment ledger for $PROJECT_NAME returned an unexpected response (not JSON with an Items array), so $unconfirmed"
          fi
          if [ "$count" -eq 0 ]; then
            refuse "the deployment ledger has no production rows for $PROJECT_NAME, so $unconfirmed"
          fi
          current=$(printf '%s' "$body" | jq -r '.Items[0].Revision | if type == "string" then . else "" end' 2>/dev/null) || current=""
          if [ -z "$current" ]; then
            refuse "the newest production row in the deployment ledger for $PROJECT_NAME has no Revision, so $unconfirmed"
          fi

          if [ "${current#release-}" != "$expected" ]; then
            if [[ "$expected" =~ ^[0-9]+$ ]] && [[ "$current" == *"-$expected" ]]; then
              refuse "expected-current-release '$EXPECTED_CURRENT_RELEASE' is a bare build number, but production's release tag is dated ($current); pass the full tag. Refusing to promote"
            fi
            refuse "production is now running $current, not release-$expected, so this promote was asked for against a release that is no longer live; refusing to promote. Nothing in production was changed. Start a new promote if the candidate should still ship"
          fi
          echo "::notice::production is still running $current, as expected; going ahead with the promote"

      - name: Configure GCP credentials (release-candidate SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: cru-deploy@${{ needs.lookup.outputs.rc-project-id }}.iam.gserviceaccount.com

      # The image release-candidate is SERVING (each service's serving
      # revision, not its template), so a candidate that never went live there
      # cannot be promoted. When there is no single serving image (no ready
      # revision, services serving different images, or split traffic) this
      # step fails and the promote stops here.
      - name: Resolve running release-candidate image
        uses: ./cru-github-actions/actions/resolve-image
        id: resolve
        with:
          type: cloudrun
          project-name: ${{ inputs.project-name }}
          mode: environment
          environment: release-candidate
          runtime-project: ${{ needs.lookup.outputs.rc-project-id }}

      # Derive the release number from the candidate tag on the running digest.
      # Fails clearly if the running image was not deployed from a candidate.
      - name: Determine release number from candidate
        id: release
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          candidate=$(echo "$TAGS" | tr ',' '\n' | grep -E '^candidate-([0-9]{4}-[0-9]{2}-[0-9]{2}-)?[0-9]+$' | head -n1 || true)
          if [ -z "$candidate" ]; then
            echo "::error::the running release-candidate image (digest $DIGEST) has no candidate tag; cannot derive a release name. Deploy a candidate via deploy-candidate first."
            exit 1
          fi
          suffix="${candidate#candidate-}"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "release=release-$suffix" >> "$GITHUB_OUTPUT"

      # --- Moved-candidate guard (inside the production lock) ---------------
      # Unset => no check. Set => the candidate this promote would ship (the
      # candidate tag the step above read off the resolved digest, which is
      # also what names the release) must be exactly that tag, or the promote
      # is refused as candidate_moved. A newer candidate reaching
      # release-candidate after the caller approved this one is the usual
      # cause. It runs after the resolve, so it checks the very digest the
      # deploy below ships, and before any production credential is set up.
      #
      # A digest that carries more than one candidate tag is refused too when
      # the release would not be named after the expected one: the caller
      # waits for a release with that name, and it would never come.
      - name: Refuse a moved candidate
        env:
          EXPECTED_CANDIDATE: ${{ inputs.expected-candidate }}
          CANDIDATE: ${{ steps.release.outputs.candidate }}
          RELEASE: ${{ steps.release.outputs.release }}
          TAGS: ${{ steps.resolve.outputs.tags }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          if [ -z "$EXPECTED_CANDIDATE" ]; then
            echo "expected-candidate is not set, so this promote does not check which candidate it ships"
            exit 0
          fi
          # One line, always: an input can hold a line break, and what follows
          # one must not read as a workflow command of its own.
          refuse() {
            local message="${1//[$'\r\n']/ }"
            echo "PROMOTE_REFUSED=candidate_moved" >> "$GITHUB_ENV"
            echo "::error title=candidate_moved::$message"
            exit 1
          }

          # The candidate- prefix is optional and surrounding whitespace is
          # trimmed, the same rules the release guards use for release-.
          value="$EXPECTED_CANDIDATE"
          if [[ "$value" =~ ^[[:space:]]*([^[:space:]].*[^[:space:]]|[^[:space:]])[[:space:]]*$ ]]; then
            value="${BASH_REMATCH[1]}"
          fi
          value="${value#candidate-}"
          if [[ ! "$value" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2}-)?[0-9]+$ ]]; then
            refuse "invalid expected-candidate '$EXPECTED_CANDIDATE'; expected 'candidate-[<yyyy-mm-dd>-]<n>' (the candidate- prefix is optional). Refusing to promote"
          fi
          expected="candidate-$value"

          if [ -z "$CANDIDATE" ]; then
            refuse "could not tell which candidate this promote would ship (digest $DIGEST), so it cannot be confirmed as $expected; refusing to promote. Nothing in production was changed"
          fi
          if [ "$CANDIDATE" = "$expected" ]; then
            echo "::notice::this promote ships $expected (digest $DIGEST), as expected"
            exit 0
          fi
          if [[ "$value" =~ ^[0-9]+$ ]] && [[ "$CANDIDATE" == *"-$value" ]]; then
            refuse "expected-candidate '$EXPECTED_CANDIDATE' is a bare build number, but the candidate tag is dated ($CANDIDATE); pass the full tag. Refusing to promote"
          fi
          if printf '%s\n' "$TAGS" | tr ',' '\n' | grep -qxF -- "$expected"; then
            refuse "the release-candidate digest $DIGEST carries $expected but also $CANDIDATE, and this promote would name the release $RELEASE after $CANDIDATE, not $expected; refusing to promote. Nothing in production was changed"
          fi
          refuse "the release candidate is now $CANDIDATE (digest $DIGEST), not $expected, so it is not the candidate this promote was asked for; refusing to promote. Nothing in production was changed. Start a new promote to ship $CANDIDATE"

      # --- Rollback-safety classification (advisory unless required) --------
      # The git sha currently in production, from the deployments ledger -- the
      # baseline the candidate's migrations are diffed against. Empty on ANY
      # failure (|| true), which the classifier treats as `unclassified` (e.g.
      # the very first promote, before any production baseline exists).
      - name: Fetch production baseline
        id: baseline
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
        run: |
          prev_sha=$(curl -fsS "https://deploys.cru.org/deployments?project=$PROJECT_NAME&environment=production&limit=1" | jq -r '.Items[0].Sha // empty') || true
          echo "prev-sha=$prev_sha" >> "$GITHUB_OUTPUT"
          # The candidate's git sha is the sha-<gitsha> tag on the resolved
          # digest (the head of the classification diff). Empty -> unclassified.
          head_sha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"

      # Classify the migrations added between the production baseline and the
      # candidate as additive (EXPAND, rollback-safe) or destructive (CONTRACT).
      # An app whose app-info declares `Migrations = "none"` is rollback-safe
      # without any diff at all -- that declaration is the only thing that
      # distinguishes "has no migrations" from "has migrations we can't see".
      # The action NEVER fails; continue-on-error is a belt on top of that.
      - name: Classify rollback safety
        id: rollback-safety
        continue-on-error: true
        uses: ./cru-github-actions/actions/classify-rollback-safety
        with:
          github-token: ${{ secrets.authz-token }}
          repository: ${{ needs.lookup.outputs.repository }}
          base-sha: ${{ steps.baseline.outputs.prev-sha }}
          head-sha: ${{ steps.baseline.outputs.head-sha }}
          migrations-path: ${{ needs.lookup.outputs.migrations-path }}
          migrations: ${{ needs.lookup.outputs.migrations }}

      # --- Rollback-safety requirement --------------------------------------
      # require-rollback-safe false (the default) => the verdict stays
      # advisory, exactly as before: it goes to the ledger, Slack and the
      # release event, and never stops a promote. True => the promote is
      # refused as not_rollback_safe unless the verdict is `safe`. Anything
      # else refuses: `unsafe`, `unclassified` (a first promote with no
      # baseline, no migrations path, no candidate sha, a compare that
      # failed), and no verdict at all (the classifier step is allowed to
      # fail). Placed before the production credential and the deploy, so a
      # refusal happens before anything in production changes, including the
      # migration the deploy runs first.
      - name: Refuse a promote that is not rollback-safe
        env:
          REQUIRE_ROLLBACK_SAFE: ${{ inputs.require-rollback-safe }}
          VERDICT: ${{ steps.rollback-safety.outputs.verdict }}
          REASONS: ${{ steps.rollback-safety.outputs.reasons }}
        run: |
          # The verdict is one of three words, but it is printed below, so it
          # is kept to one line whatever it holds.
          VERDICT="${VERDICT//[$'\r\n']/ }"
          if [ "$REQUIRE_ROLLBACK_SAFE" != "true" ]; then
            echo "require-rollback-safe is not set, so the rollback-safety verdict (${VERDICT:-none}) is advisory"
            exit 0
          fi
          # The first two reasons, on one line, for the messages below. A
          # reason can quote a file name, so any line break in it becomes a
          # space: the error must stay one line, or the rest of a reason could
          # read as a workflow command of its own.
          reasons=$(printf '%s' "${REASONS:-[]}" | jq -j 'if type == "array" then .[0:2] | map(tostring) | join("; ") else empty end' 2>/dev/null | tr '\r\n' '  ') || reasons=""
          if [ "$VERDICT" = "safe" ]; then
            echo "::notice::the rollback-safety verdict is safe${reasons:+ ($reasons)}; going ahead with the promote"
            exit 0
          fi
          echo "PROMOTE_REFUSED=not_rollback_safe" >> "$GITHUB_ENV"
          case "$VERDICT" in
            unsafe) why="the rollback-safety verdict for this promote is unsafe${reasons:+ ($reasons)}" ;;
            unclassified) why="the rollback-safety verdict for this promote is unclassified${reasons:+ ($reasons)}, and require-rollback-safe counts that as not safe" ;;
            "") why="the rollback-safety check gave no verdict (see the Classify rollback safety step)" ;;
            *) why="the rollback-safety check gave an unknown verdict '$VERDICT'" ;;
          esac
          echo "::error title=not_rollback_safe::$why; require-rollback-safe is set, so the promote is refused before anything in production changes. Nothing in production was changed. A person can promote it without require-rollback-safe after checking that the release now in production still works with the new schema"
          exit 1

      - name: Configure GCP credentials (production SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: cru-deploy@${{ needs.lookup.outputs.prod-project-id }}.iam.gserviceaccount.com

      - name: Record deploy start
        run: echo "DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Deploy to production
        uses: ./cru-github-actions/actions/deploy
        with:
          type: cloudrun
          project-name: ${{ inputs.project-name }}
          environment: production
          runtime-project: ${{ needs.lookup.outputs.prod-project-id }}
          image: ${{ steps.resolve.outputs.image }}
          app-url: ${{ needs.lookup.outputs.app-url }}

      # Tag the promoted digest release-<n> in the shared registry (the prod
      # cru-deploy SA holds AR writer there). Replaces the gcloud CLI tagging step
      # with the provider-agnostic tag-image action.
      - name: Tag digest as release
        uses: ./cru-github-actions/actions/tag-image
        with:
          type: cloudrun
          project-name: ${{ inputs.project-name }}
          digest: ${{ steps.resolve.outputs.digest }}
          tag: ${{ steps.release.outputs.release }}

      # Publish a GitHub Release on the APP repo, so each app's own Releases page
      # is the human-readable record of what reached production and when: git tag
      # = the release name, pointing at the promoted commit (the `sha-<gitsha>`
      # tag the candidate digest carries — the same sha the rollback-safety
      # classifier diffs), title = the release name, marked latest.
      #
      # The body is deliberately a short header — digest, promoted-by, run link,
      # changelog link for the range. It does NOT restate the commit list: the
      # changelog page is the canonical rendering of "what's in this release"
      # (it resolves release names through to shas), and a second copy here
      # would only drift from it. Same dead-link rule as
      # the Slack notify — with no baseline sha (first promote, or a failed ledger
      # query) the changelog line is omitted rather than emitted broken.
      #
      # The changelog link is the one the Slack notify builds, with the same
      # rule: Flightdeck's changelog page when the FLIGHTDECK_WORKSPACE variable
      # is set, the FlightdeckProject is a valid identifier and the app has no
      # Repository override, otherwise the deploys.cru.org link, unchanged.
      #
      # Credential: the existing `authz-token`. It is already this workflow's
      # app-repo credential — the authz gate reads collaborator permission with
      # it and the rollback-safety classifier fetches the app repo's compare with
      # it — so a release write adds no new credential *surface*, only a new verb.
      # The run-scoped GITHUB_TOKEN cannot substitute: it is scoped to the calling
      # cru-deploy repo, not the app repo. The narrower long-term home is the
      # org-wide "Cru Deploy" GitHub App, which needs two things it does not have
      # yet: Contents bumped read -> write, and its key made reachable from
      # cru-deploy workflows (today it lives only in SSM /ecs/cru-app-info/*).
      #
      # NEVER fails the promote. Production is already updated by the time this
      # runs, so a missing Releases entry is a bookkeeping loss, not an incident:
      # continue-on-error, plus in-step handling that turns any non-2xx into a
      # warning naming the likely fix. A re-run of an already-promoted candidate
      # re-POSTs the same release name and gets 422 already_exists — that is the
      # correct end state, so it degrades to a notice instead of a warning.
      - name: Publish GitHub Release on the app repo
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.authz-token }}
          APP_REPO: ${{ needs.lookup.outputs.repository }}
          RELEASE: ${{ steps.release.outputs.release }}
          COMMIT_SHA: ${{ steps.baseline.outputs.head-sha }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          PREV_SHA: ${{ steps.baseline.outputs.prev-sha }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          FLIGHTDECK_URL: ${{ inputs.flightdeck-url }}
          FLIGHTDECK_WORKSPACE: ${{ vars.FLIGHTDECK_WORKSPACE }}
          FLIGHTDECK_PROJECT: ${{ needs.lookup.outputs.flightdeck-project }}
        run: |
          if [ -z "$COMMIT_SHA" ]; then
            echo "::warning title=GitHub Release skipped::the promoted digest carries no sha- tag, so there is no commit for $RELEASE to point at on $APP_REPO (non-blocking)"
            exit 0
          fi
          # make_latest is a string enum ("true"/"false"/"legacy"), not a boolean.
          payload=$(jq -n \
            --arg tag "$RELEASE" \
            --arg target "$COMMIT_SHA" \
            --arg digest "$DIGEST" \
            --arg actor "$ACTOR" \
            --arg triggering "$TRIGGERING_ACTOR" \
            --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg project "$PROJECT_NAME" \
            --arg prevsha "$PREV_SHA" \
            --arg fdurl "$FLIGHTDECK_URL" \
            --arg workspace "$FLIGHTDECK_WORKSPACE" \
            --arg fdproject "$FLIGHTDECK_PROJECT" \
            --arg repository "$APP_REPO" \
            'def changelog($from; $to):
               ($fdurl | sub("/+\\z"; "")) as $base
               | if ($fdproject | test("\\A[A-Z][A-Z0-9]{0,9}\\z"))
                    and ($workspace | test("\\A[a-z0-9][a-z0-9-]*\\z"))
                    and ($base | test("\\Ahttps://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~-]+)*\\z"))
                    and ($repository == "" or ($repository | ascii_downcase) == (("CruGlobal/" + $project) | ascii_downcase))
                 then $base + "/" + ($workspace | @uri) + "/projects/" + ($fdproject | @uri)
                      + "/changelog?from=" + ($from | @uri) + "&to=" + ($to | @uri) + "&app=" + ($project | @uri)
                 else "https://deploys.cru.org/changelog?project=" + $project + "&from=" + $from + "&to=" + $to
                 end;
             {tag_name: $tag, target_commitish: $target, name: $tag,
              draft: false, prerelease: false, make_latest: "true",
              body: ("Promoted to production by @\($actor)"
                     + (if $triggering != "" and $triggering != $actor then " (re-run by @\($triggering))" else "" end)
                     + ".\n\n"
                     + "- Image digest: `\($digest)`\n"
                     + "- Promote run: \($runurl)\n"
                     + (if $prevsha != ""
                        then "- [Changes in this release](" + changelog($prevsha; $tag) + ")\n"
                        else "" end))}')
          # gh api puts the JSON body on stdout (success AND error) and its human
          # summary on stderr, so capture stdout only: stderr stays in the run log
          # where an operator wants it, and nothing can corrupt the JSON parse.
          if response=$(printf '%s' "$payload" | gh api -X POST "repos/$APP_REPO/releases" --input -); then
            echo "::notice title=Release published::$(echo "$response" | jq -r '.html_url // empty')"
          else
            case "$response" in
              *already_exists*)
                echo "::notice title=Release already published::$RELEASE already exists on $APP_REPO; left as-is"
                ;;
              *)
                echo "::warning title=GitHub Release failed::could not publish $RELEASE on $APP_REPO (non-blocking). A 403/404 here means authz-token lacks contents:write on the app repo — see this step's credential note."
                ;;
            esac
          fi

      - name: Record deployment event in Datadog
        continue-on-error: true
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE: ${{ steps.release.outputs.release }}
          CANDIDATE: ${{ steps.release.outputs.candidate }}
        run: |
          # sha-<gitsha> tag on the resolved digest -> sha:<gitsha> event tag, so
          # events are joinable to commits (deployments-ledger precursor). Omitted
          # cleanly when the digest carries no sha- tag.
          gitsha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          # Name who pressed re-run when it is not the account that started
          # the run.
          rerun=""
          if [ -n "$TRIGGERING_ACTOR" ] && [ "$TRIGGERING_ACTOR" != "$ACTOR" ]; then
            rerun="$TRIGGERING_ACTOR"
          fi
          jq -n \
            --arg title "Promoted: $PROJECT_NAME $CANDIDATE -> $RELEASE" \
            --arg text "Pipeline v2 production promotion by ${ACTOR}${rerun:+ (re-run by $rerun)} (started $DEPLOY_STARTED_AT)" \
            --arg service "$PROJECT_NAME" \
            --arg actor "$ACTOR" \
            --arg gitsha "$gitsha" \
            --arg rerun "$rerun" \
            --arg release "$RELEASE" \
            --arg candidate "$CANDIDATE" \
            '{title: $title, text: $text, alert_type: "info",
              aggregation_key: ("deploy:" + $service + ":production"),
              tags: (["source:cru-pipeline-v2", ("service:" + $service),
                     "environment:production", "action:promote",
                     ("revision:" + $release), ("candidate:" + $candidate),
                     ("actor:" + $actor)]
                     + (if $gitsha != "" then ["sha:" + $gitsha] else [] end)
                     + (if $rerun != "" then ["rerun_by:" + $rerun] else [] end))}' \
          | curl -fsS --retry 3 -X POST "https://api.datadoghq.com/api/v1/events" \
              -H "Content-Type: application/json" -H "DD-API-KEY: $DD_API_KEY" -d @- \
            || echo "::warning title=Datadog telemetry failed::promotion event for $PROJECT_NAME $RELEASE not recorded (non-blocking)"

      # The deployments-ledger write grant lives on the existing deploy roles
      # (ratified: no dedicated ledger role). GCP jobs carry no AWS creds, so
      # assume a deploy role here solely to append the ledger event -- ECS is
      # chosen arbitrarily; the trust is cru-deploy-repo-scoped, not runtime-
      # scoped. Placed AFTER all GCP deploy/tag-image steps so its AWS
      # credential env vars can't interfere; configure-aws-credentials next to
      # an earlier google-github-actions/auth is fine (different env vars).
      - name: Configure AWS credentials for ledger
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::056154071827:role/GitHubDeployECS

      # Append the event to the CruDeploymentLedger DynamoDB table (app-info's
      # deployments ledger -- the fleet dashboard / DORA data spine). Same
      # policy as all telemetry: NEVER fails the deploy.
      #
      # Actor is github.actor, the account that started the run's first
      # attempt. TriggeringActor is github.triggering_actor, the account that
      # started THIS attempt, which is the one the Flightdeck release event
      # names. Both go on every row, and they differ only when another account
      # re-ran the run.
      - name: Record deployment in ledger
        continue-on-error: true
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REVISION: ${{ steps.release.outputs.release }}
          VERDICT: ${{ steps.rollback-safety.outputs.verdict }}
          ROLLBACK_REASONS: ${{ steps.rollback-safety.outputs.reasons }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          gitsha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          # Rollback-safety verdict -> RollbackSafe true/false (omitted when unclassified).
          rollback_safe=""
          case "$VERDICT" in safe) rollback_safe=true ;; unsafe) rollback_safe=false ;; esac
          aws dynamodb put-item --region us-east-1 \
            --table-name CruDeploymentLedger \
            --item "$(jq -n \
              --arg project "$PROJECT_NAME" \
              --arg eventat "${now}#${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --arg eventdate "${now%%T*}" \
              --arg environment production \
              --arg action promote \
              --arg source cru-pipeline-v2 \
              --arg revision "$REVISION" \
              --arg digest "$DIGEST" \
              --arg sha "$gitsha" \
              --arg actor "$ACTOR" \
              --arg triggeringactor "$TRIGGERING_ACTOR" \
              --arg runid "$GITHUB_RUN_ID" \
              --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg rollbacksafe "$rollback_safe" \
              --arg rollbackreasons "$ROLLBACK_REASONS" \
              --arg provider gcp \
              --arg type cloudrun \
              '{Project: {S: $project}, EventAt: {S: $eventat}, EventDate: {S: $eventdate},
                Environment: {S: $environment}, Action: {S: $action}, Source: {S: $source},
                Revision: {S: $revision}, Digest: {S: $digest}, Actor: {S: $actor},
                TriggeringActor: {S: $triggeringactor},
                RunId: {S: $runid}, RunUrl: {S: $runurl}, Provider: {S: $provider},
                Type: {S: $type}}
                + (if $sha != "" then {Sha: {S: $sha}} else {} end)
                + (if $rollbacksafe != "" then {RollbackSafe: {S: $rollbacksafe}} else {} end)
                + (if ($rollbacksafe != "" and $rollbackreasons != "" and $rollbackreasons != "[]") then {RollbackSafeReasons: {S: $rollbackreasons}} else {} end)')" \
            || echo "::warning title=Ledger write failed::promotion event for $PROJECT_NAME $REVISION not recorded in ledger (non-blocking)"

      # Record the release on the app's Flightdeck project timeline (GateOps
      # Phase 0). Project = app-info FlightdeckProject; credential = the CruDeploy
      # service user's PAT held by cru-deploy. Either unset => silent skip. Same
      # telemetry policy as the ledger: the action never fails, continue-on-error
      # is the belt on top.
      #
      # actor is the account that started THIS attempt (github.triggering_actor,
      # not github.actor, which stays the first attempt's account on a re-run),
      # run-url names this attempt, and image-digest is the digest that shipped.
      # All three are display-only. The action leaves out any value Flightdeck
      # would refuse, so none of them can cost the event.
      - name: Record release event in Flightdeck
        continue-on-error: true
        uses: ./cru-github-actions/actions/flightdeck-release-event
        with:
          token: ${{ secrets.flightdeck-token }}
          endpoint: ${{ inputs.flightdeck-url }}
          project: ${{ needs.lookup.outputs.flightdeck-project }}
          app: ${{ inputs.project-name }}
          environment: production
          kind: deploy
          release-tag: ${{ steps.release.outputs.release }}
          image-tags: ${{ steps.resolve.outputs.tags }}
          rollback-safety: ${{ steps.rollback-safety.outputs.verdict }}
          rollback-safety-reasons: ${{ steps.rollback-safety.outputs.reasons }}
          actor: ${{ github.triggering_actor }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          image-digest: ${{ steps.resolve.outputs.digest }}

      - run: echo "::notice title=Promoted::$PROJECT_NAME promoted $CANDIDATE -> $RELEASE in production"
        env:
          CANDIDATE: ${{ steps.release.outputs.candidate }}
          RELEASE: ${{ steps.release.outputs.release }}

      # Notify Slack (success only; NEVER fails the deploy -- telemetry policy).
      # Destination = the app's production SlackChannel from app-info (channel
      # #name/C… or user U…); no-ops silently when the channel OR the bot token
      # is unset. The word "production" links to the app's production AppUrl
      # (also from app-info) when it has one, and is plain text when it doesn't.
      # The closing line is a changelog link: `from` = the sha production ran
      # before this promote (the same baseline the rollback-safety classifier
      # diffs against), `to` = the new release tag. Both changelog pages resolve
      # release names, so a tag is as good as a sha. With no baseline yet (first
      # promote) or a failed ledger query the line is omitted, so it is never a
      # dead link.
      #
      # Which page: Flightdeck's changelog page for the app's project when
      # the FLIGHTDECK_WORKSPACE variable is a plain slug, app-info's
      # FlightdeckProject is a Flightdeck identifier (a capital letter, then up
      # to nine capitals or digits), and the app's repository is
      # CruGlobal/<project-name> (Flightdeck's changelog reads the repository
      # named after the project, so an app-info Repository override keeps the
      # old link). Every value in that link is URL-encoded. Anything else keeps
      # the deploys.cru.org link exactly as it was.
      - name: Notify Slack
        continue-on-error: true
        env:
          SLACK_CHANNEL: ${{ needs.lookup.outputs.slack-channel }}
          SLACK_BOT_TOKEN: ${{ secrets.slack-bot-token }}
          APP_URL: ${{ needs.lookup.outputs.app-url }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE: ${{ steps.release.outputs.release }}
          PREV_SHA: ${{ steps.baseline.outputs.prev-sha }}
          VERDICT: ${{ steps.rollback-safety.outputs.verdict }}
          REASONS: ${{ steps.rollback-safety.outputs.reasons }}
          FLIGHTDECK_URL: ${{ inputs.flightdeck-url }}
          FLIGHTDECK_WORKSPACE: ${{ vars.FLIGHTDECK_WORKSPACE }}
          FLIGHTDECK_PROJECT: ${{ needs.lookup.outputs.flightdeck-project }}
          APP_REPO: ${{ needs.lookup.outputs.repository }}
        run: |
          if [ -z "$SLACK_CHANNEL" ] || [ -z "$SLACK_BOT_TOKEN" ]; then
            exit 0
          fi
          # Rollback-safety advisory line appended to the promote message.
          case "$VERDICT" in
            # A `safe` verdict ALWAYS carries a reason ("no database migrations"
            # declaration, "N additive migration(s)", or "no migration changes
            # in this release") — the fallback here only covers a jq failure.
            safe) safety=":shield: rollback-safe ($(echo "${REASONS:-[]}" | jq -r 'if length > 0 then .[0] else "classified safe" end' 2>/dev/null || echo "classified safe"))" ;;
            unsafe) safety=":warning: NOT rollback-safe: $(echo "$REASONS" | jq -r '.[0:2] | join("; ")' 2>/dev/null || echo "see run logs")" ;;
            *) safety="rollback safety: unclassified" ;;
          esac
          payload=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg project "$PROJECT_NAME" \
            --arg release "$RELEASE" \
            --arg actor "$ACTOR" \
            --arg triggering "$TRIGGERING_ACTOR" \
            --arg appurl "$APP_URL" \
            --arg prevsha "$PREV_SHA" \
            --arg safety "$safety" \
            --arg fdurl "$FLIGHTDECK_URL" \
            --arg workspace "$FLIGHTDECK_WORKSPACE" \
            --arg fdproject "$FLIGHTDECK_PROJECT" \
            --arg repository "$APP_REPO" \
            'def changelog($from; $to):
               ($fdurl | sub("/+\\z"; "")) as $base
               | if ($fdproject | test("\\A[A-Z][A-Z0-9]{0,9}\\z"))
                    and ($workspace | test("\\A[a-z0-9][a-z0-9-]*\\z"))
                    and ($base | test("\\Ahttps://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~-]+)*\\z"))
                    and ($repository == "" or ($repository | ascii_downcase) == (("CruGlobal/" + $project) | ascii_downcase))
                 then $base + "/" + ($workspace | @uri) + "/projects/" + ($fdproject | @uri)
                      + "/changelog?from=" + ($from | @uri) + "&to=" + ($to | @uri) + "&app=" + ($project | @uri)
                 else "https://deploys.cru.org/changelog?project=" + $project + "&from=" + $from + "&to=" + $to
                 end;
             {channel: $channel,
              text: (":white_check_mark: *\($project) promoted `\($release)` to \(if $appurl != "" then "<" + $appurl + "|production>" else "production" end)* by \($actor)" + (if $triggering != "" and $triggering != $actor then " (re-run by \($triggering))" else "" end)
                     + "\n\($safety)"
                     + (if $prevsha != ""
                        then "\n<" + changelog($prevsha; $release) + "|what'\''s in this release>"
                        else "" end))}')
          response=$(curl -fsS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload") || { echo "::warning title=Slack notify failed::post failed (non-blocking)"; exit 0; }
          echo "$response" | jq -e '.ok' >/dev/null || { echo "::warning title=Slack notify failed::$(echo "$response" | jq -r '.error // "post failed"') (non-blocking)"; }

      # Notify Slack (failure) -- the mirror of the success notify above: same
      # production SlackChannel destination, same "channel OR token unset ⇒
      # silent no-op", same continue-on-error (a notification must NEVER change
      # a run's outcome, in either direction). Deliberately plain: no AppUrl
      # link (a failed promote means production did NOT change) and no changelog
      # link -- the run URL is the reader's next step, so it is the whole second
      # line. A promote can fail BEFORE the release name is derived (e.g. at
      # image resolution), in which case steps.release.outputs.release is empty
      # and the message names "the release-candidate image" instead: the only
      # step output referenced, and it degrades rather than breaks.
      #
      # A refusal by one of the guards above is not a failure of the deploy:
      # nothing in production changed. The guard sets PROMOTE_REFUSED to its
      # reason word, and the message then says "refused" with that word, so
      # nobody reading the channel goes looking for a broken production.
      - name: Notify Slack (failure)
        if: failure()
        continue-on-error: true
        env:
          SLACK_CHANNEL: ${{ needs.lookup.outputs.slack-channel }}
          SLACK_BOT_TOKEN: ${{ secrets.slack-bot-token }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE: ${{ steps.release.outputs.release || '' }}
        run: |
          if [ -z "$SLACK_CHANNEL" ] || [ -z "$SLACK_BOT_TOKEN" ]; then
            exit 0
          fi
          payload=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg project "$PROJECT_NAME" \
            --arg release "$RELEASE" \
            --arg actor "$ACTOR" \
            --arg triggering "$TRIGGERING_ACTOR" \
            --arg refused "${PROMOTE_REFUSED:-}" \
            --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '(if $release != "" then "`" + $release + "`" else "the release-candidate image" end) as $what
             | (if $triggering != "" and $triggering != $actor then " (re-run by \($triggering))" else "" end) as $rerun
             | {channel: $channel,
                text: ((if $refused != ""
                        then ":no_entry: *\($project) promote \($what) to production refused* (`\($refused)`) by \($actor)\($rerun); production was not changed"
                        else ":x: *\($project) promote \($what) to production FAILED* by \($actor)\($rerun)" end)
                       + "\n\($runurl)")}')
          response=$(curl -fsS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload") || { echo "::warning title=Slack notify failed::post failed (non-blocking)"; exit 0; }
          echo "$response" | jq -e '.ok' >/dev/null || { echo "::warning title=Slack notify failed::$(echo "$response" | jq -r '.error // "post failed"') (non-blocking)"; }

  promote-aws:
    name: Promote release-candidate to production (AWS)
    needs: lookup
    if: needs.lookup.outputs.provider == 'aws'
    runs-on: ubuntu-latest
    # A backstop for anything the deploy path does not model: without it a job
    # inherits GitHub's six-hour default, and a Cloud Run call that hangs holds
    # a runner for the rest of the morning. Well clear of a real deploy.
    timeout-minutes: 60
    # Shared production lock with rollback (same group as promote-gcp).
    concurrency:
      group: production-${{ inputs.project-name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_NAME: ${{ inputs.project-name }}
      DD_API_KEY: ${{ secrets.datadog-api-key }}
    steps:
      - name: Checkout Cru Actions & Workflows
        uses: actions/checkout@v7
        with:
          repository: CruGlobal/.github
          ref: ${{ inputs.workflow-ref }}
          path: cru-github-actions

      # --- Authz for this attempt (inside the production lock) --------------
      # FIRST real step on purpose; same reasoning as in promote-gcp.
      - name: Authorize the account that started this attempt
        uses: ./cru-github-actions/actions/authorize-actor
        with:
          github-token: ${{ secrets.authz-token }}
          repository: ${{ needs.lookup.outputs.repository }}
          operation: promote
          trusted-automation-actor-ids: ${{ inputs.trusted-automation-actor-ids }}
          refusal-title: actor_not_allowed

      # --- Stale-promote guard (inside the production lock) -----------------
      # Same check as in promote-gcp; see the comment there.
      - name: Refuse a stale promote
        env:
          EXPECTED_CURRENT_RELEASE: ${{ inputs.expected-current-release }}
        run: |
          if [ -z "$EXPECTED_CURRENT_RELEASE" ]; then
            echo "expected-current-release is not set, so this promote does not check what production is running first"
            exit 0
          fi
          # One line, always: an input can hold a line break, and what follows
          # one must not read as a workflow command of its own.
          refuse() {
            local message="${1//[$'\r\n']/ }"
            echo "PROMOTE_REFUSED=production_moved" >> "$GITHUB_ENV"
            echo "::error title=production_moved::$message"
            exit 1
          }

          # Same rules as rollback's guard: the release- prefix is optional and
          # surrounding whitespace is trimmed. Prints the tag without its
          # prefix, or fails if it is not a release tag.
          normalize() {
            local value="$1"
            if [[ "$value" =~ ^[[:space:]]*([^[:space:]].*[^[:space:]]|[^[:space:]])[[:space:]]*$ ]]; then
              value="${BASH_REMATCH[1]}"
            fi
            value="${value#release-}"
            [[ "$value" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2}-)?[0-9]+$ ]] && printf '%s' "$value"
          }
          if ! expected=$(normalize "$EXPECTED_CURRENT_RELEASE"); then
            refuse "invalid expected-current-release '$EXPECTED_CURRENT_RELEASE'; expected 'release-[<yyyy-mm-dd>-]<n>' (the release- prefix is optional). Refusing to promote"
          fi

          # Fail closed from here on: without a trustworthy answer to "what is
          # production running", refuse rather than guess.
          unconfirmed="cannot confirm production is still running release-$expected; refusing to promote. Nothing in production was changed"
          if ! body=$(curl -fsS --max-time 20 --retry 2 --retry-delay 3 \
              "https://deploys.cru.org/deployments?project=$PROJECT_NAME&environment=production&limit=1"); then
            refuse "could not read the deployment ledger for $PROJECT_NAME, so $unconfirmed"
          fi
          if ! count=$(printf '%s' "$body" | jq -er '.Items | if type == "array" then length else error("no Items array") end' 2>/dev/null); then
            refuse "the deployment ledger for $PROJECT_NAME returned an unexpected response (not JSON with an Items array), so $unconfirmed"
          fi
          if [ "$count" -eq 0 ]; then
            refuse "the deployment ledger has no production rows for $PROJECT_NAME, so $unconfirmed"
          fi
          current=$(printf '%s' "$body" | jq -r '.Items[0].Revision | if type == "string" then . else "" end' 2>/dev/null) || current=""
          if [ -z "$current" ]; then
            refuse "the newest production row in the deployment ledger for $PROJECT_NAME has no Revision, so $unconfirmed"
          fi

          if [ "${current#release-}" != "$expected" ]; then
            if [[ "$expected" =~ ^[0-9]+$ ]] && [[ "$current" == *"-$expected" ]]; then
              refuse "expected-current-release '$EXPECTED_CURRENT_RELEASE' is a bare build number, but production's release tag is dated ($current); pass the full tag. Refusing to promote"
            fi
            refuse "production is now running $current, not release-$expected, so this promote was asked for against a release that is no longer live; refusing to promote. Nothing in production was changed. Start a new promote if the candidate should still ship"
          fi
          echo "::notice::production is still running $current, as expected; going ahead with the promote"

      - name: Guard supported AWS type
        env:
          TYPE: ${{ needs.lookup.outputs.type }}
        run: |
          case "$TYPE" in
            ecs|lambda) ;;
            *) echo "::error::v2 AWS deploys support types 'ecs' and 'lambda' (got '$TYPE'); serverless lands in a later pass."; exit 1 ;;
          esac

      # One deploy role per type (GitHubDeployECS / GitHubDeployLambda) covers the
      # rc + prod clusters/functions, which share the cruds account (056154071827)
      # — no per-env re-auth needed. The chosen role also holds ecr:PutImage for
      # the release-<n> tag-image step below.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::056154071827:role/${{ needs.lookup.outputs.type == 'lambda' && 'GitHubDeployLambda' || 'GitHubDeployECS' }}

      # --- Stage-less candidate resolution (RcMode "verify" only) -----------
      # A stage-less app has no running release-candidate service, so "what is
      # the candidate?" cannot be asked of an environment. It is asked of the
      # LEDGER instead: deploy-candidate's verification run writes the SAME
      # Action "deploy" / Environment "release-candidate" row a stage deploy
      # writes (plus an RcMode "verify" marker), so the ledger's
      # release-candidate head IS this app's candidate. See CruGlobal/.github#441.
      #
      # Newest-first, and specifically the newest row CARRYING A DIGEST — the
      # same defensive select the rollback-safety advisory uses to skip rows
      # without its flag, so a digest-less event can never resolve into an empty
      # tag and silently promote the wrong thing.
      #
      # LOAD-BEARING, unlike every other deploys.cru.org read in this file: this
      # one decides what reaches production, so it FAILS the promote instead of
      # degrading to a warning. Fail-closed is the right direction — cru-app-info
      # being unreachable is itself a reason not to be promoting right now. (A
      # direct dynamodb:Query would not depend on the API at all, matching the
      # app-info reads above, but the deploy roles hold only PutItem on the
      # ledger; worth revisiting together if this read proves flaky.)
      - name: Resolve candidate from ledger (stage-less)
        id: ledger-candidate
        if: needs.lookup.outputs.rc-mode == 'verify'
        run: |
          items=$(curl -fsS "https://deploys.cru.org/deployments?project=$PROJECT_NAME&environment=release-candidate&limit=10" | jq -c '.Items // []') || {
            echo "::error::could not read the deployment ledger (deploys.cru.org) for $PROJECT_NAME; the app is stage-less, so the ledger is the only record of its release candidate."
            exit 1
          }
          head=$(echo "$items" | jq -c 'map(select(.Digest != null)) | .[0] // empty')
          if [ -z "$head" ]; then
            echo "::error::no release-candidate ledger row with a digest for $PROJECT_NAME; verify a candidate via deploy-candidate (stage-less verify mode) before promoting."
            exit 1
          fi
          revision=$(echo "$head" | jq -r '.Revision // empty')
          digest=$(echo "$head" | jq -r '.Digest // empty')
          if [ -z "$revision" ]; then
            echo "::error::$PROJECT_NAME's release-candidate ledger head (digest $digest) carries no Revision, so there is no candidate tag to resolve."
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice title=Stage-less candidate::$PROJECT_NAME's verified release candidate is $revision ($digest), per the deployment ledger."

      # One resolve step, two modes — so that everything below it is
      # mode-agnostic. A normal app resolves the image RUNNING in
      # release-candidate; a stage-less app resolves the candidate TAG the
      # ledger just named. Both are the same registry round trip and yield the
      # same `image` / `digest` / `tags` outputs, which is what lets the release
      # derivation, the rollback-safety baseline, the deploy, the release tag
      # and the ledger write all stay untouched. For a non-verify app these
      # expressions evaluate to exactly the previous inputs (mode environment,
      # environment release-candidate, no tag).
      #
      # Each condition is written so the NON-EMPTY value sits on its truthy
      # side. `a && '' || b` does not mean "empty when a": the empty string is
      # falsy, so `||` takes over and yields b. Hence the inverted test on
      # `environment` rather than a matching one.
      #
      # In environment mode an ECS app resolves what release-candidate is
      # SERVING (each service's completed PRIMARY deployment). When there is no
      # single serving image (a rollout in progress or failed, services on
      # different images, or a service still on the scratch placeholder beside
      # ones that serve the app image) this step fails and the promote stops
      # here.
      - name: Resolve release-candidate image
        uses: ./cru-github-actions/actions/resolve-image
        id: resolve
        with:
          type: ${{ needs.lookup.outputs.type }}
          project-name: ${{ inputs.project-name }}
          mode: ${{ needs.lookup.outputs.rc-mode == 'verify' && 'tag' || 'environment' }}
          environment: ${{ needs.lookup.outputs.rc-mode != 'verify' && 'release-candidate' || '' }}
          tag: ${{ needs.lookup.outputs.rc-mode == 'verify' && steps.ledger-candidate.outputs.revision || '' }}

      # The bytes that passed the gate must be the bytes that promote. In
      # environment mode the running service is itself the proof of which digest
      # was gated. In tag mode the tag is a mutable pointer, so re-resolving it
      # could in principle land on a digest that was never verified (a rebuilt
      # candidate reusing the tag). Compare against the digest the ledger
      # recorded AT VERIFICATION TIME and refuse if they have diverged.
      - name: Confirm candidate digest is unchanged (stage-less)
        if: needs.lookup.outputs.rc-mode == 'verify'
        env:
          LEDGER_DIGEST: ${{ steps.ledger-candidate.outputs.digest }}
          RESOLVED_DIGEST: ${{ steps.resolve.outputs.digest }}
          REVISION: ${{ steps.ledger-candidate.outputs.revision }}
        run: |
          # A refusal before anything in production changes, so it carries the
          # same reason word and failure notice as the moved-candidate guard.
          if [ "$LEDGER_DIGEST" != "$RESOLVED_DIGEST" ]; then
            echo "PROMOTE_REFUSED=candidate_moved" >> "$GITHUB_ENV"
            echo "::error title=candidate_moved::Candidate digest moved: $PROJECT_NAME's tag $REVISION now resolves to $RESOLVED_DIGEST, but the verified candidate recorded in the ledger was $LEDGER_DIGEST. The tag has been re-pointed since verification; re-verify via deploy-candidate before promoting."
            exit 1
          fi
          echo "::notice title=Candidate digest confirmed::$REVISION still resolves to the verified digest $LEDGER_DIGEST."

      - name: Determine release number from candidate
        id: release
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          candidate=$(echo "$TAGS" | tr ',' '\n' | grep -E '^candidate-([0-9]{4}-[0-9]{2}-[0-9]{2}-)?[0-9]+$' | head -n1 || true)
          if [ -z "$candidate" ]; then
            echo "::error::the running release-candidate image (digest $DIGEST) has no candidate tag; cannot derive a release name. Deploy a candidate via deploy-candidate first."
            exit 1
          fi
          suffix="${candidate#candidate-}"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "release=release-$suffix" >> "$GITHUB_OUTPUT"

      # --- Moved-candidate guard (inside the production lock) ---------------
      # Same check as in promote-gcp; see the comment there.
      - name: Refuse a moved candidate
        env:
          EXPECTED_CANDIDATE: ${{ inputs.expected-candidate }}
          CANDIDATE: ${{ steps.release.outputs.candidate }}
          RELEASE: ${{ steps.release.outputs.release }}
          TAGS: ${{ steps.resolve.outputs.tags }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          if [ -z "$EXPECTED_CANDIDATE" ]; then
            echo "expected-candidate is not set, so this promote does not check which candidate it ships"
            exit 0
          fi
          # One line, always: an input can hold a line break, and what follows
          # one must not read as a workflow command of its own.
          refuse() {
            local message="${1//[$'\r\n']/ }"
            echo "PROMOTE_REFUSED=candidate_moved" >> "$GITHUB_ENV"
            echo "::error title=candidate_moved::$message"
            exit 1
          }

          # The candidate- prefix is optional and surrounding whitespace is
          # trimmed, the same rules the release guards use for release-.
          value="$EXPECTED_CANDIDATE"
          if [[ "$value" =~ ^[[:space:]]*([^[:space:]].*[^[:space:]]|[^[:space:]])[[:space:]]*$ ]]; then
            value="${BASH_REMATCH[1]}"
          fi
          value="${value#candidate-}"
          if [[ ! "$value" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2}-)?[0-9]+$ ]]; then
            refuse "invalid expected-candidate '$EXPECTED_CANDIDATE'; expected 'candidate-[<yyyy-mm-dd>-]<n>' (the candidate- prefix is optional). Refusing to promote"
          fi
          expected="candidate-$value"

          if [ -z "$CANDIDATE" ]; then
            refuse "could not tell which candidate this promote would ship (digest $DIGEST), so it cannot be confirmed as $expected; refusing to promote. Nothing in production was changed"
          fi
          if [ "$CANDIDATE" = "$expected" ]; then
            echo "::notice::this promote ships $expected (digest $DIGEST), as expected"
            exit 0
          fi
          if [[ "$value" =~ ^[0-9]+$ ]] && [[ "$CANDIDATE" == *"-$value" ]]; then
            refuse "expected-candidate '$EXPECTED_CANDIDATE' is a bare build number, but the candidate tag is dated ($CANDIDATE); pass the full tag. Refusing to promote"
          fi
          if printf '%s\n' "$TAGS" | tr ',' '\n' | grep -qxF -- "$expected"; then
            refuse "the release-candidate digest $DIGEST carries $expected but also $CANDIDATE, and this promote would name the release $RELEASE after $CANDIDATE, not $expected; refusing to promote. Nothing in production was changed"
          fi
          refuse "the release candidate is now $CANDIDATE (digest $DIGEST), not $expected, so it is not the candidate this promote was asked for; refusing to promote. Nothing in production was changed. Start a new promote to ship $CANDIDATE"

      # --- Rollback-safety classification (advisory unless required) --------
      # The git sha currently in production, from the deployments ledger -- the
      # baseline the candidate's migrations are diffed against. Empty on ANY
      # failure (|| true), which the classifier treats as `unclassified` (e.g.
      # the very first promote, before any production baseline exists).
      - name: Fetch production baseline
        id: baseline
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
        run: |
          prev_sha=$(curl -fsS "https://deploys.cru.org/deployments?project=$PROJECT_NAME&environment=production&limit=1" | jq -r '.Items[0].Sha // empty') || true
          echo "prev-sha=$prev_sha" >> "$GITHUB_OUTPUT"
          # The candidate's git sha is the sha-<gitsha> tag on the resolved
          # digest (the head of the classification diff). Empty -> unclassified.
          head_sha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"

      # Classify the migrations added between the production baseline and the
      # candidate as additive (EXPAND, rollback-safe) or destructive (CONTRACT).
      # An app whose app-info declares `Migrations = "none"` is rollback-safe
      # without any diff at all -- that declaration is the only thing that
      # distinguishes "has no migrations" from "has migrations we can't see".
      # The action NEVER fails; continue-on-error is a belt on top of that.
      - name: Classify rollback safety
        id: rollback-safety
        continue-on-error: true
        uses: ./cru-github-actions/actions/classify-rollback-safety
        with:
          github-token: ${{ secrets.authz-token }}
          repository: ${{ needs.lookup.outputs.repository }}
          base-sha: ${{ steps.baseline.outputs.prev-sha }}
          head-sha: ${{ steps.baseline.outputs.head-sha }}
          migrations-path: ${{ needs.lookup.outputs.migrations-path }}
          migrations: ${{ needs.lookup.outputs.migrations }}

      # --- Rollback-safety requirement --------------------------------------
      # Same check as in promote-gcp; see the comment there.
      - name: Refuse a promote that is not rollback-safe
        env:
          REQUIRE_ROLLBACK_SAFE: ${{ inputs.require-rollback-safe }}
          VERDICT: ${{ steps.rollback-safety.outputs.verdict }}
          REASONS: ${{ steps.rollback-safety.outputs.reasons }}
        run: |
          # The verdict is one of three words, but it is printed below, so it
          # is kept to one line whatever it holds.
          VERDICT="${VERDICT//[$'\r\n']/ }"
          if [ "$REQUIRE_ROLLBACK_SAFE" != "true" ]; then
            echo "require-rollback-safe is not set, so the rollback-safety verdict (${VERDICT:-none}) is advisory"
            exit 0
          fi
          # The first two reasons, on one line, for the messages below. A
          # reason can quote a file name, so any line break in it becomes a
          # space: the error must stay one line, or the rest of a reason could
          # read as a workflow command of its own.
          reasons=$(printf '%s' "${REASONS:-[]}" | jq -j 'if type == "array" then .[0:2] | map(tostring) | join("; ") else empty end' 2>/dev/null | tr '\r\n' '  ') || reasons=""
          if [ "$VERDICT" = "safe" ]; then
            echo "::notice::the rollback-safety verdict is safe${reasons:+ ($reasons)}; going ahead with the promote"
            exit 0
          fi
          echo "PROMOTE_REFUSED=not_rollback_safe" >> "$GITHUB_ENV"
          case "$VERDICT" in
            unsafe) why="the rollback-safety verdict for this promote is unsafe${reasons:+ ($reasons)}" ;;
            unclassified) why="the rollback-safety verdict for this promote is unclassified${reasons:+ ($reasons)}, and require-rollback-safe counts that as not safe" ;;
            "") why="the rollback-safety check gave no verdict (see the Classify rollback safety step)" ;;
            *) why="the rollback-safety check gave an unknown verdict '$VERDICT'" ;;
          esac
          echo "::error title=not_rollback_safe::$why; require-rollback-safe is set, so the promote is refused before anything in production changes. Nothing in production was changed. A person can promote it without require-rollback-safe after checking that the release now in production still works with the new schema"
          exit 1

      - name: Record deploy start
        run: echo "DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Deploy to production
        uses: ./cru-github-actions/actions/deploy
        with:
          type: ${{ needs.lookup.outputs.type }}
          project-name: ${{ inputs.project-name }}
          environment: production
          image: ${{ steps.resolve.outputs.image }}
          app-url: ${{ needs.lookup.outputs.app-url }}

      # Tag the promoted digest release-<n> in ECR (manifest re-tag; the ECR path
      # is shared by ecs and lambda). Requires ecr:PutImage on the deploy role
      # (GitHubDeployECS / GitHubDeployLambda) — see the tag-image comment / docs.
      - name: Tag digest as release
        uses: ./cru-github-actions/actions/tag-image
        with:
          type: ${{ needs.lookup.outputs.type }}
          project-name: ${{ inputs.project-name }}
          digest: ${{ steps.resolve.outputs.digest }}
          tag: ${{ steps.release.outputs.release }}

      # Publish a GitHub Release on the APP repo, so each app's own Releases page
      # is the human-readable record of what reached production and when: git tag
      # = the release name, pointing at the promoted commit (the `sha-<gitsha>`
      # tag the candidate digest carries — the same sha the rollback-safety
      # classifier diffs), title = the release name, marked latest.
      #
      # The body is deliberately a short header — digest, promoted-by, run link,
      # changelog link for the range. It does NOT restate the commit list: the
      # changelog page is the canonical rendering of "what's in this release"
      # (it resolves release names through to shas), and a second copy here
      # would only drift from it. Same dead-link rule as
      # the Slack notify — with no baseline sha (first promote, or a failed ledger
      # query) the changelog line is omitted rather than emitted broken.
      #
      # The changelog link is the one the Slack notify builds, with the same
      # rule: Flightdeck's changelog page when the FLIGHTDECK_WORKSPACE variable
      # is set, the FlightdeckProject is a valid identifier and the app has no
      # Repository override, otherwise the deploys.cru.org link, unchanged.
      #
      # Credential: the existing `authz-token`. It is already this workflow's
      # app-repo credential — the authz gate reads collaborator permission with
      # it and the rollback-safety classifier fetches the app repo's compare with
      # it — so a release write adds no new credential *surface*, only a new verb.
      # The run-scoped GITHUB_TOKEN cannot substitute: it is scoped to the calling
      # cru-deploy repo, not the app repo. The narrower long-term home is the
      # org-wide "Cru Deploy" GitHub App, which needs two things it does not have
      # yet: Contents bumped read -> write, and its key made reachable from
      # cru-deploy workflows (today it lives only in SSM /ecs/cru-app-info/*).
      #
      # NEVER fails the promote. Production is already updated by the time this
      # runs, so a missing Releases entry is a bookkeeping loss, not an incident:
      # continue-on-error, plus in-step handling that turns any non-2xx into a
      # warning naming the likely fix. A re-run of an already-promoted candidate
      # re-POSTs the same release name and gets 422 already_exists — that is the
      # correct end state, so it degrades to a notice instead of a warning.
      - name: Publish GitHub Release on the app repo
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.authz-token }}
          APP_REPO: ${{ needs.lookup.outputs.repository }}
          RELEASE: ${{ steps.release.outputs.release }}
          COMMIT_SHA: ${{ steps.baseline.outputs.head-sha }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          PREV_SHA: ${{ steps.baseline.outputs.prev-sha }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          FLIGHTDECK_URL: ${{ inputs.flightdeck-url }}
          FLIGHTDECK_WORKSPACE: ${{ vars.FLIGHTDECK_WORKSPACE }}
          FLIGHTDECK_PROJECT: ${{ needs.lookup.outputs.flightdeck-project }}
        run: |
          if [ -z "$COMMIT_SHA" ]; then
            echo "::warning title=GitHub Release skipped::the promoted digest carries no sha- tag, so there is no commit for $RELEASE to point at on $APP_REPO (non-blocking)"
            exit 0
          fi
          # make_latest is a string enum ("true"/"false"/"legacy"), not a boolean.
          payload=$(jq -n \
            --arg tag "$RELEASE" \
            --arg target "$COMMIT_SHA" \
            --arg digest "$DIGEST" \
            --arg actor "$ACTOR" \
            --arg triggering "$TRIGGERING_ACTOR" \
            --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg project "$PROJECT_NAME" \
            --arg prevsha "$PREV_SHA" \
            --arg fdurl "$FLIGHTDECK_URL" \
            --arg workspace "$FLIGHTDECK_WORKSPACE" \
            --arg fdproject "$FLIGHTDECK_PROJECT" \
            --arg repository "$APP_REPO" \
            'def changelog($from; $to):
               ($fdurl | sub("/+\\z"; "")) as $base
               | if ($fdproject | test("\\A[A-Z][A-Z0-9]{0,9}\\z"))
                    and ($workspace | test("\\A[a-z0-9][a-z0-9-]*\\z"))
                    and ($base | test("\\Ahttps://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~-]+)*\\z"))
                    and ($repository == "" or ($repository | ascii_downcase) == (("CruGlobal/" + $project) | ascii_downcase))
                 then $base + "/" + ($workspace | @uri) + "/projects/" + ($fdproject | @uri)
                      + "/changelog?from=" + ($from | @uri) + "&to=" + ($to | @uri) + "&app=" + ($project | @uri)
                 else "https://deploys.cru.org/changelog?project=" + $project + "&from=" + $from + "&to=" + $to
                 end;
             {tag_name: $tag, target_commitish: $target, name: $tag,
              draft: false, prerelease: false, make_latest: "true",
              body: ("Promoted to production by @\($actor)"
                     + (if $triggering != "" and $triggering != $actor then " (re-run by @\($triggering))" else "" end)
                     + ".\n\n"
                     + "- Image digest: `\($digest)`\n"
                     + "- Promote run: \($runurl)\n"
                     + (if $prevsha != ""
                        then "- [Changes in this release](" + changelog($prevsha; $tag) + ")\n"
                        else "" end))}')
          # gh api puts the JSON body on stdout (success AND error) and its human
          # summary on stderr, so capture stdout only: stderr stays in the run log
          # where an operator wants it, and nothing can corrupt the JSON parse.
          if response=$(printf '%s' "$payload" | gh api -X POST "repos/$APP_REPO/releases" --input -); then
            echo "::notice title=Release published::$(echo "$response" | jq -r '.html_url // empty')"
          else
            case "$response" in
              *already_exists*)
                echo "::notice title=Release already published::$RELEASE already exists on $APP_REPO; left as-is"
                ;;
              *)
                echo "::warning title=GitHub Release failed::could not publish $RELEASE on $APP_REPO (non-blocking). A 403/404 here means authz-token lacks contents:write on the app repo — see this step's credential note."
                ;;
            esac
          fi

      - name: Record deployment event in Datadog
        continue-on-error: true
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE: ${{ steps.release.outputs.release }}
          CANDIDATE: ${{ steps.release.outputs.candidate }}
        run: |
          # sha-<gitsha> tag on the resolved digest -> sha:<gitsha> event tag, so
          # events are joinable to commits (deployments-ledger precursor). Omitted
          # cleanly when the digest carries no sha- tag.
          gitsha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          # Name who pressed re-run when it is not the account that started
          # the run.
          rerun=""
          if [ -n "$TRIGGERING_ACTOR" ] && [ "$TRIGGERING_ACTOR" != "$ACTOR" ]; then
            rerun="$TRIGGERING_ACTOR"
          fi
          jq -n \
            --arg title "Promoted: $PROJECT_NAME $CANDIDATE -> $RELEASE" \
            --arg text "Pipeline v2 production promotion by ${ACTOR}${rerun:+ (re-run by $rerun)} (started $DEPLOY_STARTED_AT)" \
            --arg service "$PROJECT_NAME" \
            --arg actor "$ACTOR" \
            --arg gitsha "$gitsha" \
            --arg rerun "$rerun" \
            --arg release "$RELEASE" \
            --arg candidate "$CANDIDATE" \
            '{title: $title, text: $text, alert_type: "info",
              aggregation_key: ("deploy:" + $service + ":production"),
              tags: (["source:cru-pipeline-v2", ("service:" + $service),
                     "environment:production", "action:promote",
                     ("revision:" + $release), ("candidate:" + $candidate),
                     ("actor:" + $actor)]
                     + (if $gitsha != "" then ["sha:" + $gitsha] else [] end)
                     + (if $rerun != "" then ["rerun_by:" + $rerun] else [] end))}' \
          | curl -fsS --retry 3 -X POST "https://api.datadoghq.com/api/v1/events" \
              -H "Content-Type: application/json" -H "DD-API-KEY: $DD_API_KEY" -d @- \
            || echo "::warning title=Datadog telemetry failed::promotion event for $PROJECT_NAME $RELEASE not recorded (non-blocking)"

      # Append the event to the CruDeploymentLedger DynamoDB table (app-info's
      # deployments ledger -- the fleet dashboard / DORA data spine). Same
      # policy as all telemetry: NEVER fails the deploy.
      #
      # Actor is github.actor, the account that started the run's first
      # attempt. TriggeringActor is github.triggering_actor, the account that
      # started THIS attempt, which is the one the Flightdeck release event
      # names. Both go on every row, and they differ only when another account
      # re-ran the run.
      - name: Record deployment in ledger
        continue-on-error: true
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REVISION: ${{ steps.release.outputs.release }}
          TYPE: ${{ needs.lookup.outputs.type }}
          VERDICT: ${{ steps.rollback-safety.outputs.verdict }}
          ROLLBACK_REASONS: ${{ steps.rollback-safety.outputs.reasons }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          gitsha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          # Rollback-safety verdict -> RollbackSafe true/false (omitted when unclassified).
          rollback_safe=""
          case "$VERDICT" in safe) rollback_safe=true ;; unsafe) rollback_safe=false ;; esac
          aws dynamodb put-item --region us-east-1 \
            --table-name CruDeploymentLedger \
            --item "$(jq -n \
              --arg project "$PROJECT_NAME" \
              --arg eventat "${now}#${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --arg eventdate "${now%%T*}" \
              --arg environment production \
              --arg action promote \
              --arg source cru-pipeline-v2 \
              --arg revision "$REVISION" \
              --arg digest "$DIGEST" \
              --arg sha "$gitsha" \
              --arg actor "$ACTOR" \
              --arg triggeringactor "$TRIGGERING_ACTOR" \
              --arg runid "$GITHUB_RUN_ID" \
              --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg rollbacksafe "$rollback_safe" \
              --arg rollbackreasons "$ROLLBACK_REASONS" \
              --arg provider aws \
              --arg type "$TYPE" \
              '{Project: {S: $project}, EventAt: {S: $eventat}, EventDate: {S: $eventdate},
                Environment: {S: $environment}, Action: {S: $action}, Source: {S: $source},
                Revision: {S: $revision}, Digest: {S: $digest}, Actor: {S: $actor},
                TriggeringActor: {S: $triggeringactor},
                RunId: {S: $runid}, RunUrl: {S: $runurl}, Provider: {S: $provider},
                Type: {S: $type}}
                + (if $sha != "" then {Sha: {S: $sha}} else {} end)
                + (if $rollbacksafe != "" then {RollbackSafe: {S: $rollbacksafe}} else {} end)
                + (if ($rollbacksafe != "" and $rollbackreasons != "" and $rollbackreasons != "[]") then {RollbackSafeReasons: {S: $rollbackreasons}} else {} end)')" \
            || echo "::warning title=Ledger write failed::promotion event for $PROJECT_NAME $REVISION not recorded in ledger (non-blocking)"

      # Record the release on the app's Flightdeck project timeline (GateOps
      # Phase 0). Project = app-info FlightdeckProject; credential = the CruDeploy
      # service user's PAT held by cru-deploy. Either unset => silent skip. Same
      # telemetry policy as the ledger: the action never fails, continue-on-error
      # is the belt on top.
      #
      # actor is the account that started THIS attempt (github.triggering_actor,
      # not github.actor, which stays the first attempt's account on a re-run),
      # run-url names this attempt, and image-digest is the digest that shipped.
      # All three are display-only. The action leaves out any value Flightdeck
      # would refuse, so none of them can cost the event.
      - name: Record release event in Flightdeck
        continue-on-error: true
        uses: ./cru-github-actions/actions/flightdeck-release-event
        with:
          token: ${{ secrets.flightdeck-token }}
          endpoint: ${{ inputs.flightdeck-url }}
          project: ${{ needs.lookup.outputs.flightdeck-project }}
          app: ${{ inputs.project-name }}
          environment: production
          kind: deploy
          release-tag: ${{ steps.release.outputs.release }}
          image-tags: ${{ steps.resolve.outputs.tags }}
          rollback-safety: ${{ steps.rollback-safety.outputs.verdict }}
          rollback-safety-reasons: ${{ steps.rollback-safety.outputs.reasons }}
          actor: ${{ github.triggering_actor }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          image-digest: ${{ steps.resolve.outputs.digest }}

      - run: echo "::notice title=Promoted::$PROJECT_NAME promoted $CANDIDATE -> $RELEASE in production"
        env:
          CANDIDATE: ${{ steps.release.outputs.candidate }}
          RELEASE: ${{ steps.release.outputs.release }}

      # Notify Slack (success only; NEVER fails the deploy -- telemetry policy).
      # Destination = the app's production SlackChannel from app-info (channel
      # #name/C… or user U…); no-ops silently when the channel OR the bot token
      # is unset. The word "production" links to the app's production AppUrl
      # (also from app-info) when it has one, and is plain text when it doesn't.
      # The closing line is a changelog link: `from` = the sha production ran
      # before this promote (the same baseline the rollback-safety classifier
      # diffs against), `to` = the new release tag. Both changelog pages resolve
      # release names, so a tag is as good as a sha. With no baseline yet (first
      # promote) or a failed ledger query the line is omitted, so it is never a
      # dead link.
      #
      # Which page: Flightdeck's changelog page for the app's project when
      # the FLIGHTDECK_WORKSPACE variable is a plain slug, app-info's
      # FlightdeckProject is a Flightdeck identifier (a capital letter, then up
      # to nine capitals or digits), and the app's repository is
      # CruGlobal/<project-name> (Flightdeck's changelog reads the repository
      # named after the project, so an app-info Repository override keeps the
      # old link). Every value in that link is URL-encoded. Anything else keeps
      # the deploys.cru.org link exactly as it was.
      - name: Notify Slack
        continue-on-error: true
        env:
          SLACK_CHANNEL: ${{ needs.lookup.outputs.slack-channel }}
          SLACK_BOT_TOKEN: ${{ secrets.slack-bot-token }}
          APP_URL: ${{ needs.lookup.outputs.app-url }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE: ${{ steps.release.outputs.release }}
          PREV_SHA: ${{ steps.baseline.outputs.prev-sha }}
          VERDICT: ${{ steps.rollback-safety.outputs.verdict }}
          REASONS: ${{ steps.rollback-safety.outputs.reasons }}
          FLIGHTDECK_URL: ${{ inputs.flightdeck-url }}
          FLIGHTDECK_WORKSPACE: ${{ vars.FLIGHTDECK_WORKSPACE }}
          FLIGHTDECK_PROJECT: ${{ needs.lookup.outputs.flightdeck-project }}
          APP_REPO: ${{ needs.lookup.outputs.repository }}
        run: |
          if [ -z "$SLACK_CHANNEL" ] || [ -z "$SLACK_BOT_TOKEN" ]; then
            exit 0
          fi
          # Rollback-safety advisory line appended to the promote message.
          case "$VERDICT" in
            # A `safe` verdict ALWAYS carries a reason ("no database migrations"
            # declaration, "N additive migration(s)", or "no migration changes
            # in this release") — the fallback here only covers a jq failure.
            safe) safety=":shield: rollback-safe ($(echo "${REASONS:-[]}" | jq -r 'if length > 0 then .[0] else "classified safe" end' 2>/dev/null || echo "classified safe"))" ;;
            unsafe) safety=":warning: NOT rollback-safe: $(echo "$REASONS" | jq -r '.[0:2] | join("; ")' 2>/dev/null || echo "see run logs")" ;;
            *) safety="rollback safety: unclassified" ;;
          esac
          payload=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg project "$PROJECT_NAME" \
            --arg release "$RELEASE" \
            --arg actor "$ACTOR" \
            --arg triggering "$TRIGGERING_ACTOR" \
            --arg appurl "$APP_URL" \
            --arg prevsha "$PREV_SHA" \
            --arg safety "$safety" \
            --arg fdurl "$FLIGHTDECK_URL" \
            --arg workspace "$FLIGHTDECK_WORKSPACE" \
            --arg fdproject "$FLIGHTDECK_PROJECT" \
            --arg repository "$APP_REPO" \
            'def changelog($from; $to):
               ($fdurl | sub("/+\\z"; "")) as $base
               | if ($fdproject | test("\\A[A-Z][A-Z0-9]{0,9}\\z"))
                    and ($workspace | test("\\A[a-z0-9][a-z0-9-]*\\z"))
                    and ($base | test("\\Ahttps://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~-]+)*\\z"))
                    and ($repository == "" or ($repository | ascii_downcase) == (("CruGlobal/" + $project) | ascii_downcase))
                 then $base + "/" + ($workspace | @uri) + "/projects/" + ($fdproject | @uri)
                      + "/changelog?from=" + ($from | @uri) + "&to=" + ($to | @uri) + "&app=" + ($project | @uri)
                 else "https://deploys.cru.org/changelog?project=" + $project + "&from=" + $from + "&to=" + $to
                 end;
             {channel: $channel,
              text: (":white_check_mark: *\($project) promoted `\($release)` to \(if $appurl != "" then "<" + $appurl + "|production>" else "production" end)* by \($actor)" + (if $triggering != "" and $triggering != $actor then " (re-run by \($triggering))" else "" end)
                     + "\n\($safety)"
                     + (if $prevsha != ""
                        then "\n<" + changelog($prevsha; $release) + "|what'\''s in this release>"
                        else "" end))}')
          response=$(curl -fsS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload") || { echo "::warning title=Slack notify failed::post failed (non-blocking)"; exit 0; }
          echo "$response" | jq -e '.ok' >/dev/null || { echo "::warning title=Slack notify failed::$(echo "$response" | jq -r '.error // "post failed"') (non-blocking)"; }

      # Notify Slack (failure) -- the mirror of the success notify above: same
      # production SlackChannel destination, same "channel OR token unset ⇒
      # silent no-op", same continue-on-error (a notification must NEVER change
      # a run's outcome, in either direction). Deliberately plain: no AppUrl
      # link (a failed promote means production did NOT change) and no changelog
      # link -- the run URL is the reader's next step, so it is the whole second
      # line. A promote can fail BEFORE the release name is derived (e.g. at
      # image resolution), in which case steps.release.outputs.release is empty
      # and the message names "the release-candidate image" instead: the only
      # step output referenced, and it degrades rather than breaks.
      #
      # A refusal by one of the guards above is not a failure of the deploy:
      # nothing in production changed. The guard sets PROMOTE_REFUSED to its
      # reason word, and the message then says "refused" with that word, so
      # nobody reading the channel goes looking for a broken production.
      - name: Notify Slack (failure)
        if: failure()
        continue-on-error: true
        env:
          SLACK_CHANNEL: ${{ needs.lookup.outputs.slack-channel }}
          SLACK_BOT_TOKEN: ${{ secrets.slack-bot-token }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE: ${{ steps.release.outputs.release || '' }}
        run: |
          if [ -z "$SLACK_CHANNEL" ] || [ -z "$SLACK_BOT_TOKEN" ]; then
            exit 0
          fi
          payload=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg project "$PROJECT_NAME" \
            --arg release "$RELEASE" \
            --arg actor "$ACTOR" \
            --arg triggering "$TRIGGERING_ACTOR" \
            --arg refused "${PROMOTE_REFUSED:-}" \
            --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '(if $release != "" then "`" + $release + "`" else "the release-candidate image" end) as $what
             | (if $triggering != "" and $triggering != $actor then " (re-run by \($triggering))" else "" end) as $rerun
             | {channel: $channel,
                text: ((if $refused != ""
                        then ":no_entry: *\($project) promote \($what) to production refused* (`\($refused)`) by \($actor)\($rerun); production was not changed"
                        else ":x: *\($project) promote \($what) to production FAILED* by \($actor)\($rerun)" end)
                       + "\n\($runurl)")}')
          response=$(curl -fsS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload") || { echo "::warning title=Slack notify failed::post failed (non-blocking)"; exit 0; }
          echo "$response" | jq -e '.ok' >/dev/null || { echo "::warning title=Slack notify failed::$(echo "$response" | jq -r '.error // "post failed"') (non-blocking)"; }
