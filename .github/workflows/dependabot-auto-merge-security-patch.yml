name: dependabot-auto-merge-security-patch

# Reusable workflow: the STRICT Dependabot auto-merge tier for
# gem-security repos. Auto-approves and enables auto-merge ONLY when a
# Dependabot PR is BOTH:
#
#   1. driven by at least one OPEN Dependabot alert on an updated
#      dependency (for grouped PRs: on ANY member of the group, since a
#      refresh can retain members whose alerts were fixed out-of-band;
#      FIXED/DISMISSED alerts do not qualify), AND
#   2. patch-level (`version-update:semver-patch` — for grouped PRs
#      this is the HIGHEST bump in the group, so a group containing a
#      minor or major never qualifies).
#
# Everything else — routine version bumps, minor/major security fixes —
# is left for human review, and the disarm step withdraws any
# previously-enabled auto-merge if a PR loses eligibility.
#
# This is deliberately stricter than dependabot-auto-merge.yml (the
# fleet default, which merges any-severity security plus patch/minor
# version bumps). Repos handling gem security updates opt into this
# variant on an allowlist basis.
#
# Allowlisted repos MUST enable "Allow auto-merge" on the repo and
# require, via ruleset on the default branch, the status checks the
# gate waits on: `lint` and `test`, plus `Validate PR Title` where the
# repo runs it. Two review postures are supported:
#
#   a. Pipeline v2 default: `required_approving_review_count: 0`. The
#      pipeline-v2 ruleset drops the review requirement so auto-merge
#      can fire; the bot approval below is informational and satisfies
#      no ruleset requirement.
#   b. Review-required repos (familylife-gift-cards today):
#      `required_approving_review_count: 1`, satisfied by the
#      github-actions[bot] approval below. This posture also requires
#      `dismiss_stale_reviews_on_push: true`, with review dismissal
#      not restricted away from github-actions[bot], because the
#      disarm step only runs on Dependabot-triggered events (the job
#      guard skips human-triggered synchronize runs): without
#      dismissal a human push to an armed Dependabot branch would keep
#      the bot approval and merge unreviewed code.
#
# Alert lookup requires more than the default GITHUB_TOKEN: this
# workflow mints a GitHub App installation token, scoped down to
# Dependabot-alerts read, and queries the repo's OPEN alerts directly
# via the REST API. The App must be installed on the calling
# repository with "Dependabot alerts: read" permission, and the App
# credentials must be available as DEPENDABOT secrets in the caller
# (Dependabot-triggered runs read the Dependabot secrets context, not
# the Actions one).
#
# Why not fetch-metadata's alert-lookup: its getAlert reads only the
# first 100 vulnerability alerts a repo has EVER had (GraphQL
# `vulnerabilityAlerts(first: 100)` — no state filter, no pagination),
# so on any repo with >100 lifetime alerts every open alert sits
# outside that window and alert-state comes back empty; the gate then
# fails closed forever and nothing ever auto-merges. Proven live on
# rails-infrastructure-canary 2026-08-07 (170 lifetime alerts, the
# first 100 all FIXED; gate run 31213835773 disarmed a 7-gem
# security-patch group whose members all had OPEN alerts).
#
# If token minting or alert lookup fails, the job FAILS (visibly red) —
# it never falls back to merging without alert evidence.
#
# Example caller (in the app repo, .github/workflows/dependabot-auto-merge.yml):
#
#   name: dependabot-auto-merge
#   on:
#     pull_request:
#       types: [opened, reopened, synchronize]
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     auto-merge:
#       uses: CruGlobal/.github/.github/workflows/dependabot-auto-merge-security-patch.yml@<release tag>
#       secrets:
#         AUTOMERGE_APP_ID: ${{ secrets.AUTOMERGE_APP_ID }}
#         AUTOMERGE_APP_PRIVATE_KEY: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

on:
  workflow_call:
    secrets:
      AUTOMERGE_APP_ID:
        description: GitHub App ID used to mint the alert-lookup token
        required: true
      AUTOMERGE_APP_PRIVATE_KEY:
        description: Private key for the alert-lookup GitHub App
        required: true

# Cap only — a called workflow cannot elevate GITHUB_TOKEN; the caller
# must grant these (see the example caller above).
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Act only on runs Dependabot itself triggered (the only runs where
    # Dependabot secrets populate), on Dependabot-authored PRs.
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token for alert lookup
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-vulnerability-alerts: read

      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # Count OPEN alerts matching the PR's updated dependencies, in
      # one server-side-filtered REST query (see the header for why
      # fetch-metadata's alert-lookup cannot be used). If the query
      # fails, the job FAILS red — never merge without alert evidence.
      - name: Count open Dependabot alerts for the updated dependencies
        id: alerts
        env:
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          package_list="${DEPENDENCY_NAMES// /}"
          open_count=$(gh api "repos/${REPO}/dependabot/alerts?state=open&package=${package_list}&per_page=100" --jq 'length')
          echo "open-count=${open_count}" >> "$GITHUB_OUTPUT"
          echo "open alerts for [${package_list}]: ${open_count}"

      # Strict conjunctive gate: an OPEN alert AND patch-level. For
      # grouped PRs, update-type reflects the highest semver bump in
      # the group, so mixed groups fail closed into the review tier.
      - name: Evaluate eligibility
        id: gate
        env:
          OPEN_ALERTS: ${{ steps.alerts.outputs.open-count }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          if [ "$OPEN_ALERTS" -gt 0 ] \
             && [ "$UPDATE_TYPE" = "version-update:semver-patch" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi
          echo "open-alerts=$OPEN_ALERTS"
          echo "update-type=$UPDATE_TYPE"

      - name: Approve PR
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gh pr review runs as github-actions[bot], a different identity
        # from dependabot[bot], so the approval satisfies any
        # "no self-approval" ruleset requirement. Skip if already
        # approved so Dependabot rebases don't stack approvals.
        run: |
          if [ "$(gh pr view "$PR_URL" --json reviewDecision --jq .reviewDecision)" != "APPROVED" ]; then
            gh pr review --approve "$PR_URL"
          fi

      - name: Enable squash auto-merge
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto "$PR_URL"

      # Auto-merge must not be a one-way ratchet: if a PR was armed on a
      # previous run and no longer qualifies, withdraw the arming and
      # the bot approval so it waits for a human.
      - name: Disarm ineligible PR
        if: ${{ steps.gate.outputs.eligible == 'false' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --disable-auto "$PR_URL" || true
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id' \
          | while read -r review_id; do
              gh api -X PUT \
                "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${review_id}/dismissals" \
                -f message="No longer a patch-level security update; auto-merge withdrawn for human review" \
                -f event="DISMISS"
            done
