name: Hotfix

# Ship one fix to production without shipping everything else the default
# branch holds.
#
# The default branch often has changes that are not released yet. A hotfix
# built from its tip would ship them all, and an unreleased migration among
# them would make the hotfix unsafe to roll back. So a hotfix ships on a branch
# cut from the release production runs now: hotfix/<release tag>. The fix
# lands on the default branch first, through a normal pull request and its
# checks, and this workflow cherry-picks that commit onto the branch:
#
#   1. Authorize the account that started this attempt, the same check
#      promote and rollback run: push access on the app repo, an allowlisted
#      automation account that started both the run and this attempt, or the
#      deploy gate's account with a signed request for this project, hotfix
#      and this commit. The check runs twice: in the authorize job, before
#      the run waits for the hotfix lock, and again in the hotfix job once it
#      has the lock (see the authorize job for why).
#   2. Read the release production runs from the deployment ledger, the way
#      promote's stale-promote guard does, and refuse unless it is
#      expected-release.
#   3. Check the fix's commit is on the default branch's first-parent history
#      (a commit the default branch itself was at) and is not a merge commit
#      (see src/v2/hotfix.js for why each of these is refused).
#   4. Cut hotfix/<release tag> from the commit the ledger records for that
#      release, or add to the branch when it already exists (an earlier fix
#      for the same release that has not been promoted yet). The commit comes
#      from the ledger, not from the release's git tag: promote's GitHub
#      Release makes that tag, but only best effort, so some releases have
#      none.
#   5. Cherry-pick the fix with -x. A conflict stops the run, and so does a
#      pick that changes a file under .github/workflows (see below); nothing
#      is pushed.
#   6. Read the ledger again, then push the branch with authz-token. A plain
#      push, never forced, and only to hotfix/<release tag>. This workflow
#      never pushes to the default branch and never deletes a branch.
#   7. Dispatch the app's .github/workflows/pipeline-v2.yml on the branch. It
#      builds a candidate with build-candidate.yml, whose hotfix check accepts
#      only the live release plus clean cherry-picks of default-branch
#      commits, and sends it to release-candidate. It is promoted from there
#      like any candidate, and its release event says hotfix.
#   8. Say in the run summary whether the app's own CI ran on the branch.
#      Most apps run CI only on pull requests and the default branch, which is
#      accepted for now: the fix passed its checks on the default branch.
#
# Every refusal is an error titled with a fixed reason word (actor_not_allowed,
# no_production, invalid_input, ledger_unavailable, production_moved,
# release_commit_unknown, not_on_default_branch, merge_commit,
# already_in_release, workflow_change, cherry_pick_conflict, branch_not_clean,
# branch_moved or no_pipeline), and every one of them happens before the
# push. ledger_unavailable means the deployment ledger could not be read: try
# again later. production_moved means it answered, and production does not
# run expected-release.
#
# Re-runs and repeats are safe. A run whose fix is already on the branch
# pushes nothing and dispatches the build again; build-candidate reuses the
# candidate already built for that commit. Two runs for one app wait for each
# other (the concurrency group below), so the second sees the first's commit
# and adds to it. GitHub keeps only one run waiting, and a newer one cancels
# the one already waiting; a cancelled run changed nothing and can be started
# again. A run the deploy gate started has used up its signed request by
# then, so starting it again takes a new request from the gate.
#
# Production can move after the push. A hotfix only ever ships on top of the
# release production runs: build-candidate refuses to build a hotfix branch
# for any other release, and promote refuses (stale_hotfix) a hotfix
# candidate that was built before production moved. Cut a new hotfix for the
# new release instead.
#
# A fix that changes a workflow file ships by hand. This workflow refuses it
# (workflow_change), because pushing it needs the workflow scope and
# authz-token does not get that scope. That includes a fix whose change the
# merge lands on a workflow file through a rename. It refuses only once it
# knows the pick applies, so the refusal gives the by-hand steps below, or
# says the pick conflicts (cherry_pick_conflict), or says a merge driver is in
# the way (see below). build-candidate does not refuse a workflow fix: it
# builds a branch a person pushed when every other rule holds, that is, the
# branch starts at the release's commit and each commit after it is a clean
# `git cherry-pick -x` of a commit on the default branch. A fix to the app's
# pipeline-v2.yml can only ship this way, because the hotfix branch builds
# with the release's own copy of that file. By hand:
#
#   1. Create hotfix/<release tag> at the commit production runs for that
#      release, or check the branch out when it already exists. The
#      workflow_change refusal names the commit. It is the one the deployment
#      ledger records for the release, not the release's git tag.
#   2. git cherry-pick -x each fix from the default branch, in the order they
#      landed there. Each pick must apply cleanly: a conflict resolved by hand
#      is not the fix's change, and build-candidate refuses it.
#   3. Push the branch with a token that has the workflow scope.
#   4. Run the app's pipeline-v2.yml on the branch, e.g.
#      gh workflow run pipeline-v2.yml --ref hotfix/<release tag>
#
# A workflow file must also merge with git's own merge. When .gitattributes
# name a merge driver for it (such as union, which keeps the lines of both
# sides of a conflict), build-candidate refuses the pick, saying the
# .gitattributes "give" the file a merge attribute and that "a workflow file
# must merge with git's own merge". This workflow's refusal says the same
# before anyone picks by hand. The way out: land a commit on the default
# branch that gives workflow files git's own merge, at the end of the
# .gitattributes file that sets the driver (the refusal names it, with a line
# written for that file: in the top-level one, a `.github/workflows/** merge`
# line), cut that commit onto the hotfix branch with this workflow, then pick
# the workflow fix on top by hand. When the driver is set in
# .github/workflows/.gitattributes, that commit changes a workflow file too,
# so it is picked by hand as well, before the fix. If the refused pick is
# already on the branch, first move the branch back to the commit that pick
# was made on: that takes a force push, and drops every pick after it, so
# those are picked again afterwards. With a driver set, this workflow also
# checks the fix against git's own merge, and refuses it as
# cherry_pick_conflict when a workflow file conflicts there, since the pick
# by hand would.
#
# The order in step 2 is advice, not a rule: build-candidate checks each pick
# on its own, so it does not notice picks out of order, a fix picked again
# after its revert, or a fix the default branch has reverted since.
#
# After that, this workflow can add later fixes that change no workflow file
# to the same branch. Its push carries only its own pick. A run for a fix that
# already has a cherry-pick on the branch pushes nothing and dispatches the
# build again, as any re-run does.

on:
  workflow_call:
    inputs:
      workflow-ref:
        type: string
        required: false
        default: main
        description: Branch, tag or commit of CruGlobal/.github to check the actions out at.
      project-name:
        type: string
        required: true
        description: Project name (shared-registry repo/image, and the deployment ledger's key).
      commit:
        type: string
        required: true
        description: >-
          The fix's commit on the app repo's default branch (7 to 40 hex
          characters). A merge commit is refused; use the pull request's
          squash commit.
      expected-release:
        type: string
        required: true
        description: >-
          The release production runs, release-[<yyyy-mm-dd>-]<n> (the
          release- prefix is optional). The run is refused unless production
          is still running it.
      trusted-automation-actor-ids:
        type: string
        required: false
        default: ''
        description: >-
          Comma-separated numeric GitHub user ids of automation accounts
          allowed to cut a hotfix without push access on the app repo. One
          passes only when it started the run and also started this attempt.
          Empty allows none.
      refused-actor-ids:
        type: string
        required: false
        default: ''
        description: >-
          Comma or newline separated numeric GitHub user ids that may never
          cut a hotfix, even with push access or on the automation allowlist,
          such as machine users whose tokens many repos can read. Only
          the deploy gate is checked before this list. An entry that is
          not a number refuses every run. Empty refuses none.
      gate-claim-url:
        type: string
        required: false
        default: ''
        description: >-
          The deploy gate's claim route (https), passed to every
          authorize-actor step. authorize-actor claims a signed request's
          one-time request id there, with the job's GitHub OIDC token,
          only on an attempt it treats as the deploy gate's. A value that
          is not an https URL refuses every run. Every job that runs
          authorize-actor already has id-token: write. Set it from a fixed
          value in the caller, never a dispatch input. Empty claims
          nothing, so the gate's attempts are refused.
      gate-claim-audience:
        type: string
        required: false
        default: ''
        description: >-
          The audience of the OIDC token sent to gate-claim-url, which the
          deploy gate requires. Needed with gate-claim-url. A fixed value
          in the caller, never a dispatch input.
      gate-actor-id:
        type: string
        required: false
        default: ''
        description: >-
          Numeric GitHub user id of the account the deploy gate starts runs
          as, passed to every authorize-actor step. An attempt that account
          started must carry a signed-request that verifies against
          gate-public-keys and whose one-time id it can claim at
          gate-claim-url, or it is refused. It may not also be in
          trusted-automation-actor-ids. A fixed value in the caller, never
          a dispatch input. Empty turns the gate check off.
      gate-public-keys:
        type: string
        required: false
        default: ''
        description: >-
          The deploy gate's PEM public keys (P-256), one after another. A
          signed request passes when any of them verifies it, so a key
          rotation can list the old key and the new one. A fixed value in
          the caller, never a dispatch input.
      gate-issuer:
        type: string
        required: false
        default: ''
        description: >-
          The iss claim a signed request must carry. A fixed value in the
          caller, never a dispatch input.
      gate-audience:
        type: string
        required: false
        default: ''
        description: >-
          The aud claim a signed request must carry. A fixed value in the
          caller, never a dispatch input.
      signed-request:
        type: string
        required: false
        default: ''
        description: >-
          The deploy gate's signed request for this run, which the gate
          sends as a dispatch input. It is used only on an attempt the
          gate-actor-id account started, and ignored on any other. It must
          name project-name, the action hotfix and, as its target, commit
          exactly as given. Empty on every run the gate did not start.
    secrets:
      authz-token:
        required: true
        description: >-
          GitHub token for the app repo. It reads the permission of the
          account that started this attempt, clones the repo, pushes the
          hotfix branch (contents: write) and dispatches the app's
          pipeline-v2.yml (actions: write). It never needs the workflow
          scope: a fix that changes a workflow file is refused before any
          push, and a person ships it by hand (see the top of this file).
    outputs:
      branch:
        description: The hotfix branch, hotfix/<release tag>.
        value: ${{ jobs.hotfix.outputs.branch }}
      head-sha:
        description: The hotfix branch's head, the commit the dispatched build builds.
        value: ${{ jobs.hotfix.outputs.head-sha }}
      pushed:
        description: true when this run pushed the branch, false when the branch already had a cherry-pick of the fix.
        value: ${{ jobs.hotfix.outputs.pushed }}

jobs:
  # The same check as the one in the hotfix job, run first and outside the
  # hotfix-<project> lock. The deploy gate's signed request is good for five
  # minutes, and the hotfix job can wait longer than that behind another
  # hotfix of the same app. This job claims the request's one-time id for this
  # run attempt while it is fresh, so the hotfix job's own check, once it gets
  # the lock, finds the id held by this attempt and goes ahead (see
  # src/authorize-actor.js). Every other account is checked here too, so a run
  # that would be refused stops before it waits for the lock.
  #
  # It is not the check that guards the push. "Re-run failed jobs" reuses this
  # job's earlier result and runs only the hotfix job, whose own check, as its
  # first step after the checkouts, is the one that counts for a re-run.
  authorize:
    name: Authorize before waiting for the hotfix lock
    runs-on: ubuntu-latest
    # A backstop, as for promote's lookup. Nothing here changes anything, and
    # when this job stops the hotfix job is skipped.
    timeout-minutes: 10
    # OIDC: app-info from DynamoDB and the claim at gate-claim-url, as in the
    # hotfix job below.
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_NAME: ${{ inputs.project-name }}
    steps:
      - name: Configure AWS credentials for app-info
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::056154071827:role/GitHubDeployECS

      # The same lookup as the hotfix job's, kept the same by a test.
      - name: Look up app info (production)
        id: app-info
        run: |
          info=$(aws dynamodb get-item --region us-east-1 --output json \
            --table-name CruApplicationInfo \
            --key "$(jq -n --arg project "$PROJECT_NAME" --arg environment production \
              '{Project: {S: $project}, Environment: {S: $environment}}')")
          item=$(echo "$info" | jq -c '.Item // empty')
          if [ -z "$item" ]; then
            echo "::error title=no_production::${PROJECT_NAME//[$'\r\n']/ } has no CruApplicationInfo row for 'production', so there is no production release to hotfix. Nothing was pushed"
            exit 1
          fi
          # Repository is written only when the app repo is not named after the project.
          repository=$(echo "$item" | jq -r --arg default "CruGlobal/$PROJECT_NAME" '.Repository.S // $default')
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "::notice::app-info $PROJECT_NAME/production -> repository=$repository"

      - name: Checkout Cru Actions & Workflows
        uses: actions/checkout@v7
        with:
          repository: CruGlobal/.github
          ref: ${{ inputs.workflow-ref }}
          path: cru-github-actions

      - name: Authorize actor
        uses: ./cru-github-actions/actions/authorize-actor
        with:
          github-token: ${{ secrets.authz-token }}
          repository: ${{ steps.app-info.outputs.repository }}
          operation: cut a hotfix for
          trusted-automation-actor-ids: ${{ inputs.trusted-automation-actor-ids }}
          refused-actor-ids: ${{ inputs.refused-actor-ids }}
          gate-claim-url: ${{ inputs.gate-claim-url }}
          gate-claim-audience: ${{ inputs.gate-claim-audience }}
          gate-actor-id: ${{ inputs.gate-actor-id }}
          signed-request: ${{ inputs.signed-request }}
          gate-public-keys: ${{ inputs.gate-public-keys }}
          gate-issuer: ${{ inputs.gate-issuer }}
          gate-audience: ${{ inputs.gate-audience }}
          expected-app: ${{ inputs.project-name }}
          expected-action: hotfix
          expected-target: ${{ inputs.commit }}
          refusal-title: actor_not_allowed

  hotfix:
    name: Cut the hotfix branch and build it
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One hotfix run per app at a time, so two fixes for one release never race
    # to create or extend the same branch. Not the production lock: a hotfix
    # run changes no environment, and sharing that group would let a hotfix
    # dispatch cancel a promote or rollback that is waiting for it.
    concurrency:
      group: hotfix-${{ inputs.project-name }}
      cancel-in-progress: false
    # OIDC: the job assumes GitHubDeployECS to read app-info from DynamoDB,
    # as promote's lookup does, and the authz action's claim at
    # gate-claim-url sends an OIDC token too. contents: read lets it check
    # this repo out for the actions. Everything on the app repo uses
    # authz-token.
    permissions:
      id-token: write
      contents: read
    outputs:
      branch: ${{ steps.cut.outputs.branch }}
      head-sha: ${{ steps.cut.outputs.head-sha }}
      pushed: ${{ steps.cut.outputs.pushed }}
    env:
      PROJECT_NAME: ${{ inputs.project-name }}
    steps:
      # app-info straight from the CruApplicationInfo table, as promote reads
      # it, for the app repo's name. The table is keyed by legacy env names.
      - name: Configure AWS credentials for app-info
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::056154071827:role/GitHubDeployECS

      # No production row means no production release, so nothing to hotfix:
      # a pre-release (stage-only) app, or one whose production directory has
      # not been applied yet.
      - name: Look up app info (production)
        id: app-info
        run: |
          info=$(aws dynamodb get-item --region us-east-1 --output json \
            --table-name CruApplicationInfo \
            --key "$(jq -n --arg project "$PROJECT_NAME" --arg environment production \
              '{Project: {S: $project}, Environment: {S: $environment}}')")
          item=$(echo "$info" | jq -c '.Item // empty')
          if [ -z "$item" ]; then
            echo "::error title=no_production::${PROJECT_NAME//[$'\r\n']/ } has no CruApplicationInfo row for 'production', so there is no production release to hotfix. Nothing was pushed"
            exit 1
          fi
          # Repository is written only when the app repo is not named after the project.
          repository=$(echo "$item" | jq -r --arg default "CruGlobal/$PROJECT_NAME" '.Repository.S // $default')
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "::notice::app-info $PROJECT_NAME/production -> repository=$repository"

      - name: Checkout Cru Actions & Workflows
        uses: actions/checkout@v7
        with:
          repository: CruGlobal/.github
          ref: ${{ inputs.workflow-ref }}
          path: cru-github-actions

      # The same check promote and rollback run, and the first thing that
      # touches the app repo. It is in the job that does everything, so "Re-run
      # failed jobs" runs it again for whoever pressed re-run. The cut step
      # below refuses to push unless it passed in this job. On a run the deploy
      # gate started, the authorize job claimed the request's one-time id
      # before this job waited for the lock, so here the claim answers that
      # this attempt already holds it, even if the request has expired since.
      - name: Authorize actor
        uses: ./cru-github-actions/actions/authorize-actor
        with:
          github-token: ${{ secrets.authz-token }}
          repository: ${{ steps.app-info.outputs.repository }}
          operation: cut a hotfix for
          trusted-automation-actor-ids: ${{ inputs.trusted-automation-actor-ids }}
          refused-actor-ids: ${{ inputs.refused-actor-ids }}
          gate-claim-url: ${{ inputs.gate-claim-url }}
          gate-claim-audience: ${{ inputs.gate-claim-audience }}
          gate-actor-id: ${{ inputs.gate-actor-id }}
          signed-request: ${{ inputs.signed-request }}
          gate-public-keys: ${{ inputs.gate-public-keys }}
          gate-issuer: ${{ inputs.gate-issuer }}
          gate-audience: ${{ inputs.gate-audience }}
          expected-app: ${{ inputs.project-name }}
          expected-action: hotfix
          expected-target: ${{ inputs.commit }}
          refusal-title: actor_not_allowed

      # Full history: the cut checks ancestry against the default branch and
      # reads any existing hotfix branch. The token stays in this checkout's
      # git config so the cut step can push; the checkout's post step removes
      # it when the job ends.
      - name: Checkout the app repo
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.app-info.outputs.repository }}
          token: ${{ secrets.authz-token }}
          fetch-depth: 0
          path: app

      - name: Cut the hotfix branch
        id: cut
        uses: ./cru-github-actions/actions/hotfix
        with:
          mode: cut
          path: app
          project-name: ${{ inputs.project-name }}
          commit: ${{ inputs.commit }}
          expected-release: ${{ inputs.expected-release }}

      # The app's own pipeline-v2.yml, as it is on the hotfix branch, builds the
      # candidate and sends it to release-candidate. It is dispatched even when
      # the branch already had a cherry-pick of the fix: an earlier run may
      # have pushed and then failed here, and a build of a commit already built
      # reuses its candidate.
      # The dispatch action falls back to main when it is given no ref, so an
      # empty branch output must never reach it.
      - name: Build the hotfix branch
        id: dispatch
        if: steps.cut.outputs.branch != ''
        uses: ./cru-github-actions/actions/dispatch
        with:
          github-token: ${{ secrets.authz-token }}
          repo: ${{ steps.app-info.outputs.repository }}
          workflow: pipeline-v2.yml
          ref: ${{ steps.cut.outputs.branch }}
          inputs-json: '{}'

      - name: Explain a failed build dispatch
        if: failure() && steps.dispatch.outcome == 'failure'
        env:
          BRANCH: ${{ steps.cut.outputs.branch }}
          REPOSITORY: ${{ steps.app-info.outputs.repository }}
        run: |
          echo "::error title=dispatch_failed::$BRANCH is on $REPOSITORY, but dispatching its pipeline-v2.yml failed (see the step above). A 403 or 404 there means authz-token cannot dispatch workflows on the app repo (it needs actions: write). Fix that and re-run this workflow, or run the app's Pipeline v2 workflow on $BRANCH by hand. The branch stays as it is"
          exit 1

      - name: Report the app's CI on the hotfix branch
        if: ${{ !cancelled() && steps.cut.outcome == 'success' }}
        continue-on-error: true
        uses: ./cru-github-actions/actions/hotfix
        with:
          mode: report
          github-token: ${{ secrets.authz-token }}
          repository: ${{ steps.app-info.outputs.repository }}
          branch: ${{ steps.cut.outputs.branch }}
          sha: ${{ steps.cut.outputs.head-sha }}
          pushed: ${{ steps.cut.outputs.pushed }}
          dispatch-outcome: ${{ steps.dispatch.outcome }}
