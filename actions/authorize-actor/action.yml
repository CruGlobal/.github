name: Authorize Actor
description: >-
  Refuse a production change unless the account that started this run attempt
  is allowed to make it (pipeline v2 promote and rollback). The account checked
  is the runner's GITHUB_TRIGGERING_ACTOR, so a re-run is checked as the person
  who pressed re-run, not the account that started the first attempt. It
  passes when that account has admin, maintain or write on the app repo, or
  when it is an allowlisted automation account that also started the run. It
  fails closed: an API error or an unexpected response is a refusal. Optional
  inputs add a deploy gate (a signed request, only for an attempt the gate's
  own account started), a break-glass team and a list of refused accounts, and
  can turn the push-access path off. With none of them set it behaves exactly
  as before they existed.
inputs:
  github-token:
    description: >-
      GitHub token that can read collaborator permissions on the app repo.
      With break-glass-team set, it must also be able to read that team, its
      membership and its child teams (read:org).
    required: true
  repository:
    description: App repo in "owner/name" form.
    required: true
  operation:
    description: What the run is about to do, used in messages, e.g. promote or roll back.
    required: true
  trusted-automation-actor-ids:
    description: >-
      Comma-separated numeric GitHub user ids of automation accounts allowed
      without push access on the app repo. One passes only when it started the
      run and also started this attempt. Empty allows none.
    required: false
    default: ''
  refusal-title:
    description: >-
      Title for the error a refusal posts, e.g. a fixed reason word that a
      caller's automation reads from the run's annotations. Empty posts the
      error with no title, as before.
    required: false
    default: ''
  gate-actor-id:
    description: >-
      Numeric GitHub user id of the machine account the deploy gate starts
      runs as. An attempt that this account started (it started the run and
      this attempt) must carry a valid signed-request whose one-time request
      id this run attempt can claim through gate-claim-url, or it is refused.
      Without gate-claim-url, every such attempt is refused. A re-run that
      someone else started is checked like any other account.
      This id may not also be in trusted-automation-actor-ids. Empty turns the
      gate check off; listing the gate's id in refused-actor-ids does not,
      because the gate is checked before that list.
    required: false
    default: ''
  signed-request:
    description: >-
      The deploy gate's signed request for this run: a compact JWS signed with
      ES256. Used only on an attempt the gate-actor-id account started. The
      format is described in src/v2/signed-request.js. A request that has
      expired still passes in a later job of the run attempt that claimed it
      while it was fresh, for up to two hours past its expiry, so a job that
      waited for the production lock can go ahead.
    required: false
    default: ''
  gate-public-keys:
    description: >-
      One or more PEM public keys (P-256, "-----BEGIN PUBLIC KEY-----"), one
      after another. A signed request passes when any of them verifies it, so
      a key rotation can list the old key and the new one. A fixed value in
      the calling workflow, never a workflow_dispatch input.
    required: false
    default: ''
  gate-issuer:
    description: The iss claim a signed request must carry.
    required: false
    default: ''
  gate-audience:
    description: The aud claim a signed request must carry.
    required: false
    default: ''
  expected-app:
    description: >-
      The project name this run changes. A signed request's app claim must
      equal it.
    required: false
    default: ''
  expected-action:
    description: >-
      What this run does, one of promote, rollback or hotfix. A signed
      request's action claim must equal it. Separate from operation, which is
      free text for messages.
    required: false
    default: ''
  expected-target:
    description: >-
      What this run applies: the candidate tag for a promote, the release tag
      for a rollback, the commit sha for a hotfix. A signed request's target
      claim must equal it exactly.
    required: false
    default: ''
  gate-claim-url:
    description: >-
      The deploy gate's claim route, an https URL such as
      https://gate.example.com/gate/claim. On an attempt the gate-actor-id
      account started, the signed request's one-time request id is claimed
      for this run attempt there, with a GitHub OIDC token for
      gate-claim-audience, so the job needs permissions: id-token: write.
      The gate takes the run from the token. Empty sets up no claim, so every
      signed request is refused. A value that is not an https URL refuses
      every run. Set it, gate-claim-audience and gate-public-keys as fixed
      values in the calling workflow, never from a workflow_dispatch input:
      whoever can choose them can choose a claim route that says yes to
      anything, or keys of their own.
    required: false
    default: ''
  gate-claim-audience:
    description: >-
      The audience of the OIDC token sent to gate-claim-url, which the deploy
      gate requires. Needed when gate-claim-url is set; ignored when it is
      not.
    required: false
    default: ''
  refused-actor-ids:
    description: >-
      Comma or newline separated numeric GitHub user ids that may not pass as
      allowlisted automation, by break-glass or by push access, even when they
      would otherwise. Only the deploy gate is checked before this list. An
      entry that is not a number is a refusal. Empty refuses none.
    required: false
    default: ''
  break-glass-team:
    description: >-
      A team as "org/team-slug", e.g. example-org/ops-team. An active member
      passes; a pending invitation does not. A team with child teams is
      refused, because GitHub counts the members of a child team as members of
      the team. A team that cannot be found, or that the token cannot see,
      posts a warning each time it is checked. Empty turns break-glass off.
    required: false
    default: ''
  allow-push-access:
    description: >-
      "true" lets an account with admin, maintain or write on the app repo
      pass, as before. "false" turns that off, so only the deploy gate,
      allowlisted automation and break-glass can pass. Anything else, an
      empty value included, is a refusal.
    required: false
    default: 'true'
outputs:
  passed-as:
    description: >-
      How this attempt passed: "gate" (the deploy gate's account with a valid
      signed request), "automation" (an allowlisted automation account that
      started the run and this attempt), "break-glass" (an active member of
      break-glass-team) or "push-access". Unset on a refusal, since the step
      fails.
runs:
  using: 'node24'
  main: '../../dist/authorize-actor.js'
