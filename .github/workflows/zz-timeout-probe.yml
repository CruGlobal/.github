name: Timeout probe

# Temporary. Shows how a job that hits its timeout-minutes reports to a job
# that needs it, and to a step inside it. Removed again before this branch is
# merged.

on:
  push:
    branches: [fix/v2-job-time-limits]
    paths: ['.github/workflows/zz-timeout-probe.yml']

permissions: {}

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: sleep 120

      - name: Report the job status
        if: failure() || cancelled()
        run: echo "job.status=${{ job.status }}"

  after:
    needs: slow
    if: ${{ !cancelled() && needs.slow.result == 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "after ran, needs.slow.result=${{ needs.slow.result }}"
