name: Deploy Candidate

# Deploy a candidate artifact to the release-candidate environment. This path is
# automated by design (a merged change flows to release-candidate without a human
# gate), so there is NO authorization step here — unlike promote / rollback.
#
# Multi-provider router (D9 pattern at job level): a `lookup` job fetches app-info
# once and outputs the provider + type + project-id; provider-specific jobs are
# gated on `needs.lookup.outputs.provider`. Only one provider job runs per app.
# The release-candidate-<project> concurrency lock lives on each provider job, so
# whichever one runs holds the lock (they share the group; only one ever runs).

on:
  workflow_call:
    inputs:
      workflow-ref:
        type: string
        required: false
        default: main
        description: Branch, tag or commit of CruGlobal/.github to check the actions out at.
      project-name:
        type: string
        required: true
        description: Project name (shared-registry repo/image).
      tag:
        type: string
        required: true
        description: Candidate tag to deploy, e.g. candidate-2026-07-23-10056.
      force:
        type: boolean
        required: false
        default: false
        description: >-
          Deploy even when release-candidate already runs this exact digest.
          Without it the deploy no-ops when nothing would change — which makes
          scheduled (nightly-cadence) app workflows safe to dispatch
          unconditionally. Force a same-digest redeploy to pick up out-of-band
          changes (e.g. an applied Terraform task-definition template).
    secrets:
      datadog-api-key:
        required: true
        description: DataDog API key.
      slack-bot-token:
        required: false
        description: Slack bot token for pipeline notifications; unset disables posting.

jobs:
  # app-info: per-app metadata from the v1 info service. The service only knows
  # legacy environment names, so the v2 long name is translated first
  # (release-candidate -> staging). Provider must be gcp or aws.
  lookup:
    name: Look up app info
    runs-on: ubuntu-latest
    outputs:
      provider: ${{ steps.app-info.outputs.provider }}
      type: ${{ steps.app-info.outputs.type }}
      project-id: ${{ steps.app-info.outputs.project-id }}
      slack-channel: ${{ steps.app-info.outputs.slack-channel }}
    steps:
      - name: Look up app info
        id: app-info
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          V2_ENV: release-candidate
        run: |
          case "$V2_ENV" in
            release-candidate) legacy_env=staging ;;
            production) legacy_env=production ;;
            preview) legacy_env=lab ;;
            *) echo "::error::unknown v2 environment $V2_ENV"; exit 1 ;;
          esac
          info=$(curl -fsSL "https://93sm7cu7ne.execute-api.us-east-1.amazonaws.com/prod/info?project=${PROJECT_NAME}&environment=${legacy_env}")
          provider=$(echo "$info" | jq -r '.Provider')
          type=$(echo "$info" | jq -r '.Type // empty')
          project_id=$(echo "$info" | jq -r '.ProjectId // empty')
          slack_channel=$(echo "$info" | jq -r '.SlackChannel // empty')
          case "$provider" in
            gcp|aws) ;;
            *) echo "::error::unsupported provider '$provider' for $PROJECT_NAME (expected gcp or aws)"; exit 1 ;;
          esac
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "project-id=$project_id" >> "$GITHUB_OUTPUT"
          echo "slack-channel=$slack_channel" >> "$GITHUB_OUTPUT"
          echo "::notice::app-info $PROJECT_NAME/$V2_ENV -> provider=$provider type=$type project=$project_id"

  deploy-candidate-gcp:
    name: Deploy Candidate to release-candidate (Cloud Run)
    needs: lookup
    if: needs.lookup.outputs.provider == 'gcp'
    runs-on: ubuntu-latest
    concurrency:
      group: release-candidate-${{ inputs.project-name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_NAME: ${{ inputs.project-name }}
      ENVIRONMENT: release-candidate
      DD_API_KEY: ${{ secrets.datadog-api-key }}
    steps:
      - name: Checkout Cru Actions & Workflows
        uses: actions/checkout@v7
        with:
          repository: CruGlobal/.github
          ref: ${{ inputs.workflow-ref }}
          path: cru-github-actions

      # Telemetry must never fail a deploy: pinned CLI major, --no-fail, and
      # continue-on-error guard against upstream CLI changes and Datadog outages.
      - name: Tag Datadog pipeline
        continue-on-error: true
        run: npx @datadog/datadog-ci@5 tag --level pipeline --no-fail --tags "service:$PROJECT_NAME" --tags "environment:$ENVIRONMENT" --tags "tag:${{ inputs.tag }}" --tags "version:${{ inputs.tag }}" || echo "::warning title=Datadog telemetry failed::pipeline tag for $PROJECT_NAME (release-candidate) not applied (non-blocking)"

      - name: Configure GCP credentials
        uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: cru-deploy@${{ needs.lookup.outputs.project-id }}.iam.gserviceaccount.com

      - name: Resolve candidate image
        uses: ./cru-github-actions/actions/resolve-image
        id: resolve
        with:
          type: cloudrun
          project-name: ${{ inputs.project-name }}
          mode: tag
          tag: ${{ inputs.tag }}

      # Idempotency: if release-candidate already runs this exact digest, the
      # deploy is a no-op (unless force). continue-on-error — a fresh env with no
      # deployed image resolves nothing, which simply means "not deployed yet".
      - name: Check image currently on release-candidate
        uses: ./cru-github-actions/actions/resolve-image
        id: current
        continue-on-error: true
        with:
          type: cloudrun
          project-name: ${{ inputs.project-name }}
          mode: environment
          environment: release-candidate
          runtime-project: ${{ needs.lookup.outputs.project-id }}

      - name: No-op guard (already deployed)
        id: noop
        env:
          WANT: ${{ steps.resolve.outputs.digest }}
          HAVE: ${{ steps.current.outputs.digest }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" != "true" ] && [ -n "$HAVE" ] && [ "$HAVE" = "$WANT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already deployed::release-candidate already runs ${{ inputs.tag }} ($WANT); skipping (set force to redeploy)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record deploy start
        if: steps.noop.outputs.skip != 'true'
        run: echo "DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Deploy to release-candidate
        if: steps.noop.outputs.skip != 'true'
        uses: ./cru-github-actions/actions/deploy
        with:
          type: cloudrun
          project-name: ${{ inputs.project-name }}
          environment: release-candidate
          runtime-project: ${{ needs.lookup.outputs.project-id }}
          image: ${{ steps.resolve.outputs.image }}

      - name: Record deployment event in Datadog
        if: steps.noop.outputs.skip != 'true'
        continue-on-error: true
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          ACTOR: ${{ github.actor }}
        run: |
          # sha-<gitsha> tag on the resolved digest -> sha:<gitsha> event tag, so
          # events are joinable to commits (deployments-ledger precursor). Omitted
          # cleanly when the digest carries no sha- tag.
          gitsha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          jq -n \
            --arg title "Deployed: $PROJECT_NAME ${{ inputs.tag }} to release-candidate" \
            --arg text "Pipeline v2 candidate deploy (started $DEPLOY_STARTED_AT)" \
            --arg service "$PROJECT_NAME" \
            --arg actor "$ACTOR" \
            --arg gitsha "$gitsha" \
            '{title: $title, text: $text, alert_type: "info",
              aggregation_key: ("deploy:" + $service + ":release-candidate"),
              tags: (["source:cru-pipeline-v2", ("service:" + $service),
                     "environment:release-candidate", "action:deploy",
                     "revision:${{ inputs.tag }}", ("actor:" + $actor)]
                     + (if $gitsha != "" then ["sha:" + $gitsha] else [] end))}' \
          | curl -fsS --retry 3 -X POST "https://api.datadoghq.com/api/v1/events" \
              -H "Content-Type: application/json" -H "DD-API-KEY: $DD_API_KEY" -d @- \
            || echo "::warning title=Datadog telemetry failed::candidate deploy event for $PROJECT_NAME ${{ inputs.tag }} not recorded (non-blocking)"

      # The deployments-ledger write grant lives on the existing deploy roles
      # (ratified: no dedicated ledger role). GCP jobs carry no AWS creds, so
      # assume a deploy role here solely to append the ledger event -- ECS is
      # chosen arbitrarily; the trust is cru-deploy-repo-scoped, not runtime-
      # scoped. Placed AFTER all GCP deploy/tag-image steps so its AWS
      # credential env vars can't interfere; configure-aws-credentials next to
      # an earlier google-github-actions/auth is fine (different env vars).
      - name: Configure AWS credentials for ledger
        if: steps.noop.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::056154071827:role/GitHubDeployECS

      # Append the event to the CruDeploymentLedger DynamoDB table (app-info's
      # deployments ledger -- the fleet dashboard / DORA data spine). Same
      # policy as all telemetry: NEVER fails the deploy.
      - name: Record deployment in ledger
        if: steps.noop.outputs.skip != 'true'
        continue-on-error: true
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          ACTOR: ${{ github.actor }}
          REVISION: ${{ inputs.tag }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          gitsha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          aws dynamodb put-item --region us-east-1 \
            --table-name CruDeploymentLedger \
            --item "$(jq -n \
              --arg project "$PROJECT_NAME" \
              --arg eventat "${now}#${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --arg eventdate "${now%%T*}" \
              --arg environment release-candidate \
              --arg action deploy \
              --arg source cru-pipeline-v2 \
              --arg revision "$REVISION" \
              --arg digest "$DIGEST" \
              --arg sha "$gitsha" \
              --arg actor "$ACTOR" \
              --arg runid "$GITHUB_RUN_ID" \
              --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg provider gcp \
              --arg type cloudrun \
              '{Project: {S: $project}, EventAt: {S: $eventat}, EventDate: {S: $eventdate},
                Environment: {S: $environment}, Action: {S: $action}, Source: {S: $source},
                Revision: {S: $revision}, Digest: {S: $digest}, Actor: {S: $actor},
                RunId: {S: $runid}, RunUrl: {S: $runurl}, Provider: {S: $provider},
                Type: {S: $type}}
                + (if $sha != "" then {Sha: {S: $sha}} else {} end)')" \
            || echo "::warning title=Ledger write failed::candidate deploy event for $PROJECT_NAME $REVISION not recorded in ledger (non-blocking)"

      - if: steps.noop.outputs.skip != 'true'
        run: echo "::notice title=Candidate Deployed::$PROJECT_NAME ${{ inputs.tag }} -> release-candidate"

      # Notify Slack (success only; NEVER fails the deploy -- telemetry policy).
      # Destination = the app's SlackChannel from app-info (channel #name/C… or
      # user U…); no-ops silently when the channel OR the bot token is unset.
      # The "changes since production" compare link is ledger-powered: the latest
      # production event's Sha (public GET on /deployments) vs this candidate's
      # sha- tag; omitted when either sha is missing. Compare-link repo is assumed
      # to equal the project name (true for the v2 pilots).
      - name: Notify Slack
        if: steps.noop.outputs.skip != 'true'
        continue-on-error: true
        env:
          SLACK_CHANNEL: ${{ needs.lookup.outputs.slack-channel }}
          SLACK_BOT_TOKEN: ${{ secrets.slack-bot-token }}
          TAGS: ${{ steps.resolve.outputs.tags }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_CHANNEL" ] || [ -z "$SLACK_BOT_TOKEN" ]; then
            exit 0
          fi
          candidate_sha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          prod_sha=$(curl -fsS "https://93sm7cu7ne.execute-api.us-east-1.amazonaws.com/prod/deployments?project=${PROJECT_NAME}&environment=production&limit=1" 2>/dev/null | jq -r '.Items[0].Sha // empty' 2>/dev/null || true)
          payload=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg project "$PROJECT_NAME" \
            --arg tag "${{ inputs.tag }}" \
            --arg prodsha "$prod_sha" \
            --arg candidatesha "$candidate_sha" \
            --arg runurl "$RUN_URL" \
            '{channel: $channel,
              text: (":package: *\($project) `\($tag)` is on release-candidate*"
                     + (if $prodsha != "" and $candidatesha != ""
                        then "\n<https://github.com/CruGlobal/\($project)/compare/\($prodsha)...\($candidatesha)|changes since production>"
                        else "" end)
                     + "\nPromote: <https://github.com/CruGlobal/cru-deploy/actions/workflows/promote.yml|Promote (v2) dispatch>"
                     + "\n\($runurl)")}')
          response=$(curl -fsS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload") || { echo "::warning title=Slack notify failed::post failed (non-blocking)"; exit 0; }
          echo "$response" | jq -e '.ok' >/dev/null || { echo "::warning title=Slack notify failed::$(echo "$response" | jq -r '.error // "post failed"') (non-blocking)"; }

  deploy-candidate-aws:
    name: Deploy Candidate to release-candidate (AWS)
    needs: lookup
    if: needs.lookup.outputs.provider == 'aws'
    runs-on: ubuntu-latest
    concurrency:
      group: release-candidate-${{ inputs.project-name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_NAME: ${{ inputs.project-name }}
      ENVIRONMENT: release-candidate
      DD_API_KEY: ${{ secrets.datadog-api-key }}
    steps:
      - name: Checkout Cru Actions & Workflows
        uses: actions/checkout@v7
        with:
          repository: CruGlobal/.github
          ref: ${{ inputs.workflow-ref }}
          path: cru-github-actions

      # Fail clearly on AWS types not yet implemented in v2 (serverless).
      - name: Guard supported AWS type
        env:
          TYPE: ${{ needs.lookup.outputs.type }}
        run: |
          case "$TYPE" in
            ecs|lambda) ;;
            *) echo "::error::v2 AWS deploys support types 'ecs' and 'lambda' (got '$TYPE'); serverless lands in a later pass."; exit 1 ;;
          esac

      - name: Tag Datadog pipeline
        continue-on-error: true
        run: npx @datadog/datadog-ci@5 tag --level pipeline --no-fail --tags "service:$PROJECT_NAME" --tags "environment:$ENVIRONMENT" --tags "tag:${{ inputs.tag }}" --tags "version:${{ inputs.tag }}" || echo "::warning title=Datadog telemetry failed::pipeline tag for $PROJECT_NAME (release-candidate) not applied (non-blocking)"

      # ECS/Lambda are org-shared in the cruds account (056154071827); one deploy
      # role per type (GitHubDeployECS / GitHubDeployLambda, both cru-deploy-
      # scoped) covers every cluster/function. Unlike cloudrun, AWS derives
      # everything from the env nickname + conventions — no runtime-project.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::056154071827:role/${{ needs.lookup.outputs.type == 'lambda' && 'GitHubDeployLambda' || 'GitHubDeployECS' }}

      - name: Resolve candidate image
        uses: ./cru-github-actions/actions/resolve-image
        id: resolve
        with:
          type: ${{ needs.lookup.outputs.type }}
          project-name: ${{ inputs.project-name }}
          mode: tag
          tag: ${{ inputs.tag }}

      # Idempotency: if release-candidate already runs this exact digest, the
      # deploy is a no-op (unless force). continue-on-error — a fresh env still on
      # the scratch placeholder resolves nothing, which means "not deployed yet".
      - name: Check image currently on release-candidate
        uses: ./cru-github-actions/actions/resolve-image
        id: current
        continue-on-error: true
        with:
          type: ${{ needs.lookup.outputs.type }}
          project-name: ${{ inputs.project-name }}
          mode: environment
          environment: release-candidate

      - name: No-op guard (already deployed)
        id: noop
        env:
          WANT: ${{ steps.resolve.outputs.digest }}
          HAVE: ${{ steps.current.outputs.digest }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" != "true" ] && [ -n "$HAVE" ] && [ "$HAVE" = "$WANT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already deployed::release-candidate already runs ${{ inputs.tag }} ($WANT); skipping (set force to redeploy)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record deploy start
        if: steps.noop.outputs.skip != 'true'
        run: echo "DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Deploy to release-candidate
        if: steps.noop.outputs.skip != 'true'
        uses: ./cru-github-actions/actions/deploy
        with:
          type: ${{ needs.lookup.outputs.type }}
          project-name: ${{ inputs.project-name }}
          environment: release-candidate
          image: ${{ steps.resolve.outputs.image }}

      - name: Record deployment event in Datadog
        if: steps.noop.outputs.skip != 'true'
        continue-on-error: true
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          ACTOR: ${{ github.actor }}
        run: |
          # sha-<gitsha> tag on the resolved digest -> sha:<gitsha> event tag, so
          # events are joinable to commits (deployments-ledger precursor). Omitted
          # cleanly when the digest carries no sha- tag.
          gitsha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          jq -n \
            --arg title "Deployed: $PROJECT_NAME ${{ inputs.tag }} to release-candidate" \
            --arg text "Pipeline v2 candidate deploy (started $DEPLOY_STARTED_AT)" \
            --arg service "$PROJECT_NAME" \
            --arg actor "$ACTOR" \
            --arg gitsha "$gitsha" \
            '{title: $title, text: $text, alert_type: "info",
              aggregation_key: ("deploy:" + $service + ":release-candidate"),
              tags: (["source:cru-pipeline-v2", ("service:" + $service),
                     "environment:release-candidate", "action:deploy",
                     "revision:${{ inputs.tag }}", ("actor:" + $actor)]
                     + (if $gitsha != "" then ["sha:" + $gitsha] else [] end))}' \
          | curl -fsS --retry 3 -X POST "https://api.datadoghq.com/api/v1/events" \
              -H "Content-Type: application/json" -H "DD-API-KEY: $DD_API_KEY" -d @- \
            || echo "::warning title=Datadog telemetry failed::candidate deploy event for $PROJECT_NAME ${{ inputs.tag }} not recorded (non-blocking)"

      # Append the event to the CruDeploymentLedger DynamoDB table (app-info's
      # deployments ledger -- the fleet dashboard / DORA data spine). Same
      # policy as all telemetry: NEVER fails the deploy.
      - name: Record deployment in ledger
        if: steps.noop.outputs.skip != 'true'
        continue-on-error: true
        env:
          TAGS: ${{ steps.resolve.outputs.tags }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          ACTOR: ${{ github.actor }}
          REVISION: ${{ inputs.tag }}
          TYPE: ${{ needs.lookup.outputs.type }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          gitsha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          aws dynamodb put-item --region us-east-1 \
            --table-name CruDeploymentLedger \
            --item "$(jq -n \
              --arg project "$PROJECT_NAME" \
              --arg eventat "${now}#${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --arg eventdate "${now%%T*}" \
              --arg environment release-candidate \
              --arg action deploy \
              --arg source cru-pipeline-v2 \
              --arg revision "$REVISION" \
              --arg digest "$DIGEST" \
              --arg sha "$gitsha" \
              --arg actor "$ACTOR" \
              --arg runid "$GITHUB_RUN_ID" \
              --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg provider aws \
              --arg type "$TYPE" \
              '{Project: {S: $project}, EventAt: {S: $eventat}, EventDate: {S: $eventdate},
                Environment: {S: $environment}, Action: {S: $action}, Source: {S: $source},
                Revision: {S: $revision}, Digest: {S: $digest}, Actor: {S: $actor},
                RunId: {S: $runid}, RunUrl: {S: $runurl}, Provider: {S: $provider},
                Type: {S: $type}}
                + (if $sha != "" then {Sha: {S: $sha}} else {} end)')" \
            || echo "::warning title=Ledger write failed::candidate deploy event for $PROJECT_NAME $REVISION not recorded in ledger (non-blocking)"

      - if: steps.noop.outputs.skip != 'true'
        run: echo "::notice title=Candidate Deployed::$PROJECT_NAME ${{ inputs.tag }} -> release-candidate"

      # Notify Slack (success only; NEVER fails the deploy -- telemetry policy).
      # Destination = the app's SlackChannel from app-info (channel #name/C… or
      # user U…); no-ops silently when the channel OR the bot token is unset.
      # The "changes since production" compare link is ledger-powered: the latest
      # production event's Sha (public GET on /deployments) vs this candidate's
      # sha- tag; omitted when either sha is missing. Compare-link repo is assumed
      # to equal the project name (true for the v2 pilots).
      - name: Notify Slack
        if: steps.noop.outputs.skip != 'true'
        continue-on-error: true
        env:
          SLACK_CHANNEL: ${{ needs.lookup.outputs.slack-channel }}
          SLACK_BOT_TOKEN: ${{ secrets.slack-bot-token }}
          TAGS: ${{ steps.resolve.outputs.tags }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_CHANNEL" ] || [ -z "$SLACK_BOT_TOKEN" ]; then
            exit 0
          fi
          candidate_sha=$(echo "$TAGS" | tr ',' '\n' | grep -E '^sha-' | head -n1 | sed 's/^sha-//' || true)
          prod_sha=$(curl -fsS "https://93sm7cu7ne.execute-api.us-east-1.amazonaws.com/prod/deployments?project=${PROJECT_NAME}&environment=production&limit=1" 2>/dev/null | jq -r '.Items[0].Sha // empty' 2>/dev/null || true)
          payload=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg project "$PROJECT_NAME" \
            --arg tag "${{ inputs.tag }}" \
            --arg prodsha "$prod_sha" \
            --arg candidatesha "$candidate_sha" \
            --arg runurl "$RUN_URL" \
            '{channel: $channel,
              text: (":package: *\($project) `\($tag)` is on release-candidate*"
                     + (if $prodsha != "" and $candidatesha != ""
                        then "\n<https://github.com/CruGlobal/\($project)/compare/\($prodsha)...\($candidatesha)|changes since production>"
                        else "" end)
                     + "\nPromote: <https://github.com/CruGlobal/cru-deploy/actions/workflows/promote.yml|Promote (v2) dispatch>"
                     + "\n\($runurl)")}')
          response=$(curl -fsS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload") || { echo "::warning title=Slack notify failed::post failed (non-blocking)"; exit 0; }
          echo "$response" | jq -e '.ok' >/dev/null || { echo "::warning title=Slack notify failed::$(echo "$response" | jq -r '.error // "post failed"') (non-blocking)"; }
