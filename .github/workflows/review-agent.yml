name: Review Agent

# Reusable AI review check. It runs the review from CruGlobal/agent-review,
# which posts its findings as a comment on the pull request, then a gate job
# reads that comment for this exact commit and fails when a blocker (an open
# finding at blocker-severity or higher) is left. The run's model cost is
# written to the job summary and the cost-usd output.
#
# The repo must be set up for agent-review first (its config in
# .claude/review/config.yml), and the caller passes an Anthropic Console API
# key as the anthropic-api-key secret. This workflow never approves a pull
# request; approval stays with the repo's own rules.
#
# To review only some pull requests, set enabled from an earlier job, such as
# pr-guard's tier output (see the README). Labels are not read here: the
# event's labels are from when the run was queued, and a label added by a
# workflow token never starts a new run. With enabled false the check passes
# and says the review was not required, so it can still be a required check.
#
# The caller's job must grant contents: read, checks: read and pull-requests:
# write.

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: false
        default: standard
        description: Review depth passed to agent-review, such as quick, standard, deep or auto.
      rollout-mode:
        type: string
        required: false
        default: advisory
        description: Must match rollout.mode in the repo's .claude/review/config.yml, or agent-review refuses to run.
      enabled:
        type: boolean
        required: false
        default: true
        description: Run the review. When false the check passes without one, such as for a two-way-door pull request.
      blocker-severity:
        type: number
        required: false
        default: 7
        description: An open finding at this severity (1 to 10) or higher fails the check.
    secrets:
      anthropic-api-key:
        required: true
        description: Anthropic Console API key.
      context-token:
        required: false
        description: Optional token that can read private context repos named in the review config.
    outputs:
      blockers:
        description: Open findings at blocker-severity or higher.
        value: ${{ jobs.gate.outputs.blockers }}
      cost-usd:
        description: Model cost of the review run in US dollars, when the run recorded it.
        value: ${{ jobs.gate.outputs.cost-usd }}

permissions:
  contents: read
  checks: read
  pull-requests: write

jobs:
  review:
    if: inputs.enabled
    uses: CruGlobal/agent-review/.github/workflows/review.yml@v1.1.8
    with:
      mode: ${{ inputs.mode }}
      rollout_mode: ${{ inputs.rollout-mode }}
      auto_approve: false
    secrets:
      anthropic_api_key: ${{ secrets.anthropic-api-key }}
      context_token: ${{ secrets.context-token }}

  gate:
    name: Review blockers
    needs: review
    # Always runs, so the check is never left skipped: it passes when the
    # caller turned the review off, and fails with a reason when the review
    # never reported.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blockers: ${{ steps.gate.outputs.blockers }}
      cost-usd: ${{ steps.cost-value.outputs.cost-usd }}
    steps:
      - name: Review not required
        if: ${{ !inputs.enabled }}
        run: echo "::notice::the caller turned the review off for this pull request, so there is nothing to check"

      - name: Read the run's cost
        id: cost
        if: inputs.enabled
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: agent-review-evidence-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/review-evidence

      - name: Record the cost
        id: cost-value
        if: inputs.enabled
        run: |
          # The execution log is a list of messages; the last "result" one
          # carries the total. A run that never got that far has none.
          file=$(find "$RUNNER_TEMP/review-evidence" -name 'claude-execution-output.json' 2>/dev/null | head -1)
          cost=""
          [ -n "$file" ] && cost=$(jq -r '[.[]? | select(.type == "result") | .total_cost_usd] | last // empty' "$file" 2>/dev/null || true)
          echo "cost-usd=$cost" >> "$GITHUB_OUTPUT"
          echo "### Review cost: ${cost:+\$}${cost:-not recorded}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check for blockers
        id: gate
        if: inputs.enabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          MIN: ${{ inputs.blocker-severity }}
          REVIEW_RESULT: ${{ needs.review.result }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          # Only the bot's own report for this exact commit counts. A comment
          # anyone else wrote, or a report on an older commit, is ignored.
          body=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -sr --arg head "$HEAD" '[.[][] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- agent-review -->")) | select(.body | contains("<!-- agent-review-head: " + $head + " -->")) | .body] | first // empty')
          if [ -z "$body" ] && [ "$FORK" = true ]; then
            echo "::error::no review report for commit $HEAD. A pull request from a fork gets no secrets, so the review cannot run on it; a maintainer has to review it."
            exit 1
          fi
          if [ -z "$body" ]; then
            echo "::error::no review report for commit $HEAD (the review job finished as $REVIEW_RESULT). Re-run the review."
            exit 1
          fi
          ledger=$(printf '%s' "$body" | tr -d '\r' | sed -n 's/^<!-- agent-review-ledger: \(.*\) -->$/\1/p' | head -1)
          if [ -z "$ledger" ] || ! printf '%s' "$ledger" | jq -e 'type == "array"' >/dev/null; then
            echo "::error::the review report for $HEAD has no findings ledger that can be read"
            exit 1
          fi
          blockers=$(printf '%s' "$ledger" | jq --argjson min "$MIN" '[.[] | select(.status == "open" and (.severity | tonumber) >= $min)] | length')
          echo "blockers=$blockers" >> "$GITHUB_OUTPUT"
          echo "### Open blockers: $blockers" >> "$GITHUB_STEP_SUMMARY"
          if [ "$blockers" -gt 0 ]; then
            printf '%s' "$ledger" | jq -r --argjson min "$MIN" '.[] | select(.status == "open" and (.severity | tonumber) >= $min) | "- #\(.n) \(.severity)/10 \(.file // ""):\(.line // "") \(.message // .title // "")"' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$blockers open review finding(s) at severity $MIN or higher. Fix or dismiss them, then re-run the review."
            exit 1
          fi
